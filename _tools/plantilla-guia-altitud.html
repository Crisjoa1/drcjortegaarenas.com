<header class="page-hero">
  <p class="breadcrumb"><a href="/" data-href-en="/en/" data-href-fr="/fr/" data-es="Inicio" data-en="Home" data-fr="Accueil"></a> · <span data-es="Altitud en la CDMX" data-en="Mexico City altitude" data-fr="L’altitude à Mexico"></span></p>
  <h1 class="page-h1" data-es="La <em>altitud</em> en la Ciudad de México" data-en="<em>Altitude</em> in Mexico City" data-fr="L’<em>altitude</em> à Mexico"></h1>
  <p class="page-lead" data-es="La Ciudad de México está a unos 2,240 m (7,350 ft) en la zona central; algunas zonas del sur y del poniente están más altas. Esta altitud puede causar molestias leves en algunos viajeros durante los primeros días, que suelen mejorar solas en 12 a 48 horas si no sube a mayor altura. Esta guía explica qué puede notar, cómo aclimatarse y cuándo buscar atención médica." data-en="Mexico City sits at about 2,240 m (7,350 ft) in its central area; some southern and western areas are higher. This altitude can cause mild symptoms in some travelers during the first days, which usually improve on their own within 12 to 48 hours if you do not go higher. This guide explains what you may notice, how to acclimatize and when to seek medical care." data-fr="Mexico se situe à environ 2 240 m (7 350 pieds) dans sa zone centrale ; certains secteurs du sud et de l’ouest sont plus élevés. Cette altitude peut provoquer des symptômes légers chez certains voyageurs pendant les premiers jours, qui s’améliorent généralement d’eux-mêmes en 12 à 48 heures si vous ne montez pas plus haut. Ce guide explique ce que vous pouvez ressentir, comment vous acclimater et quand consulter un médecin."></p>
</header>

<div class="sep"></div>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Qué puede notar al llegar" data-en="What you may notice on arrival" data-fr="Ce que vous pouvez ressentir à l’arrivée"></h2>
    <p data-es="El mal agudo de montaña suele aparecer por encima de unos 2,500 metros, aunque algunas personas sanas tienen síntomas desde alrededor de 2,000 metros. Cuando aparece, por lo general empieza entre 2 y 12 horas después de llegar, a menudo durante o después de la primera noche. Los síntomas más comunes son:" data-en="Acute mountain sickness usually occurs above about 2,500 meters, although some healthy people have symptoms from around 2,000 meters. When it occurs, it usually starts 2 to 12 hours after arrival, often during or after the first night. The most common symptoms are:" data-fr="Le mal aigu des montagnes survient généralement au-dessus d’environ 2 500 mètres, bien que certaines personnes en bonne santé aient des symptômes dès 2 000 mètres environ. Lorsqu’il survient, il commence habituellement 2 à 12 heures après l’arrivée, souvent pendant ou après la première nuit. Les symptômes les plus fréquents sont :"></p>
    <ul>
      <li data-es="Dolor de cabeza, que es el síntoma principal." data-en="Headache, which is the main symptom." data-fr="Mal de tête, qui est le symptôme principal."></li>
      <li data-es="Cansancio." data-en="Tiredness." data-fr="Fatigue."></li>
      <li data-es="Mareo." data-en="Dizziness." data-fr="Étourdissements."></li>
      <li data-es="Náuseas o falta de apetito." data-en="Nausea or loss of appetite." data-fr="Nausées ou perte d’appétit."></li>
    </ul>
    <p data-es="Las molestias se parecen a las de una resaca y, si no sube a mayor altura, suelen mejorar en 12 a 48 horas." data-en="The symptoms feel similar to a hangover and, if you do not go higher, usually improve within 12 to 48 hours." data-fr="Les symptômes ressemblent à ceux d’une gueule de bois et, si vous ne montez pas plus haut, s’améliorent généralement en 12 à 48 heures."></p>

    <h2 data-es="Cómo aclimatarse" data-en="How to acclimatize" data-fr="Comment vous acclimater"></h2>
    <ul>
      <li data-es="<strong>Vaya con calma:</strong> limite la actividad física a un nivel ligero durante las primeras 48 horas." data-en="<strong>Take it easy:</strong> keep physical activity light during the first 48 hours." data-fr="<strong>Allez-y doucement :</strong> limitez l’activité physique à un niveau léger pendant les 48 premières heures."></li>
      <li data-es="<strong>Alcohol:</strong> evítelo durante las primeras 48 horas." data-en="<strong>Alcohol:</strong> avoid it during the first 48 hours." data-fr="<strong>Alcool :</strong> évitez-le pendant les 48 premières heures."></li>
      <li data-es="<strong>Café:</strong> si lo toma a diario, no lo suspenda de golpe, para evitar un dolor de cabeza por abstinencia." data-en="<strong>Coffee:</strong> if you drink it daily, do not stop suddenly, to avoid a withdrawal headache." data-fr="<strong>Café :</strong> si vous en buvez tous les jours, ne l’arrêtez pas brusquement, afin d’éviter un mal de tête de sevrage."></li>
      <li data-es="<strong>Excursiones a mayor altura:</strong> si planea subir a montañas o volcanes cercanos, hágalo de forma gradual y no suba a dormir más alto si tiene síntomas." data-en="<strong>Trips to higher places:</strong> if you plan to visit nearby mountains or volcanoes, go up gradually and do not go higher to sleep if you have symptoms." data-fr="<strong>Excursions plus en altitude :</strong> si vous prévoyez de visiter des montagnes ou des volcans proches, montez progressivement et ne montez pas dormir plus haut si vous avez des symptômes."></li>
    </ul>

    <h2 data-es="Signos de alarma" data-en="Warning signs" data-fr="Signes d’alerte"></h2>
    <p data-es="Las formas graves del mal de altura son más propias de altitudes mayores. Aun así, llame al 911 o acuda a urgencias si usted o su acompañante presenta:" data-en="Severe forms of altitude illness are more typical of higher altitudes. Even so, call 911 or go to an emergency room if you or your companion has:" data-fr="Les formes graves du mal de l’altitude sont plus typiques des altitudes plus élevées. Malgré tout, appelez le 911 ou rendez-vous aux urgences si vous ou la personne qui vous accompagne présentez :"></p>
    <ul>
      <li data-es="Confusión, somnolencia, comportamiento extraño o dificultad para caminar en línea recta." data-en="Confusion, drowsiness, unusual behavior or trouble walking in a straight line." data-fr="Confusion, somnolence, comportement inhabituel ou difficulté à marcher en ligne droite."></li>
      <li data-es="Falta de aire en reposo, tos persistente, opresión en el pecho o flemas con sangre." data-en="Shortness of breath at rest, a persistent cough, chest tightness or blood-tinged sputum." data-fr="Essoufflement au repos, toux persistante, oppression thoracique ou crachats teintés de sang."></li>
      <li data-es="Dolor de cabeza intenso que empeora a pesar del reposo." data-en="A severe headache that gets worse despite rest." data-fr="Mal de tête intense qui s’aggrave malgré le repos."></li>
      <li data-es="Vómito persistente." data-en="Persistent vomiting." data-fr="Vomissements persistants."></li>
    </ul>

    <h2 data-es="Quién debe consultar antes de viajar" data-en="Who should see a doctor before traveling" data-fr="Qui doit consulter avant de voyager"></h2>
    <p data-es="Pida una valoración médica antes del viaje, aunque su enfermedad esté controlada, si:" data-en="Get a medical assessment before your trip, even if your condition is under control, if you:" data-fr="Demandez une évaluation médicale avant votre voyage, même si votre maladie est bien contrôlée, si vous :"></p>
    <ul>
      <li data-es="Tiene una enfermedad del corazón, o tuvo un infarto o un evento vascular cerebral en los últimos 90 días." data-en="Have heart disease, or had a heart attack or stroke in the past 90 days." data-fr="Avez une maladie cardiaque, ou avez eu un infarctus ou un AVC au cours des 90 derniers jours."></li>
      <li data-es="Tiene EPOC moderada o grave, u otra enfermedad pulmonar crónica." data-en="Have moderate or severe COPD or another chronic lung disease." data-fr="Avez une BPCO modérée ou sévère, ou une autre maladie pulmonaire chronique."></li>
      <li data-es="Tiene apnea obstructiva del sueño grave." data-en="Have severe obstructive sleep apnea." data-fr="Avez une apnée obstructive du sommeil sévère."></li>
      <li data-es="Tiene un embarazo de alto riesgo, o está embarazada y planea dormir por encima de unos 3,050 m." data-en="Have a high-risk pregnancy, or are pregnant and plan to sleep above about 3,050 m (10,000 ft)." data-fr="Vivez une grossesse à haut risque, ou êtes enceinte et prévoyez de dormir au-dessus d’environ 3 050 m."></li>
      <li data-es="Tiene anemia de células falciformes o rasgo falciforme." data-en="Have sickle cell disease or sickle cell trait." data-fr="Avez une drépanocytose ou un trait drépanocytaire."></li>
    </ul>
    <h3 data-es="Medicamentos preventivos" data-en="Preventive medicines" data-fr="Médicaments préventifs"></h3>
    <p data-es="Existen medicamentos para prevenir el mal de altura, pero solo debe indicarlos un médico después de valorar su salud, su itinerario y los medicamentos que ya toma. Para la mayoría de los viajeros que se quedan en la ciudad no suelen ser necesarios. Consulte antes si ya tuvo mal de montaña moderado o grave, edema pulmonar o cerebral de altura, o si planea subir a dormir a más de 2,750 m (por ejemplo, en refugios de volcanes)." data-en="There are medicines to prevent altitude illness, but only a doctor should prescribe them after reviewing your health, your itinerary and the medicines you already take. For most travelers staying in the city they are not usually needed. Talk to a doctor first if you have had moderate or severe altitude sickness, high-altitude pulmonary or cerebral edema, or plan to sleep above 2,750 m (e.g., volcano huts)." data-fr="Il existe des médicaments pour prévenir le mal de l’altitude, mais seul un médecin doit les prescrire après avoir évalué votre santé, votre itinéraire et les médicaments que vous prenez déjà. Pour la plupart des voyageurs qui restent en ville, ils ne sont généralement pas nécessaires. Consultez d’abord un médecin si vous avez déjà eu un mal des montagnes modéré ou sévère, un œdème pulmonaire ou cérébral de haute altitude, ou si vous prévoyez de dormir au-dessus de 2 750 m (par exemple, dans des refuges de volcans)."></p>

    <h2 data-es="Calidad del aire y contingencia ambiental" data-en="Air quality and environmental alerts" data-fr="Qualité de l’air et alertes environnementales"></h2>
    <p data-es="La Ciudad de México tiene días con mala calidad del aire por contaminantes como el ozono y las partículas. La Secretaría del Medio Ambiente (SEDEMA) publica en <a href='https://aire.cdmx.gob.mx/default.php' target='_blank' rel='noopener'>aire.cdmx.gob.mx</a> el Índice AIRE Y SALUD actualizado de forma continua, el pronóstico y los avisos de contingencia ambiental." data-en="Mexico City has days with poor air quality due to pollutants such as ozone and particulate matter. The city's Environment Department (SEDEMA) publishes the continuously updated AIRE Y SALUD index, the forecast and environmental alerts (<em>contingencia ambiental</em>) at <a href='https://aire.cdmx.gob.mx/default.php' target='_blank' rel='noopener'>aire.cdmx.gob.mx</a> (in Spanish)." data-fr="Mexico connaît des jours de mauvaise qualité de l’air dus à des polluants comme l’ozone et les particules. Le Secrétariat à l’Environnement de la ville (SEDEMA) publie sur <a href='https://aire.cdmx.gob.mx/default.php' target='_blank' rel='noopener'>aire.cdmx.gob.mx</a> (en espagnol) l’indice AIRE Y SALUD mis à jour en continu, les prévisions et les alertes environnementales (<em>contingencia ambiental</em>)."></p>
    <p data-es="Consulte las recomendaciones del índice antes de hacer ejercicio al aire libre, sobre todo si hay contingencia ambiental, y sígalas." data-en="Check the index's recommendations before exercising outdoors, especially during an environmental alert, and follow them." data-fr="Consultez les recommandations de l’indice avant de faire de l’exercice en plein air, surtout en cas d’alerte environnementale, et suivez-les."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="¿A qué altura está la Ciudad de México?" data-en="How high is Mexico City?" data-fr="À quelle altitude se trouve Mexico ?"></h3>
      <p data-es="A unos 2,240 m (7,350 ft) sobre el nivel del mar en la zona central; algunas zonas del sur y del poniente están más altas. Algunas personas sanas notan molestias desde alrededor de 2,000 metros, aunque el mal agudo de montaña es más frecuente por encima de 2,500 metros." data-en="About 2,240 m (7,350 ft) above sea level in the central area; some southern and western areas are higher. Some healthy people notice symptoms from around 2,000 meters, although acute mountain sickness is more common above 2,500 meters." data-fr="Environ 2 240 m (7 350 pieds) au-dessus du niveau de la mer dans la zone centrale ; certains secteurs du sud et de l’ouest sont plus élevés. Certaines personnes en bonne santé ressentent des symptômes dès 2 000 mètres environ, bien que le mal aigu des montagnes soit plus fréquent au-dessus de 2 500 mètres."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuánto duran las molestias por la altitud?" data-en="How long do altitude symptoms last?" data-fr="Combien de temps durent les symptômes liés à l’altitude ?"></h3>
      <p data-es="Si son leves y no sube a mayor altura, suelen mejorar en 12 a 48 horas. Si empeoran o aparece un signo de alarma, busque atención médica." data-en="If they are mild and you do not go higher, they usually improve within 12 to 48 hours. If they get worse or a warning sign appears, seek medical care." data-fr="S’ils sont légers et que vous ne montez pas plus haut, ils s’améliorent généralement en 12 à 48 heures. S’ils s’aggravent ou si un signe d’alerte apparaît, consultez un médecin."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Puedo hacer ejercicio en la Ciudad de México?" data-en="Can I exercise in Mexico City?" data-fr="Puis-je faire de l’exercice à Mexico ?"></h3>
      <p data-es="Sí, pero conviene mantener una actividad ligera las primeras 48 horas y revisar el Índice AIRE Y SALUD antes de ejercitarse al aire libre, sobre todo si hay contingencia ambiental." data-en="Yes, but it is best to keep activity light for the first 48 hours and check the AIRE Y SALUD index before exercising outdoors, especially during an environmental alert." data-fr="Oui, mais il est préférable de garder une activité légère pendant les 48 premières heures et de consulter l’indice AIRE Y SALUD avant de faire de l’exercice en plein air, surtout en cas d’alerte environnementale."></p>
    </div>

    <div class="emergency-note" data-es="<strong>Ante una emergencia, llame al 911</strong> o acuda a urgencias hospitalarias. Vea también <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias en la Ciudad de México</a>." data-en="<strong>In an emergency, call 911</strong> or go to a hospital emergency room. See also <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER in Mexico City</a>." data-fr="<strong>En cas d’urgence, appelez le 911</strong> ou rendez-vous aux urgences d’un hôpital. Voir aussi <a href='/fr/guides/urgences-mexico/'>quand aller aux urgences à Mexico</a>."></div>

    <div class="callout" data-solo="fr" data-es="" data-en="" data-fr="<strong>Consultation en espagnol ou en anglais.</strong> Si vous souhaitez une consultation entièrement en français, une assistante de traduction est présente au cabinet ou à l’hôtel (<span data-tarifa='asistente-frances'></span> MXN en supplément ; <span data-tarifa='asistente-frances-hotel-especial'></span> MXN pour une visite à l’hôtel en horaires spéciaux ou un jour férié). Prévenez-nous à l’avance par WhatsApp au +52 595 109 3969 : nous vérifions sa disponibilité (si vous réservez en ligne, cochez aussi l’option). Si vous n’en avez pas besoin, la consultation se déroule en espagnol ou en anglais. <strong>Documents :</strong> le médecin rédige les certificats et résumés en espagnol et en anglais ; si vous avez besoin d’une version en français, l’assistante aide le médecin à la rédiger dans un français correct, avec un supplément, comme pour la version en anglais (500 MXN en PDF, 800 MXN imprimée). Il ne s’agit pas d’une traduction officielle : si votre démarche exige une traduction assermentée, demandez-la à un traducteur assermenté (perito traductor). Non disponible en téléconsultation. Sa présence est couverte par le consentement éclairé, obligatoire avant la consultation. Les échanges par WhatsApp se font en espagnol ou en anglais."></div>

  <aside class="side-card">
    <p data-es="&lt;strong&gt;Ante un signo de alarma, llame al 911.&lt;/strong&gt; Este no es un servicio de urgencias." data-en="&lt;strong&gt;If you have a warning sign, call 911.&lt;/strong&gt; This is not an emergency service." data-fr="&lt;strong&gt;En cas de signe d’alerte, appelez le 911.&lt;/strong&gt; Ce n’est pas un service d’urgences."></p>
