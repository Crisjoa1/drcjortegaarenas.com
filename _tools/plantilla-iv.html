  <h1 class="page-h1" data-es="Hidratación <em>intravenosa</em> en su hotel o domicilio en CDMX" data-en="<em>IV hydration</em> at your hotel or home in Mexico City" data-fr="<em>Hydratation intraveineuse</em> à votre hôtel ou à domicile à Mexico"></h1>
  <p class="page-lead" data-es="La hidratación intravenosa es la administración de soluciones por vena que el Dr. Ortega-Arenas ofrece en su hotel o domicilio en la Ciudad de México, con un cargo del nivel desde $1,800 MXN (la visita y el asistente se cobran aparte) y siempre con valoración médica previa obligatoria. Hay tres niveles; los componentes se ajustan a cada paciente y la terapia solo se aplica si la valoración la justifica." data-en="IV hydration is the delivery of fluids through a vein, offered by Dr. Ortega-Arenas at your hotel or home in Mexico City, with a level fee starting at $1,800 MXN (visit and assistant fees are charged separately) and always after a mandatory prior medical assessment. There are three levels; components are tailored to each patient, and therapy is given only if the assessment justifies it." data-fr="L’hydratation intraveineuse est l’administration de solutés par voie veineuse que le Dr Ortega-Arenas propose à votre hôtel ou à domicile à Mexico, avec un tarif à partir de $1,800 MXN selon le niveau (la visite et les honoraires de l’assistant(e) de perfusion sont facturés en sus), et toujours après une évaluation médicale préalable obligatoire. Il existe trois niveaux ; les composants sont adaptés à chaque patient et la thérapie n’est administrée que si l’évaluation la justifie."></p>

  </div>
  <div class="callout" data-solo="fr" data-es="" data-en="" data-fr="<strong>Consultation en espagnol ou en anglais.</strong> Pour les patients francophones, une assistante de traduction est présente pendant la consultation (<span data-tarifa='asistente-frances'></span> MXN en supplément ; <span data-tarifa='asistente-frances-hotel-especial'></span> MXN pour une visite à l’hôtel en horaires spéciaux ou un jour férié), sous réserve de disponibilité ; prévenez-nous par WhatsApp au +52 595 109 3969 (si vous réservez en ligne, cochez aussi l’option). Non disponible en téléconsultation. Sa présence est couverte par le consentement éclairé, obligatoire avant la consultation. Les échanges par WhatsApp se font en espagnol ou en anglais."></div>

  <article class="prose">
    <h2 data-es="Cómo se realiza" data-en="How it works" data-fr="Déroulement"></h2>
    <ol>
      <li data-es="<strong>Valoración médica previa obligatoria</strong> por el Dr. Ortega-Arenas, en su hotel o domicilio." data-en="<strong>Mandatory prior medical assessment</strong> by Dr. Ortega-Arenas at your hotel or home." data-fr="<strong>Évaluation médicale préalable obligatoire</strong> par le Dr Ortega-Arenas, à votre hôtel ou à domicile."></li>
      <li data-es="Si la terapia no está clínicamente indicada, no se aplica. En ese caso solo se cobran la visita y los materiales de la valoración." data-en="If the therapy is not clinically indicated, it is not given. In that case, only the visit and the materials used in the assessment are charged." data-fr="Si la thérapie n’est pas cliniquement indiquée, elle n’est pas administrée. Dans ce cas, seuls la visite et le matériel utilisé pour l’évaluation sont facturés."></li>
      <li data-es="Si está indicada, usted firma el consentimiento informado." data-en="If it is indicated, you sign the informed consent form." data-fr="Si elle est indiquée, vous signez le formulaire de consentement éclairé."></li>
      <li data-es="Personal asistente calificado coloca la vía intravenosa bajo supervisión directa del médico." data-en="Qualified assistant staff place the IV line under the physician&#39;s direct supervision." data-fr="Un(e) assistant(e) de perfusion qualifié(e) pose la voie veineuse sous la supervision directe du médecin."></li>
    </ol>

    <h2 data-es="Cuándo puede estar indicada" data-en="When it may be indicated" data-fr="Quand elle peut être indiquée"></h2>
    <p data-es="En deshidratación leve a moderada cuando la vía oral no es posible o no basta (por ejemplo, por vómito), según la valoración médica. No se ofrece para bienestar, resaca, energía ni rendimiento." data-en="For mild to moderate dehydration when drinking fluids is not possible or not enough (for example, because of vomiting), as judged at the medical assessment. It is not offered for wellness, hangover, energy or performance." data-fr="En cas de déshydratation légère à modérée lorsque l’hydratation par voie orale n’est pas possible ou ne suffit pas (par exemple, en raison de vomissements), selon l’évaluation médicale. Elle n’est pas proposée pour le bien-être, la gueule de bois, l’énergie ou la performance."></p>

    <h2 data-es="Los tres niveles" data-en="The three levels" data-fr="Les trois niveaux"></h2>
    <p data-es="El cargo del nivel no incluye la visita ni el honorario del asistente. Los componentes se ajustan a cada paciente." data-en="The level fee does not include the visit or the assistant fee. Components are tailored to each patient." data-fr="Le prix du niveau n’inclut ni la visite ni les honoraires de l’assistant(e) de perfusion. Les composants sont adaptés à chaque patient."></p>

    <h3 data-es="Nivel I · Essential Hydration · $1,800 MXN" data-en="Level I · Essential Hydration · $1,800 MXN" data-fr="Niveau I · Essential Hydration · $1,800 MXN"></h3>
    <p data-es="Rehidratación intravenosa básica cuando la valoración clínica la indica. Incluye:" data-en="Basic intravenous rehydration when indicated by clinical assessment. Includes:" data-fr="Réhydratation intraveineuse de base lorsque l’évaluation clinique l’indique. Comprend :"></p>
    <ul>
      <li data-es="Solución fisiológica (IV)" data-en="Saline solution (IV)" data-fr="Sérum physiologique (IV)"></li>
      <li data-es="Vitamina C (oral)" data-en="Vitamin C (oral)" data-fr="Vitamine C (orale)"></li>
    </ul>

    <h3 data-es="Nivel II · Vitamin Hydration · $2,800 MXN" data-en="Level II · Vitamin Hydration · $2,800 MXN" data-fr="Niveau II · Vitamin Hydration · $2,800 MXN"></h3>
    <p data-es="Rehidratación con complejo B y magnesio. Incluye:" data-en="Rehydration with B-complex and magnesium. Includes:" data-fr="Réhydratation avec complexe B et magnésium. Comprend :"></p>
    <ul>
      <li data-es="Todo lo del Nivel I" data-en="Everything in Level I" data-fr="Tout le contenu du niveau I"></li>
      <li data-es="Complejo B (IM)" data-en="B-complex (IM)" data-fr="Complexe B (IM)"></li>
      <li data-es="Magnesio (IV)" data-en="Magnesium (IV)" data-fr="Magnésium (IV)"></li>
    </ul>

    <h3 data-es="Nivel III · Hydration &amp; Symptom Care · $3,900 MXN" data-en="Level III · Hydration &amp; Symptom Care · $3,900 MXN" data-fr="Niveau III · Hydration &amp; Symptom Care · $3,900 MXN"></h3>
    <p data-es="Rehidratación con manejo del dolor y la náusea. Incluye:" data-en="Rehydration with pain and nausea management. Includes:" data-fr="Réhydratation avec prise en charge de la douleur et des nausées. Comprend :"></p>
    <ul>
      <li data-es="Todo lo del Nivel II" data-en="Everything in Level II" data-fr="Tout le contenu du niveau II"></li>
      <li data-es="Glutamina (oral)" data-en="Glutamine (oral)" data-fr="Glutamine (orale)"></li>
      <li data-es="Analgésico y/o antiemético IV, solo si están clínicamente indicados" data-en="IV analgesic and/or antiemetic, only if clinically indicated" data-fr="Antalgique et/ou antiémétique IV, uniquement s’ils sont cliniquement indiqués"></li>
    </ul>

    <p data-es="Sobre los complementos orales (vitamina C y glutamina): no hay evidencia de que mejoren la rehidratación; se entregan solo si el médico lo considera adecuado." data-en="About the oral supplements (vitamin C and glutamine): there is no evidence that they improve rehydration; they are given only if the physician considers it appropriate." data-fr="À propos des compléments oraux (vitamine C et glutamine) : aucune donnée ne montre qu’ils améliorent la réhydratation ; ils ne sont remis que si le médecin le juge approprié."></p>

    <h2 data-es="Cuánto cuesta en total" data-en="Total cost" data-fr="Coût total"></h2>
    <div class="callout">
      <p data-es="<strong>Total = cargo del nivel indicado en la valoración + honorario de visita + honorario de asistente</strong>" data-en="<strong>Total = fee of the level indicated at assessment + visit fee + assistant fee</strong>" data-fr="<strong>Total = prix du niveau indiqué lors de l’évaluation + honoraires de visite + honoraires de l’assistant(e) de perfusion</strong> (+ <span data-tarifa='asistente-frances'></span> MXN si vous demandez l’assistante de traduction ; <span data-tarifa='asistente-frances-hotel-especial'></span> MXN à l’hôtel en horaires spéciaux ou un jour férié)"></p>
    </div>

    <h3 data-es="Honorario de visita" data-en="Visit fee" data-fr="Honoraires de visite"></h3>
    <p data-es="La visita se cobra según la tarifa de hotel o de domicilio, por zona y horario." data-en="The visit is charged at the hotel or house-call rate, by zone and time of day." data-fr="La visite est facturée au tarif hôtel ou au tarif domicile, selon la zone et l’horaire."></p>
    <table>
      <thead><tr>
        <th data-es="Visita a hotel" data-en="Hotel visit" data-fr="Visite à l’hôtel"></th>
        <th style="text-align:right" data-es="Zona A" data-en="Zone A" data-fr="Zone A"></th>
        <th style="text-align:right" data-es="Zona B" data-en="Zone B" data-fr="Zone B"></th>
      </tr></thead>
      <tbody>
        <tr><td data-es="Horario ordinario" data-en="Standard hours" data-fr="Horaire ordinaire"></td><td class="price-col">$2,500</td><td class="price-col">$3,000</td></tr>
        <tr><td data-es="Horario especial" data-en="Special hours" data-fr="Horaire spécial"></td><td class="price-col">$4,000</td><td class="price-col">$4,500</td></tr>
        <tr><td data-es="Festivo" data-en="Holiday" data-fr="Jour férié"></td><td class="price-col">$5,500</td><td class="price-col">$6,000</td></tr>
      </tbody>
    </table>
    <p data-es="Visita a domicilio: desde $1,000 MXN. Los horarios y las zonas se detallan en las &lt;a href='/#tarifas'&gt;tarifas&lt;/a&gt; y en la &lt;a href='/hoteles/'&gt;información para hoteles&lt;/a&gt;." data-en="House call: from $1,000 MXN. Hours and zones are detailed in the &lt;a href='/en/#tarifas'&gt;fees&lt;/a&gt; section and on the &lt;a href='/en/hotels/'&gt;hotel information&lt;/a&gt; page." data-fr="Consultation à domicile : à partir de $1,000 MXN. Les horaires et les zones sont détaillés dans la section des &lt;a href='/fr/#tarifas'&gt;tarifs&lt;/a&gt; et sur la page d’&lt;a href='/fr/hotels/'&gt;informations pour les hôtels&lt;/a&gt;."></p>

    <h3 data-es="Honorario de asistente" data-en="Assistant fee" data-fr="Honoraires de l’assistant(e) de perfusion"></h3>
    <table>
      <thead><tr>
        <th data-es="Horario" data-en="Schedule" data-fr="Horaire"></th>
        <th style="text-align:right" data-es="Honorario" data-en="Fee" data-fr="Honoraires"></th>
      </tr></thead>
      <tbody>
        <tr><td data-es="Ordinario" data-en="Standard" data-fr="Ordinaire"></td><td class="price-col">$1,500</td></tr>
        <tr><td data-es="Especial: noches, festivos tradicionales, domingo y sábado desde las 15:01" data-en="Special: nights, traditional holidays, Sundays and Saturdays from 3:01 pm" data-fr="Spécial : nuits, jours fériés traditionnels, dimanches et samedis à partir de 15 h 01"></td><td class="price-col">$2,500</td></tr>
        <tr><td data-es="Festivos oficiales (24 h)" data-en="Official public holidays (24 hours)" data-fr="Jours fériés officiels (24 h)"></td><td class="price-col">$3,500</td></tr>
      </tbody>

    <h3 data-es="Ejemplo de cálculo" data-en="Example" data-fr="Exemple de calcul"></h3>
    <div class="callout">
      <p data-es="Nivel I + visita a hotel en Zona A en horario ordinario + asistente en horario ordinario: $1,800 + $2,500 + $1,500 = &lt;strong&gt;$5,800 MXN&lt;/strong&gt;." data-en="Level I + hotel visit in Zone A during standard hours + assistant during standard hours: $1,800 + $2,500 + $1,500 = &lt;strong&gt;$5,800 MXN&lt;/strong&gt;." data-fr="Niveau I + visite à l’hôtel en zone A en horaire ordinaire + assistant(e) de perfusion en horaire ordinaire : $1,800 + $2,500 + $1,500 = &lt;strong&gt;$5,800 MXN&lt;/strong&gt;."></p>
    </div>

    <h2 data-es="Riesgos y límites" data-en="Risks and limits" data-fr="Risques et limites"></h2>
    <p data-es="La hidratación intravenosa no sustituye a la vía oral cuando esta es posible. Conlleva riesgos, como flebitis, infiltración y reacciones adversas, y solo se aplica si la valoración médica la justifica. Los componentes se ajustan a cada paciente." data-en="IV hydration does not replace drinking fluids when that is possible. It carries risks, such as phlebitis, infiltration and adverse reactions, and is given only if the medical assessment justifies it. Components are tailored to each patient." data-fr="L’hydratation intraveineuse ne remplace pas l’hydratation par voie orale lorsque celle-ci est possible. Elle comporte des risques, comme la phlébite, l’infiltration et les réactions indésirables, et n’est administrée que si l’évaluation médicale la justifie. Les composants sont adaptés à chaque patient."></p>

    <h2 data-es="Cuándo NO solicitar este servicio" data-en="When NOT to book this service" data-fr="Quand NE PAS demander ce service"></h2>
    <div class="emergency-note" data-es="Si presenta alguno de estos signos, &lt;strong&gt;no solicite este servicio: llame al 911&lt;/strong&gt; o acuda a urgencias hospitalarias: alteración del estado de conciencia (somnolencia, confusión, desmayo), dolor en el pecho, dificultad para respirar, o deshidratación grave (no poder beber ni retener líquidos, casi no orinar, signos de choque)." data-en="If you have any of these signs, &lt;strong&gt;do not book this service: call 911&lt;/strong&gt; or go to a hospital emergency room: altered consciousness (drowsiness, confusion, fainting), chest pain, trouble breathing, or severe dehydration (cannot drink or keep fluids down, passing almost no urine, signs of shock)." data-fr="Si vous présentez l’un de ces signes, &lt;strong&gt;ne demandez pas ce service : appelez le 911&lt;/strong&gt; ou rendez-vous aux urgences d’un hôpital : altération de l’état de conscience (somnolence, confusion, évanouissement), douleur thoracique, difficulté à respirer ou déshydratation grave (impossibilité de boire ou de garder les liquides, quasi-absence d’urine, signes de choc)."></div>
    <h3 data-es="Requieren valoración previa y pueden contraindicar la terapia" data-en="Require prior assessment and may rule out the therapy" data-fr="Nécessitent une évaluation préalable et peuvent contre-indiquer la thérapie"></h3>
    <ul>
      <li data-es="Embarazo de riesgo" data-en="High-risk pregnancy" data-fr="Grossesse à risque"></li>
      <li data-es="Insuficiencia cardiaca o renal conocida" data-en="Known heart or kidney failure" data-fr="Insuffisance cardiaque ou rénale connue"></li>
    </ul>
    <div class="emergency-note" data-es="&lt;strong&gt;No es un servicio de urgencias.&lt;/strong&gt; Ante una emergencia, llame al &lt;strong&gt;911&lt;/strong&gt; o acuda a urgencias hospitalarias." data-en="&lt;strong&gt;This is not an emergency service.&lt;/strong&gt; In an emergency, call &lt;strong&gt;911&lt;/strong&gt; or go to a hospital emergency room." data-fr="&lt;strong&gt;Ce n’est pas un service d’urgences.&lt;/strong&gt; En cas d’urgence, appelez le &lt;strong&gt;911&lt;/strong&gt; ou rendez-vous aux urgences d’un hôpital."></div>

    <h2 data-es="Dónde y cómo reservar" data-en="Where and how to book" data-fr="Où et comment réserver"></h2>
    <p data-es="En su hotel o domicilio en la Ciudad de México. Reserve por WhatsApp al &lt;a href='https://wa.me/525951093969' target='_blank' rel='noopener'&gt;+52 595 109 3969&lt;/a&gt;." data-en="At your hotel or home in Mexico City. Book on WhatsApp at &lt;a href='https://wa.me/525951093969' target='_blank' rel='noopener'&gt;+52 595 109 3969&lt;/a&gt;." data-fr="À votre hôtel ou à domicile à Mexico. Réservez sur WhatsApp au &lt;a href='https://wa.me/525951093969' target='_blank' rel='noopener'&gt;+52 595 109 3969&lt;/a&gt;."></p>

    <p data-es="Tarjeta (Visa, Mastercard, AMEX), Apple Pay, Google Pay, transferencia o efectivo en MXN." data-en="Card (Visa, Mastercard, AMEX), Apple Pay, Google Pay, bank transfer or cash in MXN." data-fr="Carte (Visa, Mastercard, AMEX), Apple Pay, Google Pay, virement ou espèces en MXN."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="¿Necesito receta?" data-en="Do I need a prescription?" data-fr="Ai-je besoin d’une ordonnance ?"></h3>
      <p data-es="No necesita traer una receta. La indicación la define el Dr. Ortega-Arenas en la valoración médica previa, que es obligatoria; sin ella, la terapia no se aplica." data-en="You do not need to bring a prescription. Dr. Ortega-Arenas decides whether it is indicated during the mandatory prior medical assessment; without it, the therapy is not given." data-fr="Vous n’avez pas besoin d’apporter d’ordonnance. Le Dr Ortega-Arenas détermine l’indication lors de l’évaluation médicale préalable, qui est obligatoire ; sans elle, la thérapie n’est pas administrée."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuánto dura?" data-en="How long does it take?" data-fr="Combien de temps dure-t-elle ?"></h3>
      <p data-es="Depende del nivel y de los componentes que se ajusten a su caso. El médico le informa el tiempo estimado en la valoración, antes de que firme el consentimiento informado." data-en="It depends on the level and on the components tailored to your case. The physician tells you the estimated time during the assessment, before you sign the informed consent form." data-fr="Cela dépend du niveau et des composants adaptés à votre cas. Le médecin vous indique la durée estimée lors de l’évaluation, avant que vous ne signiez le formulaire de consentement éclairé."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Qué pasa si no es para mí?" data-en="What if it is not right for me?" data-fr="Et si elle ne me convient pas ?"></h3>
      <p data-es="Si la valoración muestra que la terapia no está clínicamente indicada, no se aplica. Solo se cobran la visita y los materiales de la valoración." data-en="If the assessment shows that the therapy is not clinically indicated, it is not given. Only the visit and the materials used in the assessment are charged." data-fr="Si l’évaluation montre que la thérapie n’est pas cliniquement indiquée, elle n’est pas administrée. Seuls la visite et le matériel utilisé pour l’évaluation sont facturés."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuánto cuesta en total?" data-en="What is the total cost?" data-fr="Quel est le coût total ?"></h3>
      <p data-es="Cargo del nivel + honorario de visita + honorario de asistente. Por ejemplo, Nivel I con visita a hotel en Zona A y asistente en horario ordinario: $1,800 + $2,500 + $1,500 = $5,800 MXN." data-en="Level fee + visit fee + assistant fee. For example, Level I with a hotel visit in Zone A and an assistant during standard hours: $1,800 + $2,500 + $1,500 = $5,800 MXN." data-fr="Prix du niveau + honoraires de visite + honoraires de l’assistant(e) de perfusion. Par exemple, niveau I avec visite à l’hôtel en zone A et assistant(e) de perfusion en horaire ordinaire : $1,800 + $2,500 + $1,500 = $5,800 MXN."></p>
    </div>
  </article>
