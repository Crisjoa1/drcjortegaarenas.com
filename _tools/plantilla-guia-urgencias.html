  <h1 class="page-h1" data-es="Cuándo ir a <em>urgencias</em> en la Ciudad de México" data-en="When to go to the <em>emergency room</em> in Mexico City"></h1>
  <p class="page-lead" data-es="Llame al 911 o acuda a urgencias si tiene dolor en el pecho, dificultad para respirar, signos de un evento vascular cerebral, pérdida del estado de alerta, una convulsión, un sangrado abundante o cualquier otro de los signos de alarma de esta guía. En México, el número de emergencias es el 911 y atiende las 24 horas." data-en="Call 911 or go to an emergency room if you have chest pain, trouble breathing, signs of a stroke, loss of consciousness, a seizure, heavy bleeding, or any other warning sign listed in this guide. In Mexico, the emergency number is 911 and it answers 24 hours a day."></p>
</header>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Signos de alarma: llame al 911 o vaya a urgencias" data-en="Warning signs: call 911 or go to the ER"></h2>
    <p data-es="No espere a que pasen ni intente resolverlos con una consulta en el hotel si usted o su acompañante tiene alguno de estos signos:" data-en="Do not wait for them to pass or try to handle them with a hotel visit if you or your companion has any of these signs:"></p>
    <ul>
      <li data-es="<strong>Dolor u opresión en el pecho</strong>, o dolor en brazo, mandíbula, cuello o espalda, con falta de aire, debilidad o sensación de desmayo." data-en="<strong>Chest pain or pressure</strong>, or pain in the arm, jaw, neck or back, with shortness of breath, weakness or feeling faint."></li>
      <li data-es="<strong>Dificultad para respirar</strong> que aparece de pronto o empeora, o falta de aire en reposo." data-en="<strong>Trouble breathing</strong> that starts suddenly or gets worse, or shortness of breath at rest."></li>
      <li data-es="<strong>Signos de evento vascular cerebral (EVC)</strong>: vea la regla BE-FAST más abajo." data-en="<strong>Signs of a stroke</strong>: see the BE-FAST rule below."></li>
      <li data-es="<strong>Pérdida del estado de alerta</strong>, desmayo, confusión súbita o dificultad para despertar a la persona." data-en="<strong>Loss of consciousness</strong>, fainting, sudden confusion or difficulty waking the person."></li>
      <li data-es="<strong>Convulsión</strong>." data-en="<strong>A seizure</strong>."></li>
      <li data-es="<strong>Sangrado abundante</strong> que no se detiene con presión directa, o vómito o evacuaciones con mucha sangre." data-en="<strong>Heavy bleeding</strong> that does not stop with direct pressure, or vomit or stools with a lot of blood."></li>
      <li data-es="<strong>Reacción alérgica grave</strong>: hinchazón de labios, lengua o garganta, dificultad para respirar o tragar, o ronchas extensas con mareo." data-en="<strong>A severe allergic reaction</strong>: swelling of the lips, tongue or throat, trouble breathing or swallowing, or widespread hives with dizziness."></li>
      <li data-es="<strong>Dolor abdominal intenso</strong> o que no cede, sobre todo con el abdomen duro." data-en="<strong>Severe abdominal pain</strong> or pain that does not ease, especially with a hard belly."></li>
      <li data-es="<strong>Fiebre con rigidez de nuca</strong>, dolor de cabeza intenso, confusión o sensibilidad a la luz." data-en="<strong>Fever with a stiff neck</strong>, severe headache, confusion or sensitivity to light."></li>
      <li data-es="<strong>Deshidratación grave</strong>: no poder beber ni retener líquidos, orinar muy poco o nada, somnolencia o confusión." data-en="<strong>Severe dehydration</strong>: unable to drink or keep fluids down, passing little or no urine, drowsiness or confusion."></li>
      <li data-es="<strong>Traumatismo</strong>: golpe en la cabeza con vómito, somnolencia o confusión; accidente de tránsito; posible fractura o herida profunda." data-en="<strong>Injury</strong>: a blow to the head followed by vomiting, drowsiness or confusion; a traffic accident; a possible broken bone or a deep wound."></li>
    </ul>

    <h2 data-es="Cómo reconocer un EVC: la regla BE-FAST" data-en="How to recognize a stroke: the BE-FAST rule"></h2>
    <p data-es="Si alguno de estos signos aparece de forma súbita, llame al 911 de inmediato y anote la hora en que empezó:" data-en="If any of these signs appears suddenly, call 911 right away and note the time it started:"></p>
    <ul>
      <li data-es="<strong>B, equilibrio (<em>balance</em>):</strong> pérdida súbita del equilibrio o de la coordinación." data-en="<strong>B, balance:</strong> sudden loss of balance or coordination."></li>
      <li data-es="<strong>E, ojos (<em>eyes</em>):</strong> pérdida o alteración súbita de la visión." data-en="<strong>E, eyes:</strong> sudden loss of or change in vision."></li>
      <li data-es="<strong>F, cara (<em>face</em>):</strong> pida a la persona que sonría. ¿Se cae un lado de la cara?" data-en="<strong>F, face:</strong> ask the person to smile. Does one side of the face droop?"></li>
      <li data-es="<strong>A, brazos (<em>arms</em>):</strong> pida que levante ambos brazos. ¿Uno de ellos baja?" data-en="<strong>A, arms:</strong> ask the person to raise both arms. Does one arm drift down?"></li>
      <li data-es="<strong>S, habla (<em>speech</em>):</strong> pida que repita una frase sencilla. ¿Habla arrastrado o raro?" data-en="<strong>S, speech:</strong> ask the person to repeat a simple phrase. Is the speech slurred or strange?"></li>
      <li data-es="<strong>T, tiempo (<em>time</em>):</strong> llame al 911 de inmediato." data-en="<strong>T, time:</strong> call 911 right away."></li>
    </ul>
    <p data-es="Los CDC recomiendan no ir manejando al hospital ni pedir a alguien que lo lleve: es mejor llamar al 911 para que envíen una ambulancia." data-en="The CDC advises against driving yourself to the hospital or having someone drive you: it is better to call 911 so an ambulance is sent."></p>

    <h2 data-es="Cómo llamar al 911 en la Ciudad de México" data-en="How to call 911 in Mexico City"></h2>
    <p data-es="El 911 es el número de emergencias en México. En la Ciudad de México lo opera el C5, atiende las 24 horas, los 365 días del año, e incluye las urgencias médicas. Al llamar, diga con calma:" data-en="911 is the emergency number in Mexico. In Mexico City it is run by the C5 and answers 24 hours a day, 365 days a year, including medical emergencies. When you call, calmly say:"></p>
    <ul>
      <li data-es="Qué está pasando." data-en="What is happening."></li>
      <li data-es="Dónde está: dirección, nombre del hotel, número de habitación y alguna referencia." data-en="Where you are: address, hotel name, room number and a landmark."></li>
      <li data-es="A qué hora empezó." data-en="What time it started."></li>
      <li data-es="Cuántas personas están afectadas." data-en="How many people are affected."></li>
    </ul>
    <p data-es="Si se hospeda en un hotel, avise también a la recepción. Si no habla español, pida apoyo al personal para dar la dirección." data-en="If you are staying at a hotel, also tell the front desk. If you do not speak Spanish, ask the staff to help you give the address."></p>

    <h2 data-es="Qué llevar a urgencias" data-en="What to bring to the ER"></h2>
    <ul>
      <li data-es="Pasaporte o identificación oficial." data-en="Passport or official ID."></li>
      <li data-es="Póliza de su seguro de viaje o de gastos médicos y el teléfono de asistencia de la aseguradora." data-en="Your travel or health insurance policy and the insurer's assistance phone number."></li>
      <li data-es="Lista de sus medicamentos con el nombre genérico y la dosis, además de sus alergias y enfermedades." data-en="A list of your medicines with the generic name and dose, plus your allergies and medical conditions."></li>
      <li data-es="Tarjeta de crédito o débito." data-en="A credit or debit card."></li>
      <li data-es="Teléfono con batería y el contacto de un familiar." data-en="A charged phone and a family member's contact information."></li>
    </ul>
    <p data-es="Los CDC sugieren anotar los medicamentos con su nombre genérico, porque los nombres comerciales cambian de un país a otro." data-en="The CDC suggests listing medicines by their generic name, because brand names vary from country to country."></p>

    <h2 data-es="Hospitales en la Ciudad de México y pago de la atención" data-en="Hospitals in Mexico City and paying for care"></h2>
    <p data-es="En la Ciudad de México hay hospitales públicos y privados con servicio de urgencias las 24 horas. Esta guía no recomienda ninguno en particular." data-en="Mexico City has public and private hospitals with 24-hour emergency departments. This guide does not recommend any particular one."></p>
    <p data-es="Los hospitales privados suelen pedir una garantía de pago antes o al momento de la atención, por ejemplo una tarjeta de crédito, un depósito o la autorización de su aseguradora. Llame cuanto antes a la asistencia de su seguro, como piden muchas pólizas, y guarde las facturas y los informes médicos para su reembolso. Ante un signo de alarma, no retrase la atención por estos trámites." data-en="Private hospitals usually ask for a payment guarantee before or at the time of care, such as a credit card, a deposit or your insurer's authorization. Call your insurer's assistance line as soon as possible, as many policies require, and keep your invoices and medical reports for reimbursement. If you have a warning sign, do not delay care because of this paperwork."></p>

    <h2 data-es="Qué puede atender un médico en su hotel y qué no" data-en="What a hotel doctor can and cannot treat"></h2>
    <p data-es="Un médico general a domicilio u hotel puede valorar y tratar padecimientos leves, por ejemplo:" data-en="A general physician making a house call or hotel visit can assess and treat mild conditions, for example:"></p>
    <ul>
      <li data-es="Infecciones respiratorias leves, como resfriado, dolor de garganta o tos sin dificultad para respirar." data-en="Mild respiratory infections, such as a cold, sore throat or cough without trouble breathing."></li>
      <li data-es="Gastroenteritis o diarrea sin signos de alarma (vea la <a href='/guias/diarrea-del-viajero/'>guía de diarrea del viajero</a>)." data-en="Gastroenteritis or diarrhea without warning signs (see the <a href='/en/guides/travelers-diarrhea-mexico-city/'>traveler's diarrhea guide</a>)."></li>
      <li data-es="Heridas menores y raspones." data-en="Minor cuts and scrapes."></li>
      <li data-es="Molestias leves por la altitud (vea la <a href='/guias/altitud-cdmx/'>guía de altitud</a>)." data-en="Mild symptoms from the altitude (see the <a href='/en/guides/mexico-city-altitude/'>altitude guide</a>)."></li>
    </ul>
    <p data-es="No sustituye a un hospital. Ante cualquiera de los signos de alarma de esta guía, o si se necesitan estudios de imagen, oxígeno, cirugía u hospitalización, lo indicado es llamar al 911 o ir a urgencias. Si durante la consulta aparece un signo de alarma, el médico le indicará acudir a urgencias." data-en="It does not replace a hospital. For any of the warning signs in this guide, or if imaging, oxygen, surgery or a hospital stay may be needed, call 911 or go to the ER. If a warning sign appears during the visit, the doctor will tell you to go to the ER."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions"></h2>
    <div class="faq-item">
      <h3 data-es="¿El 911 funciona en la Ciudad de México?" data-en="Does 911 work in Mexico City?"></h3>
      <p data-es="Sí. El 911 es el número de emergencias en México. En la Ciudad de México atiende las 24 horas, los 365 días del año, e incluye las urgencias médicas." data-en="Yes. 911 is the emergency number in Mexico. In Mexico City it answers 24 hours a day, 365 days a year, including medical emergencies."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Necesito seguro para ir a urgencias?" data-en="Do I need insurance to go to the ER?"></h3>
      <p data-es="Ante un signo de alarma, busque atención primero. Los hospitales privados suelen pedir una garantía de pago, como una tarjeta, un depósito o la autorización de su aseguradora, así que conviene tener a la mano su póliza y el teléfono de asistencia." data-en="If you have a warning sign, get care first. Private hospitals usually ask for a payment guarantee, such as a card, a deposit or your insurer's authorization, so keep your policy and assistance phone number at hand."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Un médico en el hotel sustituye una visita a urgencias?" data-en="Can a hotel doctor replace a visit to the ER?"></h3>
      <p data-es="No. Puede atender padecimientos leves, como una infección respiratoria leve, una gastroenteritis sin signos de alarma o una herida menor. Ante dolor en el pecho, dificultad para respirar, signos de EVC u otro signo de alarma, llame al 911." data-en="No. A hotel doctor can treat mild conditions, such as a mild respiratory infection, gastroenteritis without warning signs or a minor cut. For chest pain, trouble breathing, signs of a stroke or any other warning sign, call 911."></p>
    </div>

    <div class="emergency-note" data-es="<strong>Ante una emergencia, llame al 911</strong> o acuda a urgencias hospitalarias. Esta guía y la visita médica en hotel no son un servicio de urgencias." data-en="<strong>In an emergency, call 911</strong> or go to a hospital emergency room. This guide and the hotel medical visit are not an emergency service."></div>
