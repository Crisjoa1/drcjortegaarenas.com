    <h2 data-es="Honorarios en Santa Fe" data-en="Fees in Santa Fe" data-fr="Honoraires à Santa Fe"></h2>
    <p data-es="Para visitas a hotel, Santa Fe está en la <strong>Zona <span data-tarifa='zona:Santa Fe'></span></strong>. La consulta a domicilio tiene su propia tarifa para Santa Fe. Montos en pesos mexicanos, por consulta:" data-en="For hotel visits, Santa Fe is in <strong>Zone <span data-tarifa='zona:Santa Fe'></span></strong>. House calls have their own Santa Fe fee. Amounts in Mexican pesos, per visit:" data-fr="Pour les visites à l’hôtel, Santa Fe se trouve en <strong>zone <span data-tarifa='zona:Santa Fe'></span></strong>. La consultation à domicile a son propre tarif pour Santa Fe. Montants en pesos mexicains, par consultation :"></p>

    <p data-es="La tarifa depende del horario y del día, y se confirma al solicitar la visita; los festivos se coordinan solo por WhatsApp. Horarios ordinario, especial y festivo en la <a href='/#tarifas'>sección de tarifas</a>, con los mismos honorarios." data-en="The fee depends on the time and day, and is confirmed when you request the visit; holidays are arranged via WhatsApp only. Standard, after-hours and holiday times are in the <a href='/en/#tarifas'>fees section</a>, with the same fees." data-fr="Le tarif dépend de l’horaire et du jour, et il est confirmé lors de la demande de visite ; les jours fériés s’organisent uniquement par WhatsApp. Horaires ordinaires, hors horaires et jours fériés dans la <a href='/fr/#tarifas'>section des tarifs</a>, avec les mêmes honoraires."></p>
    <p data-es="<strong>Anticipo y cancelación.</strong> La visita a hotel no requiere anticipo: se paga directamente al médico, en pesos mexicanos. La consulta a domicilio se solicita por WhatsApp y se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Santa Fe'></span>, el 50 % de la tarifa ordinaria. El resto, y en horario especial o festivo la diferencia, se paga al médico en la visita. Si cancela con al menos 3 horas de anticipación, se reembolsa el anticipo; con menos de 3 horas, o si no está en el domicilio a la hora acordada, no es reembolsable." data-en="<strong>Deposit and cancellation.</strong> Hotel visits need no deposit: they are paid directly to the doctor, in Mexican pesos. House calls are requested via WhatsApp and confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Santa Fe'></span>, 50% of the standard fee. The rest, and the difference for after-hours or holiday visits, is paid to the doctor at the visit. If you cancel at least 3 hours in advance, the deposit is refunded; with less than 3 hours' notice, or if you are not at the address at the agreed time, it is non-refundable." data-fr="<strong>Acompte et annulation.</strong> La visite à l’hôtel ne nécessite pas d’acompte : elle se paie directement au médecin, en pesos mexicains. La consultation à domicile se demande par WhatsApp et se confirme par un virement de <span data-tarifa='anticipo-domicilio:Santa Fe'></span>, soit 50 % du tarif ordinaire. Le solde, ainsi que la différence en cas de visite hors horaires ou un jour férié, se paie au médecin lors de la visite. Si vous annulez au moins 3 heures à l’avance, l’acompte est remboursé ; à moins de 3 heures, ou si vous n’êtes pas à l’adresse à l’heure convenue, il n’est pas remboursable."></p>

    <h2 data-es="Consultorio en Santa Fe, al salir del trabajo" data-en="Santa Fe clinic, after work" data-fr="Cabinet à Santa Fe, après le travail"></h2>
    <p data-es="El consultorio atiende con cita de lunes a viernes de 17:00 a 20:00 (la cita de las 20:00 es solo para subsecuentes) y sábado de 11:00 a 15:00, un horario pensado para quien trabaja en la zona. El consultorio está en Briyam Coworking Médico, sede Santa Fe: <span data-sede='Santa Fe'></span>. Su cita queda confirmada al pagar en línea, con tarjeta, el anticipo del 50 % (<span data-tarifa='anticipo:Santa Fe'></span> de <span data-tarifa='consultorio:Santa Fe'></span>); el resto se paga en el consultorio. Después de reservar, envíe un WhatsApp al +52 595 109 3969. Si cancela con al menos 3 horas de anticipación, se reembolsa el anticipo; con menos de 3 horas, o si no se presenta a la cita, no es reembolsable." data-en="The clinic sees patients by appointment Monday to Friday 5–8 pm (the 8:00 pm slot is for follow-up visits only) and Saturday 11 am–3 pm, hours that suit people who work in the area. The clinic is at Briyam Coworking Médico, Santa Fe location: <span data-sede='Santa Fe'></span>. Your appointment is confirmed once you pay the 50% deposit online by card (<span data-tarifa='anticipo:Santa Fe'></span> of <span data-tarifa='consultorio:Santa Fe'></span>); the rest is paid at the clinic. After booking, send a WhatsApp to +52 595 109 3969. If you cancel at least 3 hours in advance, your deposit is refunded; with less than 3 hours' notice, or if you do not attend, it is non-refundable." data-fr="Le cabinet reçoit sur rendez-vous du lundi au vendredi de 17 h à 20 h (le créneau de 20 h est réservé aux consultations de suivi) et le samedi de 11 h à 15 h, des horaires pensés pour les personnes qui travaillent dans le quartier. Le cabinet se trouve chez Briyam Coworking Médico, site Santa Fe : <span data-sede='Santa Fe'></span>. Votre rendez-vous est confirmé une fois l’acompte de 50 % payé en ligne par carte (<span data-tarifa='anticipo:Santa Fe'></span> sur <span data-tarifa='consultorio:Santa Fe'></span>) ; le solde se paie au cabinet. Après la réservation, envoyez un WhatsApp au +52 595 109 3969. Si vous annulez au moins 3 heures à l’avance, l’acompte est remboursé ; à moins de 3 heures, ou si vous ne vous présentez pas au rendez-vous, il n’est pas remboursable."></p>
    <p data-es="Si el motivo de consulta no requiere exploración física, por ejemplo un seguimiento o una duda sobre un tratamiento, también hay <a href='/#tarifas'>teleconsulta</a> por videollamada." data-en="If your visit does not need a physical examination, such as a follow-up or a question about a treatment, <a href='/en/#tarifas'>telemedicine</a> by video call is also available." data-fr="Si le motif de consultation ne nécessite pas d’examen physique, par exemple un suivi ou une question sur un traitement, une <a href='/fr/#tarifas'>téléconsultation</a> par appel vidéo est également possible."></p>

    <h2 data-es="Cuánto tarda en llegar" data-en="How long it takes to arrive" data-fr="Délai d’arrivée"></h2>
    <p data-es="Sujeto a disponibilidad, el tiempo estimado de llegada a Santa Fe es de <strong>alrededor de 1 hora 50 minutos</strong>, por la distancia y el tráfico; puede ser menos. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada." data-en="Subject to availability, the estimated arrival time in Santa Fe is <strong>about 1 hour 50 minutes</strong>, due to distance and traffic; it may be shorter. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time." data-fr="Sous réserve de disponibilité, le délai d’arrivée estimé à Santa Fe est d’<strong>environ 1 h 50</strong>, en raison de la distance et de la circulation ; il peut être moins long. Lors de la réservation, envoyez un WhatsApp au +52 595 109 3969 et une heure estimée vous sera confirmée."></p>
    <p data-es="Si está en un hotel o en un edificio con control de acceso, avise en recepción que espera al médico." data-en="If you are at a hotel or in a building with controlled access, let the front desk know you are expecting the doctor." data-fr="Si vous êtes à l’hôtel ou dans un immeuble à accès contrôlé, prévenez la réception que vous attendez le médecin."></p>

    <h2 data-es="Qué puede atender el médico" data-en="What the doctor can help with" data-fr="Ce que le médecin peut prendre en charge"></h2>
    <p data-es="Medicina general ambulatoria para padecimientos leves, como infecciones respiratorias sin dificultad para respirar, gastroenteritis sin signos de alarma o heridas menores. Cuando hay tratamiento indicado, recibe receta por escrito; vea la <a href='/guias/farmacias-cdmx/'>guía de farmacias en la CDMX</a>. No sustituye a un hospital: vea <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias</a>." data-en="Outpatient general medicine for mild conditions, such as respiratory infections without trouble breathing, gastroenteritis without warning signs or minor cuts. When treatment is indicated, you receive a written prescription; see the <a href='/en/guides/pharmacies-mexico-city/'>Mexico City pharmacy guide</a>. It does not replace a hospital: see <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER</a>." data-fr="Médecine générale ambulatoire pour des affections légères, comme les infections respiratoires sans difficulté à respirer, les gastro-entérites sans signes d’alerte ou les plaies mineures. Lorsqu’un traitement est indiqué, vous recevez une ordonnance écrite ; consultez le <a href='/fr/guides/pharmacies-mexico/'>guide des pharmacies à Mexico</a>. Cela ne remplace pas un hôpital : voir <a href='/fr/guides/urgences-mexico/'>quand aller aux urgences</a>."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">

    </div>

      <p data-es="Por la distancia y el tráfico, el tiempo estimado de llegada a Santa Fe es de alrededor de 1 hora 50 minutos; puede ser menos. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada. Si el motivo no requiere exploración física, por ejemplo un seguimiento o una duda sobre un tratamiento, también puede elegir la teleconsulta por videollamada." data-en="Because of distance and traffic, the estimated arrival time in Santa Fe is about 1 hour 50 minutes; it may be shorter. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time. If your visit does not need a physical exam, such as a follow-up or a question about a treatment, you can also choose a telemedicine visit by video call." data-fr="En raison de la distance et de la circulation, le délai d’arrivée estimé à Santa Fe est d’environ 1 h 50 ; il peut être moins long. Lors de la réservation, envoyez un WhatsApp au +52 595 109 3969 et une heure estimée vous sera confirmée. Si le motif ne nécessite pas d’examen physique, par exemple un suivi ou une question sur un traitement, vous pouvez aussi choisir la téléconsultation par appel vidéo."></p>

      <h3 data-es="¿Cómo pido una visita en mi hotel o en mi casa en Santa Fe?" data-en="How do I request a visit at my hotel or home in Santa Fe?" data-fr="Comment demander une visite à mon hôtel ou à mon domicile à Santa Fe ?"></h3>
      <p data-es="Escriba por WhatsApp al +52 595 109 3969. La visita en hotel cuesta desde <span data-tarifa='hotel:Santa Fe:0'></span> MXN en horario ordinario y se paga al médico, sin anticipo. La consulta a domicilio cuesta desde <span data-tarifa='domicilio:Santa Fe:0'></span> MXN y se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Santa Fe'></span> MXN, el 50 % de la tarifa ordinaria; si cancela con al menos 3 horas de anticipación, se reembolsa. Si está en un edificio con control de acceso, avise en recepción que espera al médico." data-en="Send a WhatsApp to +52 595 109 3969. A hotel visit costs from <span data-tarifa='hotel:Santa Fe:0'></span> MXN at standard hours and is paid to the doctor, with no deposit. A house call costs from <span data-tarifa='domicilio:Santa Fe:0'></span> MXN and is confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Santa Fe'></span> MXN, 50% of the standard fee; if you cancel at least 3 hours in advance, it is refunded. If your building has access control, let the front desk know you are expecting the doctor." data-fr="Écrivez par WhatsApp au +52 595 109 3969. La visite à l’hôtel coûte à partir de <span data-tarifa='hotel:Santa Fe:0'></span> MXN en horaire ordinaire et se paie au médecin, sans acompte. La consultation à domicile coûte à partir de <span data-tarifa='domicilio:Santa Fe:0'></span> MXN et se confirme par un virement de <span data-tarifa='anticipo-domicilio:Santa Fe'></span> MXN, soit 50 % du tarif ordinaire ; si vous annulez au moins 3 heures à l’avance, il est remboursé. Si vous êtes dans un immeuble à accès contrôlé, prévenez la réception que vous attendez le médecin."></p>
