  <h1 class="page-h1" data-es="Farmacias en la <em>Ciudad de México</em>" data-en="Pharmacies in <em>Mexico City</em>" data-fr="Pharmacies à <em>Mexico</em>"></h1>
  <p class="page-lead" data-es="En México, la ley clasifica los medicamentos según cómo pueden venderse: algunos sin receta y otros solo con receta médica. Los antibióticos se venden solo con receta médica. Esta guía explica qué le pedirán en la farmacia, cómo encontrar una abierta las 24 horas y qué tener en cuenta si viene del extranjero." data-en="In Mexico, the law classifies medicines by how they may be sold: some without a prescription and others only with one. Antibiotics are sold only with a prescription. This guide explains what a pharmacy will ask for, how to find one open 24 hours and what to keep in mind if you are visiting from abroad." data-fr="Au Mexique, la loi classe les médicaments selon leur mode de vente : certains sans ordonnance et d’autres uniquement sur ordonnance. Les antibiotiques ne sont vendus que sur ordonnance. Ce guide explique ce que la pharmacie vous demandera, comment en trouver une ouverte 24 heures sur 24 et ce qu’il faut savoir si vous venez de l’étranger."></p>
</header>

<div class="sep"></div>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Qué medicamentos requieren receta" data-en="Which medicines need a prescription" data-fr="Quels médicaments nécessitent une ordonnance"></h2>
    <p data-es="El artículo 226 de la Ley General de Salud ordena los medicamentos en seis fracciones (grupos) para su venta y suministro al público:" data-en="Article 226 of Mexico's General Health Law sorts medicines into six groups for sale to the public:" data-fr="L’article 226 de la Loi générale de santé du Mexique (<em>Ley General de Salud</em>) classe les médicaments en six groupes (fractions) pour leur vente et leur délivrance au public :"></p>
    <ul>
      <li data-es="<strong>Fracciones I a III, medicamentos controlados:</strong> necesitan receta especial o una receta que la farmacia registra y retiene. Incluyen estupefacientes y psicotrópicos." data-en="<strong>Groups I to III, controlled medicines:</strong> they need a special prescription or one that the pharmacy records and keeps. They include narcotics and psychotropic drugs." data-fr="<strong>Groupes I à III, médicaments contrôlés :</strong> ils nécessitent une ordonnance spéciale ou une ordonnance que la pharmacie enregistre et conserve. Ils comprennent les stupéfiants et les psychotropes."></li>
      <li data-es="<strong>Fracción IV, con receta médica:</strong> pueden resurtirse tantas veces como lo indique el médico. El acuerdo de antibióticos (vea abajo) se fundamenta en esta fracción." data-en="<strong>Group IV (fraction IV), prescription only:</strong> they may be refilled as many times as the doctor indicates. The antibiotics agreement (see below) is based on this group." data-fr="<strong>Groupe IV (fraction IV), sur ordonnance :</strong> ils peuvent être renouvelés autant de fois que le médecin l’indique. L’accord sur les antibiotiques (voir ci-dessous) se fonde sur ce groupe."></li>
      <li data-es="<strong>Fracción V, sin receta, solo en farmacias.</strong>" data-en="<strong>Group V, no prescription, sold in pharmacies only.</strong>" data-fr="<strong>Groupe V, sans ordonnance, vendus uniquement en pharmacie.</strong>"></li>
      <li data-es="<strong>Fracción VI, sin receta,</strong> que también pueden venderse en comercios que no son farmacias." data-en="<strong>Group VI, no prescription,</strong> which may also be sold in shops other than pharmacies." data-fr="<strong>Groupe VI, sans ordonnance,</strong> qui peuvent aussi être vendus dans des commerces autres que les pharmacies."></li>
    </ul>
    <p data-es="La misma ley prohíbe vender medicamentos en puestos semifijos o ambulantes." data-en="The same law prohibits selling medicines from street stalls or by street vendors." data-fr="La même loi interdit la vente de médicaments sur des étals de rue ou par des vendeurs ambulants."></p>

    <h2 data-es="Antibióticos: solo con receta" data-en="Antibiotics: prescription only" data-fr="Antibiotiques : uniquement sur ordonnance"></h2>
    <p data-es="Desde 2010, un acuerdo de la Secretaría de Salud establece que los antibióticos se venden solo al presentar la receta médica. En cada venta, la farmacia sella la receta con la cantidad surtida y la fecha, y la retiene cuando se agota la cantidad recetada. Solo la surte dentro del tiempo que dura el tratamiento indicado. El acuerdo aplica a los antibióticos incluidos en la lista que publica COFEPRIS." data-en="Since 2010, a Ministry of Health agreement has required that antibiotics be sold only on presentation of a medical prescription. At each sale, the pharmacy stamps the prescription with the quantity dispensed and the date, and keeps it once the prescribed amount has been used up. It only fills it within the length of the prescribed treatment. The agreement covers the antibiotics on the list published by COFEPRIS." data-fr="Depuis 2010, un accord du ministère de la Santé (<em>Secretaría de Salud</em>) impose que les antibiotiques ne soient vendus que sur présentation d’une ordonnance médicale. À chaque vente, la pharmacie tamponne l’ordonnance en indiquant la quantité délivrée et la date, et la conserve une fois la quantité prescrite épuisée. Elle ne délivre les médicaments que pendant la durée du traitement prescrit. L’accord s’applique aux antibiotiques figurant sur la liste publiée par la COFEPRIS."></p>
    <p data-es="Si cree que necesita un antibiótico, consulte primero a un médico: muchas infecciones leves no lo requieren, y tomarlo sin indicación también puede tener efectos adversos." data-en="If you think you need an antibiotic, see a doctor first: many mild infections do not need one, and taking one when it is not medically indicated can also cause side effects." data-fr="Si vous pensez avoir besoin d’un antibiotique, consultez d’abord un médecin : de nombreuses infections bénignes n’en nécessitent pas, et en prendre sans indication médicale peut aussi provoquer des effets indésirables."></p>

    <h2 data-es="Qué debe tener una receta válida" data-en="What a valid prescription must include" data-fr="Ce que doit comporter une ordonnance valable"></h2>
    <p data-es="Según el Reglamento de Insumos para la Salud, la receta debe llevar impresos el nombre y el domicilio completos y el número de cédula profesional de quien la expide, además de la fecha y la firma autógrafa. También debe indicar la dosis, la presentación, la vía de administración, la frecuencia y la duración del tratamiento." data-en="Under the Regulations on Health Supplies, a prescription must show the prescriber's full printed name and address and their professional license (cédula profesional) number, plus the date and a handwritten signature. It must also state the dose, the presentation, the route, how often to take it and how long the treatment lasts." data-fr="Selon le Règlement sur les fournitures de santé (<em>Reglamento de Insumos para la Salud</em>), l’ordonnance doit comporter, imprimés, le nom et l’adresse complets du prescripteur et son numéro d’autorisation d’exercice (<em>cédula profesional</em>), ainsi que la date et une signature manuscrite. Elle doit aussi indiquer la dose, la présentation, la voie d’administration, la fréquence et la durée du traitement."></p>

    <h2 data-es="Si viene del extranjero" data-en="If you are visiting from abroad" data-fr="Si vous venez de l’étranger"></h2>
    <ul>
      <li data-es="<strong>Recetas de otro país:</strong> el gobierno británico advierte que las recetas emitidas fuera de México deben traducirse al español y, aun traducidas, una farmacia puede no aceptarlas. Si necesita un medicamento que requiere receta, un médico en México puede valorarlo y, si hay un tratamiento indicado, extenderle una receta mexicana." data-en="<strong>Prescriptions from another country:</strong> the UK government advises that prescriptions issued outside Mexico must be translated into Spanish, and even then a pharmacy may not accept them. If you need a prescription medicine, a doctor in Mexico can assess you and, if treatment is indicated, issue a Mexican prescription." data-fr="<strong>Ordonnances d’un autre pays :</strong> le gouvernement britannique indique que les ordonnances émises hors du Mexique doivent être traduites en espagnol et que, même traduites, une pharmacie peut ne pas les accepter. Si vous avez besoin d’un médicament soumis à ordonnance, un médecin au Mexique peut vous évaluer et, si un traitement est indiqué, vous délivrer une ordonnance mexicaine."></li>
      <li data-es="<strong>Nombres distintos:</strong> según los CDC, el mismo medicamento puede tener otro nombre comercial en México. Lleve anotado el nombre de la sustancia activa y la dosis, y muéstrelo al médico o al farmacéutico." data-en="<strong>Different names:</strong> according to the CDC, the same medicine may have a different brand name in Mexico. Keep a note of the active ingredient and the dose, and show it to the doctor or pharmacist." data-fr="<strong>Noms différents :</strong> selon les CDC, le même médicament peut porter un autre nom commercial au Mexique. Notez le nom de la substance active et la dose, et montrez-les au médecin ou au pharmacien."></li>
      <li data-es="<strong>Sus medicamentos de uso personal:</strong> la Agencia Nacional de Aduanas de México los permite en el equipaje; si son psicotrópicos, debe mostrar la receta médica. Los CDC recomiendan llevarlos en su envase original." data-en="<strong>Your own medicines:</strong> Mexico's National Customs Agency (ANAM) allows medicines for personal use in your luggage; for psychotropic drugs, you must show the prescription. The CDC recommends carrying them in their original containers." data-fr="<strong>Vos médicaments à usage personnel :</strong> l’Agence nationale des douanes du Mexique (ANAM) les autorise dans les bagages ; pour les psychotropes, vous devez présenter l’ordonnance médicale. Les CDC recommandent de les transporter dans leur emballage d’origine."></li>
    </ul>

    <h2 data-es="Farmacias abiertas las 24 horas" data-en="Pharmacies open 24 hours" data-fr="Pharmacies ouvertes 24 heures sur 24"></h2>
    <p data-es="Según el gobierno británico, muchas farmacias en las grandes ciudades de México dan servicio las 24 horas. Esta guía no recomienda ninguna en particular. Para encontrar una cercana, pregunte en la recepción de su hotel o busque &quot;farmacia 24 horas&quot; en un mapa, y llame antes de ir para confirmar el horario." data-en="According to the UK government, many pharmacies in large Mexican cities are open 24 hours. This guide does not recommend any particular one. To find one nearby, ask your hotel front desk or search for &quot;farmacia 24 horas&quot; on a map, and call ahead to confirm the hours." data-fr="Selon le gouvernement britannique, de nombreuses pharmacies des grandes villes du Mexique sont ouvertes 24 heures sur 24. Ce guide n’en recommande aucune en particulier. Pour en trouver une à proximité, demandez à la réception de votre hôtel ou cherchez « farmacia 24 horas » sur une carte, et appelez avant d’y aller pour confirmer les horaires."></p>
    <p data-es="COFEPRIS recomienda adquirir medicamentos en lugares formalmente establecidos, que cuenten con licencia sanitaria, aviso de funcionamiento y documentación de la legal adquisición de los productos, y advierte sobre los riesgos de comprarlos en sitios web, como plataformas digitales y redes sociales. También publica las <a href='https://www.gob.mx/cofepris/documentos/alertas-sanitarias-de-medicamentos' target='_blank' rel='noopener'>alertas sanitarias de medicamentos</a>. Los CDC aconsejan no comprar en mercados, con vendedores ambulantes ni en farmacias de aspecto dudoso, y pedir comprobante de compra. Revise que esté en su empaque original y la fecha de caducidad." data-en="COFEPRIS, Mexico's health regulator, recommends buying medicines from formally established businesses with a health license, an operating notice and documentation of the legal acquisition of the products, and warns about the risks of buying them on websites, including digital platforms and social media. It also publishes <a href='https://www.gob.mx/cofepris/documentos/alertas-sanitarias-de-medicamentos' target='_blank' rel='noopener'>medicine safety alerts</a>. The CDC advises against buying from open markets, street vendors or suspicious-looking pharmacies, and recommends asking for a receipt. Check that it is in its original packaging and look at the expiry date." data-fr="La COFEPRIS, l’autorité sanitaire mexicaine, recommande d’acheter les médicaments dans des établissements formellement constitués, disposant d’une licence sanitaire, d’un avis de fonctionnement et de documents attestant l’acquisition légale des produits, et met en garde contre les risques d’achat sur des sites web, notamment les plateformes numériques et les réseaux sociaux. Elle publie aussi les <a href='https://www.gob.mx/cofepris/documentos/alertas-sanitarias-de-medicamentos' target='_blank' rel='noopener'>alertes sanitaires sur les médicaments</a> (en espagnol). Les CDC déconseillent d’acheter sur les marchés, auprès de vendeurs ambulants ou dans des pharmacies d’apparence douteuse, et recommandent de demander un justificatif d’achat. Vérifiez que le médicament est dans son emballage d’origine et regardez la date de péremption."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="¿Puedo comprar antibióticos sin receta en México?" data-en="Can I buy antibiotics without a prescription in Mexico?" data-fr="Puis-je acheter des antibiotiques sans ordonnance au Mexique ?"></h3>
      <p data-es="No. Desde 2010, los antibióticos se venden solo al presentar la receta médica, que la farmacia sella en cada venta y retiene cuando se agota la cantidad recetada." data-en="No. Since 2010, antibiotics are sold only on presentation of a medical prescription, which the pharmacy stamps at each sale and keeps once the prescribed amount has been used up." data-fr="Non. Depuis 2010, les antibiotiques ne sont vendus que sur présentation d’une ordonnance médicale, que la pharmacie tamponne à chaque vente et conserve une fois la quantité prescrite épuisée."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Me sirve la receta de mi país?" data-en="Will my prescription from home work?" data-fr="L’ordonnance de mon pays sera-t-elle acceptée ?"></h3>
      <p data-es="Puede que no. Según el gobierno británico, las recetas emitidas fuera de México deben traducirse al español, y la farmacia puede no aceptarlas. En una consulta en México, el médico valora su caso y, si hay un tratamiento indicado, puede extenderle una receta con cédula profesional mexicana." data-en="It may not. According to the UK government, prescriptions issued outside Mexico must be translated into Spanish, and the pharmacy may not accept them. At a medical visit in Mexico, the doctor assesses your case and, if treatment is indicated, can issue a prescription with a Mexican professional license number." data-fr="Peut-être pas. Selon le gouvernement britannique, les ordonnances émises hors du Mexique doivent être traduites en espagnol, et la pharmacie peut ne pas les accepter. Lors d’une consultation au Mexique, le médecin évalue votre cas et, si un traitement est indiqué, peut vous délivrer une ordonnance portant un numéro de <em>cédula profesional</em> mexicaine."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cómo encuentro una farmacia abierta de noche?" data-en="How do I find a pharmacy open at night?" data-fr="Comment trouver une pharmacie ouverte la nuit ?"></h3>
      <p data-es="Según el gobierno británico, muchas farmacias en las grandes ciudades de México dan servicio las 24 horas. Pregunte en la recepción de su hotel o busque en un mapa, y llame antes de ir para confirmar que está abierta." data-en="According to the UK government, many pharmacies in large Mexican cities are open 24 hours. Ask your hotel front desk or search on a map, and call ahead to confirm it is open." data-fr="Selon le gouvernement britannique, de nombreuses pharmacies des grandes villes du Mexique sont ouvertes 24 heures sur 24. Demandez à la réception de votre hôtel ou cherchez sur une carte, et appelez avant d’y aller pour confirmer qu’elle est ouverte."></p>
    </div>

    <div class="emergency-note" data-es="<strong>Ante una emergencia, llame al 911</strong> o acuda a urgencias hospitalarias. Vea también <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias en la Ciudad de México</a>." data-en="<strong>In an emergency, call 911</strong> or go to a hospital emergency room. See also <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER in Mexico City</a>." data-fr="<strong>En cas d’urgence, appelez le 911</strong> ou rendez-vous aux urgences d’un hôpital. Voir aussi <a href='/fr/guides/urgences-mexico/'>quand aller aux urgences à Mexico</a>."></div>

    <div class="callout" data-solo="fr" data-es="" data-en="" data-fr="<strong>Consultation en espagnol ou en anglais.</strong> Pour les patients francophones, une assistante traduit pendant la consultation (<span data-tarifa='asistente-frances'></span> MXN en supplément), sous réserve de disponibilité ; demandez-la lors de la réservation. Sa présence est couverte par le consentement éclairé, obligatoire avant la consultation."></div>
