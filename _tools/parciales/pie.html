<div class="lang-hint" id="lang-hint" hidden><a id="lang-hint-link"></a><button type="button" id="lang-hint-x" aria-label="Cerrar / Close" data-aria-fr="Fermer">×</button></div>
<script>
/* ── IDIOMA: cada idioma tiene su propia URL (/ y /en/) ── */
(function(){
  const htmlLang = document.documentElement.lang;
  const lang = htmlLang.startsWith('en') ? 'en' : htmlLang.startsWith('fr') ? 'fr' : 'es';
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
    b.addEventListener('click', () => { try { localStorage.setItem('lang', b.dataset.lang); } catch { /* sin almacenamiento */ } });
  });
  // Sugerencia discreta (sin redirigir) si el navegador está en otro idioma
  let saved = null;
  try { saved = localStorage.getItem('lang'); } catch { /* sin almacenamiento */ }
  const nav = (navigator.language || '').toLowerCase();
  const hint = document.getElementById('lang-hint');
  const link = document.getElementById('lang-hint-link');
  const show = (href, text) => {
    link.href = href; link.textContent = text; hint.hidden = false;
    const bar = document.querySelector('nav'); hint.style.top = (bar ? bar.offsetHeight : 0) + 'px';
  };
  if (!saved && lang === 'es' && nav.startsWith('en')) show('{{URL_EN}}', 'View this page in English →');
  if (!saved && lang === 'en' && nav.startsWith('es')) show('{{URL_ES}}', 'Ver esta página en español →');
  if (!saved && lang !== 'fr' && nav.startsWith('fr')) show('{{URL_FR}}', 'Voir cette page en français →');
  document.getElementById('lang-hint-x').addEventListener('click', () => {
    hint.hidden = true; try { localStorage.setItem('lang', lang); } catch { /* sin almacenamiento */ }
  });
})();

/* ── MENÚ MÓVIL ──────────────────────────── */
(function(){
  const btn = document.querySelector('.nav-menu-btn');
  const links = document.getElementById('nav-links');
  btn.addEventListener('click', () => {
    const open = links.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
  links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    links.classList.remove('open'); btn.setAttribute('aria-expanded', 'false');
  }));
})();

/* ── ACORDEÓN DE PROCEDIMIENTOS ──────────── */
document.querySelectorAll('.proc-cat-header').forEach(btn => {
  btn.addEventListener('click', () => {
    const open = btn.closest('.proc-cat').classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
});

/* ── BARRA MÓVIL: aparece al pasar los botones principales ── */
(function(){
  const bar = document.querySelector('.mobile-bar');
  const ctas = document.querySelector('.hero2 .hero-ctas, .page-hero .hero-ctas');
  if (!bar) return;
  if (!ctas) { bar.classList.add('visible'); return; }
  const check = () => bar.classList.toggle('visible', ctas.getBoundingClientRect().bottom < 0);
  window.addEventListener('scroll', check, { passive: true });
  window.addEventListener('resize', check);
  check();
})();

/* ── MEDICIÓN: clics en WhatsApp y en reservar (Google Analytics) ── */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href*="wa.me"], a[href*="cal.com"]');
  if (!a || typeof gtag !== 'function') return;
  gtag('event', a.href.includes('wa.me') ? 'clic_whatsapp' : 'clic_reservar',
       { ubicacion: a.className || 'enlace', pagina: location.pathname });
});

/* ── SCROLL REVEAL ───────────────────────── */
const observer = new IntersectionObserver((entries) => {
  entries.forEach((e, i) => {
    if (e.isIntersecting) setTimeout(() => e.target.classList.add('visible'), i * 65);
  });
}, { threshold: 0.06 });
document.querySelectorAll('.reveal').forEach(r => observer.observe(r));
</script>
