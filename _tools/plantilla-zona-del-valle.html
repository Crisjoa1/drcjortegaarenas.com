    <h2 data-es="Honorarios en la Del Valle" data-en="Fees in Del Valle"></h2>
    <p data-es="Para visitas a hotel, la Del Valle está en la <strong>Zona <span data-tarifa='zona:Del Valle'></span></strong>. A domicilio, la Del Valle está en la zona local de la tabla de tarifas. Montos en pesos mexicanos, por consulta:" data-en="For hotel visits, Del Valle is in <strong>Zone <span data-tarifa='zona:Del Valle'></span></strong>. For house calls, Del Valle is in the local zone of the fee table. Amounts in Mexican pesos, per visit:"></p>

        <th data-es="Servicio" data-en="Service"></th>
        <th style="text-align:right" data-es="Ordinario" data-en="Standard"></th>
        <th style="text-align:right" data-es="Especial" data-en="After-hours"></th>

        <tr><td data-es="Consulta a domicilio" data-en="House call"></td><td class="price-col" data-tarifa="domicilio:Del Valle:0"></td><td class="price-col" data-tarifa="domicilio:Del Valle:1"></td><td class="price-col" data-tarifa="domicilio:Del Valle:2"></td></tr>
        <tr><td data-es="Visita en hotel" data-en="Hotel visit"></td><td class="price-col" data-tarifa="hotel:Del Valle:0"></td><td class="price-col" data-tarifa="hotel:Del Valle:1"></td><td class="price-col" data-tarifa="hotel:Del Valle:2"></td></tr>
      </tbody>
    </table>
    <p data-es="La tarifa depende del horario y del día, y se confirma al solicitar la visita; los festivos se coordinan solo por WhatsApp. Horarios ordinario, especial y festivo en la <a href='/#tarifas'>sección de tarifas</a>, con los mismos honorarios." data-en="The fee depends on the time and day, and is confirmed when you request the visit; holidays are arranged via WhatsApp only. Standard, after-hours and holiday times are in the <a href='/en/#tarifas'>fees section</a>, with the same fees."></p>
    <p data-es="<strong>Anticipo y cancelación.</strong> La visita a hotel no requiere anticipo: se paga directamente al médico, en pesos mexicanos. La consulta a domicilio se solicita por WhatsApp y se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Del Valle'></span>, el 50 % de la tarifa ordinaria. El resto, y en horario especial o festivo la diferencia, se paga al médico en la visita. Si cancela con al menos 3 horas de anticipación, se reembolsa el anticipo; con menos de 3 horas, o si no está en el domicilio a la hora acordada, no es reembolsable." data-en="<strong>Deposit and cancellation.</strong> Hotel visits need no deposit: they are paid directly to the doctor, in Mexican pesos. House calls are requested via WhatsApp and confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Del Valle'></span>, 50% of the standard fee. The rest, and the difference for after-hours or holiday visits, is paid to the doctor at the visit. If you cancel at least 3 hours in advance, the deposit is refunded; with less than 3 hours' notice, or if you are not at the address at the agreed time, it is non-refundable."></p>

    <h2 data-es="Consultas subsecuentes y de seguimiento" data-en="Follow-up visits at the clinic and at home"></h2>

      <li data-es="<strong>En el consultorio:</strong> la consulta subsecuente en el consultorio cuesta <span data-tarifa='subsecuente:Del Valle'></span>. La cita de las 20:00, de lunes a viernes, es solo para subsecuentes." data-en="<strong>At the clinic:</strong> a follow-up clinic visit costs <span data-tarifa='subsecuente:Del Valle'></span>. The 8:00 pm slot, Monday to Friday, is for follow-up visits only."></li>
      <li data-es="<strong>A domicilio:</strong> el seguimiento en la Del Valle cuesta <span data-tarifa='seguimiento:Del Valle'></span>, solo en horario ordinario; en horario especial o festivo aplica la tarifa de la tabla." data-en="<strong>At home:</strong> a follow-up house call in Del Valle costs <span data-tarifa='seguimiento:Del Valle'></span>, during standard hours only; after-hours and holiday visits are charged at the table rate."></li>
    </ul>

    <h2 data-es="Paquete Viajero en el consultorio Del Valle" data-en="Traveler Package at the Del Valle clinic"></h2>
    <p data-es="Por <span data-tarifa='paquete:Del Valle'></span> MXN incluye la consulta, el Resumen Clínico del Viajero impreso en inglés y, si la valoración clínica lo sustenta, un certificado médico presencial. Si la valoración no sustenta el certificado, solo se cobran la consulta y el resumen: <span data-tarifa='paquete-sin-certificado:Del Valle'></span> MXN. Precio vigente durante 2026. Detalles en <a href='/certificados-y-viajeros/'>certificados y documentos para viajeros</a>." data-en="For MXN <span data-tarifa='paquete:Del Valle'></span>, it includes the consultation, the printed Travel Clinical Summary in English and, if the clinical assessment supports it, an in-person medical certificate. If the assessment does not support a certificate, only the consultation and the summary are charged: MXN <span data-tarifa='paquete-sin-certificado:Del Valle'></span>. Price valid through 2026. Details in <a href='/en/travel-medical-certificates/'>certificates and documents for travelers</a>."></p>

    <h2 data-es="Consultorio en la Del Valle" data-en="Clinic in Del Valle"></h2>
    <p data-es="Con cita, de lunes a viernes por la tarde y los sábados por la mañana. El consultorio está en Briyam Coworking Médico, sede Florida del Valle: <span data-sede='Del Valle'></span>. Su cita queda confirmada al pagar en línea, con tarjeta, el anticipo del 50 % (<span data-tarifa='anticipo:Del Valle'></span> de <span data-tarifa='consultorio:Del Valle'></span>); el resto se paga en el consultorio. Horario detallado y política de cancelación en la <a href='/#tarifas'>sección de tarifas</a>. Si es su primera consulta, puede llenar antes los <a href='/formularios/'>formularios</a>." data-en="By appointment on weekday evenings and Saturday mornings. The clinic is at Briyam Coworking Médico, Florida del Valle location: <span data-sede='Del Valle'></span>. Your appointment is confirmed once you pay the 50% deposit online by card (<span data-tarifa='anticipo:Del Valle'></span> of <span data-tarifa='consultorio:Del Valle'></span>); the rest is paid at the clinic. Detailed hours and cancellation policy are in the <a href='/en/#tarifas'>fees section</a>. For a first visit, you can fill in the <a href='/formularios/'>forms</a> beforehand."></p>

    <h2 data-es="Cuánto tarda en llegar" data-en="How long it takes to arrive"></h2>
    <p data-es="Para visitas a domicilio u hotel en la Del Valle, sujetas a disponibilidad, el tiempo estimado de llegada es de <strong>unos 45 minutos</strong>, según el tráfico; puede ser menos. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada." data-en="For house calls or hotel visits in Del Valle, subject to availability, the estimated arrival time is <strong>about 45 minutes</strong>, depending on traffic; it may be shorter. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time."></p>
    <p data-es="Es medicina general ambulatoria para padecimientos leves; no sustituye a un hospital. Vea <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias</a> y la <a href='/guias/farmacias-cdmx/'>guía de farmacias en la CDMX</a>." data-en="This is outpatient general medicine for mild conditions; it does not replace a hospital. See <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER</a> and the <a href='/en/guides/pharmacies-mexico-city/'>Mexico City pharmacy guide</a>."></p>
