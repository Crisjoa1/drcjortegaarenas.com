  <p class="page-lead" data-es="La hidratación intravenosa es la administración de solución por vena. El Dr. Ortega-Arenas la ofrece en su hotel o domicilio en la Ciudad de México solo cuando la valoración médica previa la justifica, porque la rehidratación oral es el tratamiento de primera elección. Cargo: $1,800 MXN, más la visita y el honorario de enfermería." data-en="IV hydration is the delivery of fluids through a vein. Dr. Ortega-Arenas offers it at your hotel or home in Mexico City only when the prior medical assessment justifies it, because oral rehydration is the first-choice treatment. Fee: $1,800 MXN, plus the visit and the nursing fee." data-fr="L’hydratation intraveineuse est l’administration de soluté par voie veineuse. Le Dr Ortega-Arenas la propose à votre hôtel ou à domicile à Mexico uniquement lorsque l’évaluation médicale préalable la justifie, car la réhydratation orale est le traitement de premier choix. Tarif : $1,800 MXN, plus la visite et les honoraires infirmiers."></p>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Cómo se realiza" data-en="How it works" data-fr="Déroulement"></h2>
    <ol>
      <li data-es="&lt;strong&gt;Valoración médica previa obligatoria&lt;/strong&gt; por el Dr. Ortega-Arenas, en su hotel o domicilio." data-en="&lt;strong&gt;Mandatory prior medical assessment&lt;/strong&gt; by Dr. Ortega-Arenas at your hotel or home." data-fr="&lt;strong&gt;Évaluation médicale préalable obligatoire&lt;/strong&gt; par le Dr Ortega-Arenas, à votre hôtel ou à domicile."></li>
      <li data-es="Si la hidratación intravenosa no está clínicamente indicada, no se aplica. En ese caso solo se cobran la visita y los materiales de la valoración." data-en="If IV hydration is not clinically indicated, it is not given. In that case, only the visit and the materials used in the assessment are charged." data-fr="Si l’hydratation intraveineuse n’est pas cliniquement indiquée, elle n’est pas administrée. Dans ce cas, seuls la visite et le matériel utilisé pour l’évaluation sont facturés."></li>
      <li data-es="Si está indicada, el médico la prescribe por escrito&lt;sup&gt;2&lt;/sup&gt; y usted firma el consentimiento informado." data-en="If it is indicated, the physician prescribes it in writing&lt;sup&gt;2&lt;/sup&gt; and you sign the informed consent form." data-fr="Si elle est indiquée, le médecin la prescrit par écrit&lt;sup&gt;2&lt;/sup&gt; et vous signez le formulaire de consentement éclairé."></li>
      <li data-es="Personal de enfermería con cédula profesional coloca la vía intravenosa bajo supervisión del médico. La NOM-022-SSA3-2012 indica que la terapia de infusión la aplique preferentemente personal profesional de salud.&lt;sup&gt;2&lt;/sup&gt;" data-en="A licensed nurse places the IV line under the physician’s supervision. The Mexican standard NOM-022-SSA3-2012 states that infusion therapy should preferably be given by licensed health professionals.&lt;sup&gt;2&lt;/sup&gt;" data-fr="Un(e) infirmier(ère) titulaire d’une licence professionnelle mexicaine (cédula) pose la voie veineuse sous la supervision du médecin. La norme mexicaine NOM-022-SSA3-2012 indique que la thérapie par perfusion doit de préférence être administrée par des professionnels de santé.&lt;sup&gt;2&lt;/sup&gt;"></li>
    </ol>
    <h2 data-es="Cuándo puede estar indicada" data-en="When it may be indicated" data-fr="Quand elle peut être indiquée"></h2>
    <p data-es="La rehidratación oral es el tratamiento de primera elección en la deshidratación leve a moderada, incluso cuando hay vómito.&lt;sup&gt;1&lt;/sup&gt; La vía intravenosa puede considerarse cuando un intento adecuado de rehidratación oral fracasa, según la valoración médica.&lt;sup&gt;1&lt;/sup&gt; No se ofrece para bienestar, resaca, energía ni rendimiento." data-en="Oral rehydration is the first-choice treatment for mild to moderate dehydration, even when there is vomiting.&lt;sup&gt;1&lt;/sup&gt; The IV route may be considered when an adequate attempt at oral rehydration fails, as judged at the medical assessment.&lt;sup&gt;1&lt;/sup&gt; It is not offered for wellness, hangover, energy or performance." data-fr="La réhydratation orale est le traitement de premier choix de la déshydratation légère à modérée, même en cas de vomissements.&lt;sup&gt;1&lt;/sup&gt; La voie intraveineuse peut être envisagée lorsqu’une tentative adéquate de réhydratation orale échoue, selon l’évaluation médicale.&lt;sup&gt;1&lt;/sup&gt; Elle n’est pas proposée pour le bien-être, la gueule de bois, l’énergie ou la performance."></p>
    <h2 data-es="Qué incluye · $1,800 MXN" data-en="What is included · $1,800 MXN" data-fr="Ce qui est inclus · $1,800 MXN"></h2>
    <ul>
      <li data-es="Solución fisiológica (cloruro de sodio al 0.9 %) por vía intravenosa.&lt;sup&gt;1&lt;/sup&gt;" data-en="Normal saline (0.9% sodium chloride) given intravenously.&lt;sup&gt;1&lt;/sup&gt;" data-fr="Sérum physiologique (chlorure de sodium à 0,9 %) par voie intraveineuse.&lt;sup&gt;1&lt;/sup&gt;"></li>
      <li data-es="Si la valoración lo indica, puede administrarse un antiemético o un analgésico. Antes de aplicarlo, el médico le explica cuál, para qué y sus posibles efectos adversos. La evidencia sobre el beneficio de los antieméticos en adultos es limitada, por eso se decide caso por caso.&lt;sup&gt;4&lt;/sup&gt;" data-en="If the assessment indicates it, an antiemetic or a pain reliever may be given. Before giving it, the physician explains which one, why, and its possible side effects. Evidence on the benefit of antiemetics in adults is limited, so this is decided case by case.&lt;sup&gt;4&lt;/sup&gt;" data-fr="Si l’évaluation l’indique, un antiémétique ou un antalgique peut être administré. Avant de l’administrer, le médecin vous explique lequel, pourquoi et ses effets indésirables possibles. Les données sur le bénéfice des antiémétiques chez l’adulte sont limitées ; la décision se prend donc au cas par cas.&lt;sup&gt;4&lt;/sup&gt;"></li>
      <li data-es="No se añaden vitaminas, minerales ni otros complementos: no hay evidencia de calidad de que las infusiones de vitaminas aporten beneficio a personas sin una deficiencia o enfermedad específica.&lt;sup&gt;5&lt;/sup&gt;" data-en="No vitamins, minerals or other supplements are added: there is no high-quality evidence that vitamin infusions benefit people without a specific deficiency or medical condition.&lt;sup&gt;5&lt;/sup&gt;" data-fr="Aucune vitamine, aucun minéral ni autre complément n’est ajouté : aucune donnée de qualité ne montre que les perfusions de vitamines apportent un bénéfice aux personnes sans carence ni maladie spécifique.&lt;sup&gt;5&lt;/sup&gt;"></li>
    </ul>
    <h2 data-es="Cuánto cuesta en total" data-en="Total cost" data-fr="Coût total"></h2>
    <div class="callout">
      <p data-es="<strong>Total = $1,800 + honorario de visita + honorario de enfermería</strong>" data-en="<strong>Total = $1,800 + visit fee + nursing fee</strong>" data-fr="<strong>Total = $1,800 + honoraires de visite + honoraires infirmiers</strong> (+ <span data-tarifa='asistente-frances'></span> MXN si vous demandez l’assistante de traduction ; <span data-tarifa='asistente-frances-hotel-especial'></span> MXN à l’hôtel en horaires spéciaux ou un jour férié)"></p>
    </div>

    <h2 data-es="Riesgos y límites" data-en="Risks and limits" data-fr="Risques et limites"></h2>
    <p data-es="La hidratación intravenosa no sustituye a la vía oral cuando esta es posible.&lt;sup&gt;1&lt;/sup&gt; Conlleva riesgos, como flebitis, infiltración o extravasación, infección del sitio de punción y sobrecarga de líquidos.&lt;sup&gt;2,3,6&lt;/sup&gt; Por eso solo se aplica si la valoración médica la justifica." data-en="IV hydration does not replace drinking fluids when that is possible.&lt;sup&gt;1&lt;/sup&gt; It carries risks, such as phlebitis, infiltration or extravasation, infection at the insertion site and fluid overload.&lt;sup&gt;2,3,6&lt;/sup&gt; That is why it is given only if the medical assessment justifies it." data-fr="L’hydratation intraveineuse ne remplace pas l’hydratation orale lorsque celle-ci est possible.&lt;sup&gt;1&lt;/sup&gt; Elle comporte des risques, comme la phlébite, l’infiltration ou l’extravasation, l’infection au point de ponction et la surcharge liquidienne.&lt;sup&gt;2,3,6&lt;/sup&gt; C’est pourquoi elle n’est administrée que si l’évaluation médicale la justifie."></p>
    <h2 data-es="Cuándo NO solicitar este servicio" data-en="When NOT to book this service" data-fr="Quand NE PAS demander ce service"></h2>
    <div class="emergency-note" data-es="Si presenta alguno de estos signos, &lt;strong&gt;no solicite este servicio: llame al 911&lt;/strong&gt; o acuda a urgencias hospitalarias: alteración del estado de conciencia (somnolencia, confusión, desmayo), dolor en el pecho, dificultad para respirar, o deshidratación grave (no poder beber ni retener líquidos, casi no orinar, signos de choque).&lt;sup&gt;1,7,8,9&lt;/sup&gt;" data-en="If you have any of these signs, &lt;strong&gt;do not book this service: call 911&lt;/strong&gt; or go to a hospital emergency room: altered consciousness (drowsiness, confusion, fainting), chest pain, trouble breathing, or severe dehydration (cannot drink or keep fluids down, passing almost no urine, signs of shock).&lt;sup&gt;1,7,8,9&lt;/sup&gt;" data-fr="Si vous présentez l’un de ces signes, &lt;strong&gt;ne demandez pas ce service : appelez le 911&lt;/strong&gt; ou rendez-vous aux urgences d’un hôpital : altération de l’état de conscience (somnolence, confusion, évanouissement), douleur thoracique, difficulté à respirer ou déshydratation grave (impossibilité de boire ou de garder les liquides, quasi-absence d’urine, signes de choc).&lt;sup&gt;1,7,8,9&lt;/sup&gt;"></div>
    <h3 data-es="Requieren valoración previa y pueden contraindicar la terapia" data-en="Require prior assessment and may rule out the therapy" data-fr="Nécessitent une évaluation préalable et peuvent contre-indiquer la thérapie"></h3>
    <ul>
      <li data-es="Embarazo: avíselo antes de la visita." data-en="Pregnancy: tell us before the visit." data-fr="Grossesse : signalez-la avant la visite."></li>
      <li data-es="Insuficiencia cardiaca o renal conocida, por el riesgo de sobrecarga de líquidos.&lt;sup&gt;6&lt;/sup&gt;" data-en="Known heart or kidney failure, because of the risk of fluid overload.&lt;sup&gt;6&lt;/sup&gt;" data-fr="Insuffisance cardiaque ou rénale connue, en raison du risque de surcharge liquidienne.&lt;sup&gt;6&lt;/sup&gt;"></li>
    </ul>
    <div class="emergency-note" data-es="&lt;strong&gt;No es un servicio de urgencias.&lt;/strong&gt; Ante una emergencia, llame al &lt;strong&gt;911&lt;/strong&gt; o acuda a urgencias hospitalarias." data-en="&lt;strong&gt;This is not an emergency service.&lt;/strong&gt; In an emergency, call &lt;strong&gt;911&lt;/strong&gt; or go to a hospital emergency room." data-fr="&lt;strong&gt;Ce n’est pas un service d’urgences.&lt;/strong&gt; En cas d’urgence, appelez le &lt;strong&gt;911&lt;/strong&gt; ou rendez-vous aux urgences d’un hôpital."></div>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="¿Necesito receta?" data-en="Do I need a prescription?" data-fr="Ai-je besoin d’une ordonnance ?"></h3>
      <p data-es="No necesita traer una receta. La indicación la define el Dr. Ortega-Arenas en la valoración médica previa, que es obligatoria; sin ella, la hidratación intravenosa no se aplica." data-en="You do not need to bring a prescription. Dr. Ortega-Arenas decides whether it is indicated during the mandatory prior medical assessment; without it, IV hydration is not given." data-fr="Vous n’avez pas besoin d’apporter d’ordonnance. Le Dr Ortega-Arenas détermine l’indication lors de l’évaluation médicale préalable, qui est obligatoire ; sans elle, l’hydratation intraveineuse n’est pas administrée."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Por qué no incluye vitaminas?" data-en="Why are no vitamins included?" data-fr="Pourquoi n’y a-t-il pas de vitamines ?"></h3>
      <p data-es="Porque no hay evidencia de calidad de que las infusiones de vitaminas aporten beneficio a personas sin una deficiencia o enfermedad específica, y las dosis altas pueden causar daño.&lt;sup&gt;5&lt;/sup&gt; Por eso no se incluyen." data-en="Because there is no high-quality evidence that vitamin infusions benefit people without a specific deficiency or medical condition, and high doses may cause harm.&lt;sup&gt;5&lt;/sup&gt; That is why they are not included." data-fr="Parce qu’aucune donnée de qualité ne montre que les perfusions de vitamines apportent un bénéfice aux personnes sans carence ni maladie spécifique, et les fortes doses peuvent être nocives.&lt;sup&gt;5&lt;/sup&gt; C’est pourquoi elles ne sont pas incluses."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuánto dura?" data-en="How long does it take?" data-fr="Combien de temps dure-t-elle ?"></h3>
      <p data-es="Depende del volumen que se indique en la valoración. El médico le informa el tiempo estimado antes de que firme el consentimiento informado." data-en="It depends on the volume indicated at the assessment. The physician tells you the estimated time before you sign the informed consent form." data-fr="Cela dépend du volume indiqué lors de l’évaluation. Le médecin vous indique la durée estimée avant que vous ne signiez le formulaire de consentement éclairé."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Qué pasa si no es para mí?" data-en="What if it is not right for me?" data-fr="Et si elle ne me convient pas ?"></h3>
      <p data-es="Si la valoración muestra que la hidratación intravenosa no está clínicamente indicada, no se aplica. Solo se cobran la visita y los materiales de la valoración." data-en="If the assessment shows that IV hydration is not clinically indicated, it is not given. Only the visit and the materials used in the assessment are charged." data-fr="Si l’évaluation montre que l’hydratation intraveineuse n’est pas cliniquement indiquée, elle n’est pas administrée. Seuls la visite et le matériel utilisé pour l’évaluation sont facturés."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuánto cuesta en total?" data-en="What is the total cost?" data-fr="Quel est le coût total ?"></h3>
      <p data-es="$1,800 + honorario de visita + honorario de enfermería. Por ejemplo, con visita a hotel en Zona A y enfermería en horario ordinario: $1,800 + $2,500 + $1,500 = $5,800 MXN." data-en="$1,800 + visit fee + nursing fee. For example, with a hotel visit in Zone A and nursing during standard hours: $1,800 + $2,500 + $1,500 = $5,800 MXN." data-fr="$1,800 + honoraires de visite + honoraires infirmiers. Par exemple, avec une visite à l’hôtel en zone A et des soins infirmiers en horaire ordinaire : $1,800 + $2,500 + $1,500 = $5,800 MXN."></p>
    </div>
