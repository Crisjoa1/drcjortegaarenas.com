  <article class="prose">
    <h2 data-es="Honorarios en la Roma y la Condesa" data-en="Fees in Roma and Condesa" data-fr="Honoraires à Roma et Condesa"></h2>
    <p data-es="Las dos colonias están en la <strong>Zona <span data-tarifa='zona:Roma'></span></strong> de visitas a hotel y comparten tarifa de consulta a domicilio. El consultorio está en la Roma; no hay sede en la Condesa. Montos en pesos mexicanos, por consulta:" data-en="Both neighborhoods are in hotel visit <strong>Zone <span data-tarifa='zona:Roma'></span></strong> and share the same house call fee. The clinic is in Roma; there is no Condesa location. Amounts in Mexican pesos, per visit:" data-fr="Les deux quartiers se trouvent en <strong>zone <span data-tarifa='zona:Roma'></span></strong> pour les visites à l’hôtel et partagent le même tarif de consultation à domicile. Le cabinet est à Roma ; il n’y a pas de site à Condesa. Montants en pesos mexicains, par consultation :"></p>
    <table>
      <thead><tr>
        <th data-es="Servicio" data-en="Service" data-fr="Service"></th>
        <th style="text-align:right" data-es="Ordinario" data-en="Standard" data-fr="Ordinaire"></th>
        <th style="text-align:right" data-es="Especial" data-en="After-hours" data-fr="Horaire spécial"></th>
        <th style="text-align:right" data-es="Festivo" data-en="Holiday" data-fr="Jour férié"></th>
      </tr></thead>
      <tbody>
        <tr><td data-es="Visita en hotel" data-en="Hotel visit" data-fr="Visite à l’hôtel"></td><td class="price-col" data-tarifa="hotel:Roma:0"></td><td class="price-col" data-tarifa="hotel:Roma:1"></td><td class="price-col" data-tarifa="hotel:Roma:2"></td></tr>
        <tr><td data-es="Consulta a domicilio" data-en="House call" data-fr="Consultation à domicile"></td><td class="price-col" data-tarifa="domicilio:Condesa:0"></td><td class="price-col" data-tarifa="domicilio:Condesa:1"></td><td class="price-col" data-tarifa="domicilio:Condesa:2"></td></tr>
        <tr><td data-es="Consultorio Roma (con cita)" data-en="Roma clinic (by appointment)" data-fr="Cabinet de Roma (sur rendez-vous)"></td><td class="price-col" data-tarifa="consultorio:Roma"></td><td class="price-col">—</td><td class="price-col" data-tarifa="consultorio:Días Festivos"></td></tr>
      </tbody>
    </table>
    <p data-es="La tarifa depende del horario y del día, y se confirma al solicitar la visita; los festivos se coordinan solo por WhatsApp. Horarios ordinario, especial y festivo en la <a href='/#tarifas'>sección de tarifas</a>, con los mismos honorarios." data-en="The fee depends on the time and day, and is confirmed when you request the visit; holidays are arranged via WhatsApp only. Standard, after-hours and holiday times are in the <a href='/en/#tarifas'>fees section</a>, with the same fees." data-fr="Le tarif dépend de l’horaire et du jour, et il est confirmé lors de la demande de visite ; les jours fériés s’organisent uniquement par WhatsApp. Horaires ordinaires, hors horaires et jours fériés dans la <a href='/fr/#tarifas'>section des tarifs</a>, avec les mêmes honoraires."></p>
    <p data-es="<strong>Anticipo y cancelación.</strong> La visita a hotel no requiere anticipo: se paga directamente al médico, en pesos mexicanos. La consulta a domicilio se solicita por WhatsApp y se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Condesa'></span>, el 50 % de la tarifa ordinaria. El resto, y en horario especial o festivo la diferencia, se paga al médico en la visita. Si cancela con al menos 3 horas de anticipación, se reembolsa el anticipo; con menos de 3 horas, o si no está en el domicilio a la hora acordada, no es reembolsable." data-en="<strong>Deposit and cancellation.</strong> Hotel visits need no deposit: they are paid directly to the doctor, in Mexican pesos. House calls are requested via WhatsApp and confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Condesa'></span>, 50% of the standard fee. The rest, and the difference for after-hours or holiday visits, is paid to the doctor at the visit. If you cancel at least 3 hours in advance, the deposit is refunded; with less than 3 hours' notice, or if you are not at the address at the agreed time, it is non-refundable." data-fr="<strong>Acompte et annulation.</strong> La visite à l’hôtel ne nécessite pas d’acompte : elle se paie directement au médecin, en pesos mexicains. La consultation à domicile se demande par WhatsApp et se confirme par un virement de <span data-tarifa='anticipo-domicilio:Condesa'></span>, soit 50 % du tarif ordinaire. Le solde, ainsi que la différence en cas de visite hors horaires ou un jour férié, se paie au médecin lors de la visite. Si vous annulez au moins 3 heures à l’avance, l’acompte est remboursé ; à moins de 3 heures, ou si vous n’êtes pas à l’adresse à l’heure convenue, il n’est pas remboursable."></p>

    <h2 data-es="Si se hospeda en un departamento de renta temporal" data-en="If you are staying in a short-term rental" data-fr="Si vous logez dans un appartement en location de courte durée"></h2>
    <p data-es="Al escribir por WhatsApp, indique si está en un hotel, en un departamento de renta temporal o en una casa particular, y la dirección. Así se le confirma qué tarifa aplica antes de la visita. Tenga a la mano el nombre del edificio, el número de departamento y, si hay vigilancia en la entrada, avise que espera al médico." data-en="When you message on WhatsApp, say whether you are at a hotel, a short-term rental apartment or a private home, and give the address. That way the applicable fee is confirmed before the visit. Have the building name and apartment number ready and, if there is a security desk, let them know you are expecting the doctor." data-fr="Lorsque vous écrivez par WhatsApp, indiquez si vous êtes à l’hôtel, dans un appartement en location de courte durée ou dans une maison particulière, ainsi que l’adresse. Le tarif applicable vous est ainsi confirmé avant la visite. Ayez à portée de main le nom de l’immeuble et le numéro de l’appartement et, s’il y a un gardien à l’entrée, prévenez-le que vous attendez le médecin."></p>

    <h2 data-es="Cuánto tarda en llegar" data-en="How long it takes to arrive" data-fr="Délai d’arrivée"></h2>
    <p data-es="Sujeto a disponibilidad, el tiempo estimado de llegada a la Roma y la Condesa es de <strong>unos 45 minutos</strong>, según el tráfico; puede ser menos. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada." data-en="Subject to availability, the estimated arrival time in Roma and Condesa is <strong>about 45 minutes</strong>, depending on traffic; it may be shorter. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time." data-fr="Sous réserve de disponibilité, le délai d’arrivée estimé à Roma et Condesa est d’<strong>environ 45 minutes</strong>, selon la circulation ; il peut être moins long. Lors de la réservation, envoyez un WhatsApp au +52 595 109 3969 et une heure estimée vous sera confirmée."></p>

    <h2 data-es="Consultorio en la Roma" data-en="Clinic in Roma" data-fr="Cabinet à Roma"></h2>
    <p data-es="Con cita, de lunes a viernes por la tarde y los sábados por la mañana. El consultorio está en Briyam Coworking Médico, sede Roma Sur: <span data-sede='Roma'></span>. Su cita queda confirmada al pagar en línea, con tarjeta, el anticipo del 50 % (<span data-tarifa='anticipo:Roma'></span> de <span data-tarifa='consultorio:Roma'></span>); el resto se paga en el consultorio. Horario detallado y política de cancelación en la <a href='/#tarifas'>sección de tarifas</a>." data-en="By appointment on weekday evenings and Saturday mornings. The clinic is at Briyam Coworking Médico, Roma Sur location: <span data-sede='Roma'></span>. Your appointment is confirmed once you pay the 50% deposit online by card (<span data-tarifa='anticipo:Roma'></span> of <span data-tarifa='consultorio:Roma'></span>); the rest is paid at the clinic. Detailed hours and cancellation policy are in the <a href='/en/#tarifas'>fees section</a>." data-fr="Sur rendez-vous, du lundi au vendredi en fin de journée et le samedi matin. Le cabinet se trouve chez Briyam Coworking Médico, site Roma Sur : <span data-sede='Roma'></span>. Votre rendez-vous est confirmé une fois l’acompte de 50 % payé en ligne par carte (<span data-tarifa='anticipo:Roma'></span> sur <span data-tarifa='consultorio:Roma'></span>) ; le solde se paie au cabinet. Horaires détaillés et conditions d’annulation dans la <a href='/fr/#tarifas'>section des tarifs</a>."></p>

    <h2 data-es="Para viajeros" data-en="For travelers" data-fr="Pour les voyageurs"></h2>
    <p data-es="Si necesita un certificado médico para su aerolínea o un resumen clínico en inglés para su seguro, vea <a href='/certificados-y-viajeros/'>certificados y documentos para viajeros</a>. Para padecimientos frecuentes al llegar a la ciudad, hay guías sobre la <a href='/guias/altitud-cdmx/'>altitud</a>, la <a href='/guias/diarrea-del-viajero/'>diarrea del viajero</a> y las <a href='/guias/farmacias-cdmx/'>farmacias en la CDMX</a>." data-en="If you need a medical certificate for your airline or an English-language clinical summary for your insurer, see <a href='/en/travel-medical-certificates/'>certificates and documents for travelers</a>. For common problems after arriving in the city, there are guides on <a href='/en/guides/mexico-city-altitude/'>altitude</a>, <a href='/en/guides/travelers-diarrhea-mexico-city/'>traveler's diarrhea</a> and <a href='/en/guides/pharmacies-mexico-city/'>Mexico City pharmacies</a>." data-fr="Si vous avez besoin d’un certificat médical pour votre compagnie aérienne ou d’un résumé clinique en anglais pour votre assurance, consultez <a href='/fr/certificats-voyageurs/'>certificats et documents pour les voyageurs</a>. Pour les problèmes fréquents à l’arrivée dans la ville, il existe des guides sur l’<a href='/fr/guides/altitude-mexico/'>altitude</a>, la <a href='/fr/guides/diarrhee-du-voyageur-mexico/'>diarrhée du voyageur</a> et les <a href='/fr/guides/pharmacies-mexico/'>pharmacies à Mexico</a>."></p>
    <p data-es="Es medicina general ambulatoria para padecimientos leves; no sustituye a un hospital. Vea <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias</a>." data-en="This is outpatient general medicine for mild conditions; it does not replace a hospital. See <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER</a>." data-fr="Il s’agit de médecine générale ambulatoire pour des affections légères ; elle ne remplace pas un hôpital. Voir <a href='/fr/guides/urgences-mexico/'>quand aller aux urgences</a>."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="Me hospedo en un departamento de renta temporal en la Roma o la Condesa. ¿Qué tarifa aplica?" data-en="I'm staying in a short-term rental in Roma or Condesa. Which fee applies?" data-fr="Je loge dans un appartement en location de courte durée à Roma ou à Condesa. Quel tarif s’applique ?"></h3>
      <p data-es="Al escribir por WhatsApp al +52 595 109 3969, indique si está en un hotel, en un departamento de renta temporal o en una casa particular, y la dirección; así se le confirma qué tarifa aplica antes de la visita. Como referencia, en horario ordinario la visita en hotel cuesta desde <span data-tarifa='hotel:Roma:0'></span> MXN y la consulta a domicilio desde <span data-tarifa='domicilio:Condesa:0'></span> MXN." data-en="When you message on WhatsApp at +52 595 109 3969, say whether you are at a hotel, a short-term rental apartment or a private home, and give the address; you will be told which fee applies before the visit. For reference, at standard hours a hotel visit costs from <span data-tarifa='hotel:Roma:0'></span> MXN and a house call from <span data-tarifa='domicilio:Condesa:0'></span> MXN." data-fr="Lorsque vous écrivez par WhatsApp au +52 595 109 3969, indiquez si vous êtes à l’hôtel, dans un appartement en location de courte durée ou dans une maison particulière, ainsi que l’adresse ; le tarif applicable vous est ainsi confirmé avant la visite. À titre indicatif, en horaire ordinaire, la visite à l’hôtel coûte à partir de <span data-tarifa='hotel:Roma:0'></span> MXN et la consultation à domicile à partir de <span data-tarifa='domicilio:Condesa:0'></span> MXN."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Qué datos debo tener listos para que el médico llegue al departamento?" data-en="What details should I have ready so the doctor can reach the apartment?" data-fr="Quelles informations dois-je avoir à portée de main pour que le médecin puisse accéder à l’appartement ?"></h3>
      <p data-es="El nombre del edificio, el número de departamento y la dirección completa. Si hay vigilancia en la entrada, avise que espera al médico. El tiempo estimado de llegada a la Roma y la Condesa es de unos 45 minutos, según el tráfico; puede ser menos. Si aplica la tarifa a domicilio, la visita se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Condesa'></span> MXN, el 50 % de la tarifa ordinaria." data-en="The building name, the apartment number and the full address. If there is a security desk at the entrance, let them know you are expecting the doctor. Estimated arrival in Roma and Condesa is about 45 minutes, depending on traffic; it may be shorter. If the house-call fee applies, the visit is confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Condesa'></span> MXN, 50% of the standard fee." data-fr="Le nom de l’immeuble, le numéro de l’appartement et l’adresse complète. S’il y a un gardien à l’entrée, prévenez-le que vous attendez le médecin. Le délai d’arrivée estimé à Roma et Condesa est d’environ 45 minutes, selon la circulation ; il peut être moins long. Si le tarif à domicile s’applique, la visite est confirmée par un virement de <span data-tarifa='anticipo-domicilio:Condesa'></span> MXN, soit 50 % du tarif ordinaire."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Hay consultorio en la Condesa?" data-en="Is there a clinic in Condesa?" data-fr="Y a-t-il un cabinet à Condesa ?"></h3>
      <p data-es="No; el consultorio está en la Roma, en Briyam Coworking Médico, sede Roma Sur: <span data-sede='Roma'></span>. Atiende con cita de lunes a viernes de 17:00 a 20:00 y sábados de 11:00 a 15:00. La consulta cuesta <span data-tarifa='consultorio:Roma'></span> MXN; al reservar en línea se paga con tarjeta un anticipo de <span data-tarifa='anticipo:Roma'></span> MXN." data-en="No; the clinic is in Roma, at Briyam Coworking Médico, Roma Sur location: <span data-sede='Roma'></span>. It sees patients by appointment Monday to Friday 5–8 pm and Saturdays 11 am–3 pm. The visit costs <span data-tarifa='consultorio:Roma'></span> MXN; when you book online, you pay a <span data-tarifa='anticipo:Roma'></span> MXN deposit by card." data-fr="Non ; le cabinet est à Roma, chez Briyam Coworking Médico, site Roma Sur : <span data-sede='Roma'></span>. Il reçoit sur rendez-vous du lundi au vendredi de 17 h à 20 h et le samedi de 11 h à 15 h. La consultation coûte <span data-tarifa='consultorio:Roma'></span> MXN ; lors de la réservation en ligne, un acompte de <span data-tarifa='anticipo:Roma'></span> MXN se paie par carte."></p>
    </div>
