  <h1 class="page-h1" data-es="La <em>altitud</em> en la Ciudad de México" data-en="<em>Altitude</em> in Mexico City"></h1>
  <p class="page-lead" data-es="La Ciudad de México está a unos 2,240 m (7,350 ft) en la zona central; algunas zonas del sur y del poniente están más altas. Esta altitud puede causar molestias leves en algunos viajeros durante los primeros días, que suelen mejorar solas en 12 a 48 horas si no sube a mayor altura. Esta guía explica qué puede notar, cómo aclimatarse y cuándo buscar atención médica." data-en="Mexico City sits at about 2,240 m (7,350 ft) in its central area; some southern and western areas are higher. This altitude can cause mild symptoms in some travelers during the first days, which usually improve on their own within 12 to 48 hours if you do not go higher. This guide explains what you may notice, how to acclimatize and when to seek medical care."></p>
</header>

<div class="sep"></div>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Qué puede notar al llegar" data-en="What you may notice on arrival"></h2>
    <p data-es="El mal agudo de montaña suele aparecer por encima de unos 2,500 metros, aunque algunas personas sanas tienen síntomas desde alrededor de 2,000 metros. Cuando aparece, por lo general empieza entre 2 y 12 horas después de llegar, a menudo durante o después de la primera noche. Los síntomas más comunes son:" data-en="Acute mountain sickness usually occurs above about 2,500 meters, although some healthy people have symptoms from around 2,000 meters. When it occurs, it usually starts 2 to 12 hours after arrival, often during or after the first night. The most common symptoms are:"></p>
    <ul>
      <li data-es="Dolor de cabeza, que es el síntoma principal." data-en="Headache, which is the main symptom."></li>
      <li data-es="Cansancio." data-en="Tiredness."></li>
      <li data-es="Mareo." data-en="Dizziness."></li>
      <li data-es="Náuseas o falta de apetito." data-en="Nausea or loss of appetite."></li>
    </ul>
    <p data-es="Las molestias se parecen a las de una resaca y, si no sube a mayor altura, suelen mejorar en 12 a 48 horas." data-en="The symptoms feel similar to a hangover and, if you do not go higher, usually improve within 12 to 48 hours."></p>

    <h2 data-es="Cómo aclimatarse" data-en="How to acclimatize"></h2>
    <ul>
      <li data-es="<strong>Vaya con calma:</strong> limite la actividad física a un nivel ligero durante las primeras 48 horas." data-en="<strong>Take it easy:</strong> keep physical activity light during the first 48 hours."></li>
      <li data-es="<strong>Alcohol:</strong> evítelo durante las primeras 48 horas." data-en="<strong>Alcohol:</strong> avoid it during the first 48 hours."></li>
      <li data-es="<strong>Café:</strong> si lo toma a diario, no lo suspenda de golpe, para evitar un dolor de cabeza por abstinencia." data-en="<strong>Coffee:</strong> if you drink it daily, do not stop suddenly, to avoid a withdrawal headache."></li>
      <li data-es="<strong>Excursiones a mayor altura:</strong> si planea subir a montañas o volcanes cercanos, hágalo de forma gradual y no suba a dormir más alto si tiene síntomas." data-en="<strong>Trips to higher places:</strong> if you plan to visit nearby mountains or volcanoes, go up gradually and do not go higher to sleep if you have symptoms."></li>
    </ul>

    <h2 data-es="Signos de alarma" data-en="Warning signs"></h2>
    <p data-es="Las formas graves del mal de altura son más propias de altitudes mayores. Aun así, llame al 911 o acuda a urgencias si usted o su acompañante presenta:" data-en="Severe forms of altitude illness are more typical of higher altitudes. Even so, call 911 or go to an emergency room if you or your companion has:"></p>
    <ul>
      <li data-es="Confusión, somnolencia, comportamiento extraño o dificultad para caminar en línea recta." data-en="Confusion, drowsiness, unusual behavior or trouble walking in a straight line."></li>
      <li data-es="Falta de aire en reposo, tos persistente, opresión en el pecho o flemas con sangre." data-en="Shortness of breath at rest, a persistent cough, chest tightness or blood-tinged sputum."></li>
      <li data-es="Dolor de cabeza intenso que empeora a pesar del reposo." data-en="A severe headache that gets worse despite rest."></li>
      <li data-es="Vómito persistente." data-en="Persistent vomiting."></li>
    </ul>

    <h2 data-es="Quién debe consultar antes de viajar" data-en="Who should see a doctor before traveling"></h2>
    <p data-es="Pida una valoración médica antes del viaje, aunque su enfermedad esté controlada, si:" data-en="Get a medical assessment before your trip, even if your condition is under control, if you:"></p>
    <ul>
      <li data-es="Tiene una enfermedad del corazón, o tuvo un infarto o un evento vascular cerebral en los últimos 90 días." data-en="Have heart disease, or had a heart attack or stroke in the past 90 days."></li>
      <li data-es="Tiene EPOC moderada o grave, u otra enfermedad pulmonar crónica." data-en="Have moderate or severe COPD or another chronic lung disease."></li>
      <li data-es="Tiene apnea obstructiva del sueño grave." data-en="Have severe obstructive sleep apnea."></li>
      <li data-es="Tiene un embarazo de alto riesgo, o está embarazada y planea dormir por encima de 3,000 m." data-en="Have a high-risk pregnancy, or are pregnant and plan to sleep above 3,000 m."></li>
      <li data-es="Tiene anemia de células falciformes o rasgo falciforme." data-en="Have sickle cell disease or sickle cell trait."></li>
    </ul>
    <h3 data-es="Medicamentos preventivos" data-en="Preventive medicines"></h3>
    <p data-es="Existen medicamentos para prevenir el mal de altura, pero solo debe indicarlos un médico después de valorar su salud, su itinerario y los medicamentos que ya toma. Para la mayoría de los viajeros que se quedan en la ciudad no suelen ser necesarios. Consulte antes si ya tuvo mal de montaña moderado o grave, edema pulmonar o cerebral de altura, o si planea subir a dormir a más de 2,750 m (por ejemplo, en refugios de volcanes)." data-en="There are medicines to prevent altitude illness, but only a doctor should prescribe them after reviewing your health, your itinerary and the medicines you already take. For most travelers staying in the city they are not usually needed. Talk to a doctor first if you have had moderate or severe altitude sickness, high-altitude pulmonary or cerebral edema, or plan to sleep above 2,750 m (e.g., volcano huts)."></p>

    <h2 data-es="Calidad del aire y contingencia ambiental" data-en="Air quality and environmental alerts"></h2>
    <p data-es="La Ciudad de México tiene días con mala calidad del aire por contaminantes como el ozono y las partículas. La Secretaría del Medio Ambiente (SEDEMA) publica en <a href='https://aire.cdmx.gob.mx/default.php' target='_blank' rel='noopener'>aire.cdmx.gob.mx</a> el Índice AIRE Y SALUD actualizado de forma continua, el pronóstico y los avisos de contingencia ambiental." data-en="Mexico City has days with poor air quality due to pollutants such as ozone and particulate matter. The city's Environment Department (SEDEMA) publishes the continuously updated AIRE Y SALUD index, the forecast and environmental alerts (<em>contingencia ambiental</em>) at <a href='https://aire.cdmx.gob.mx/default.php' target='_blank' rel='noopener'>aire.cdmx.gob.mx</a> (in Spanish)."></p>
    <p data-es="Consulte las recomendaciones del índice antes de hacer ejercicio al aire libre, sobre todo si hay contingencia ambiental, y sígalas." data-en="Check the index's recommendations before exercising outdoors, especially during an environmental alert, and follow them."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions"></h2>
    <div class="faq-item">
      <h3 data-es="¿A qué altura está la Ciudad de México?" data-en="How high is Mexico City?"></h3>
      <p data-es="A unos 2,240 m (7,350 ft) sobre el nivel del mar en la zona central; algunas zonas del sur y del poniente están más altas. Algunas personas sanas notan molestias desde alrededor de 2,000 metros, aunque el mal agudo de montaña es más frecuente por encima de 2,500 metros." data-en="About 2,240 m (7,350 ft) above sea level in the central area; some southern and western areas are higher. Some healthy people notice symptoms from around 2,000 meters, although acute mountain sickness is more common above 2,500 meters."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuánto duran las molestias por la altitud?" data-en="How long do altitude symptoms last?"></h3>
      <p data-es="Si son leves y no sube a mayor altura, suelen mejorar en 12 a 48 horas. Si empeoran o aparece un signo de alarma, busque atención médica." data-en="If they are mild and you do not go higher, they usually improve within 12 to 48 hours. If they get worse or a warning sign appears, seek medical care."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Puedo hacer ejercicio en la Ciudad de México?" data-en="Can I exercise in Mexico City?"></h3>
      <p data-es="Sí, pero conviene mantener una actividad ligera las primeras 48 horas y revisar el Índice AIRE Y SALUD antes de ejercitarse al aire libre, sobre todo si hay contingencia ambiental." data-en="Yes, but it is best to keep activity light for the first 48 hours and check the AIRE Y SALUD index before exercising outdoors, especially during an environmental alert."></p>
    </div>

    <div class="emergency-note" data-es="<strong>Ante una emergencia, llame al 911</strong> o acuda a urgencias hospitalarias. Vea también <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias en la Ciudad de México</a>." data-en="<strong>In an emergency, call 911</strong> or go to a hospital emergency room. See also <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER in Mexico City</a>."></div>
