  <article class="prose">
    <h2 data-es="Honorarios en la Roma y la Condesa" data-en="Fees in Roma and Condesa" data-fr="Honoraires à Roma et Condesa"></h2>
    <p data-es="Las dos colonias están en la <strong>Zona <span data-tarifa='zona:Roma'></span></strong> de visitas a hotel y comparten tarifa de consulta a domicilio. El consultorio está en la Roma; no hay sede en la Condesa. Montos en pesos mexicanos, por consulta:" data-en="Both neighborhoods are in hotel visit <strong>Zone <span data-tarifa='zona:Roma'></span></strong> and share the same house call fee. The clinic is in Roma; there is no Condesa location. Amounts in Mexican pesos, per visit:" data-fr="Les deux quartiers se trouvent en <strong>zone <span data-tarifa='zona:Roma'></span></strong> pour les visites à l’hôtel et partagent le même tarif de consultation à domicile. Le cabinet est à Roma ; il n’y a pas de site à Condesa. Montants en pesos mexicains, par consultation :"></p>
    <table>
      <thead><tr>
        <th data-es="Servicio" data-en="Service" data-fr="Service"></th>
        <th style="text-align:right" data-es="Ordinario" data-en="Standard" data-fr="Ordinaire"></th>
        <th style="text-align:right" data-es="Especial" data-en="After-hours" data-fr="Horaire spécial"></th>
        <th style="text-align:right" data-es="Festivo" data-en="Holiday" data-fr="Jour férié"></th>
      </tr></thead>
      <tbody>
        <tr><td data-es="Visita en hotel" data-en="Hotel visit" data-fr="Visite à l’hôtel"></td><td class="price-col" data-tarifa="hotel:Roma:0"></td><td class="price-col" data-tarifa="hotel:Roma:1"></td><td class="price-col" data-tarifa="hotel:Roma:2"></td></tr>
        <tr><td data-es="Consulta a domicilio" data-en="House call" data-fr="Consultation à domicile"></td><td class="price-col" data-tarifa="domicilio:Condesa:0"></td><td class="price-col" data-tarifa="domicilio:Condesa:1"></td><td class="price-col" data-tarifa="domicilio:Condesa:2"></td></tr>
        <tr><td data-es="Consultorio Roma (con cita)" data-en="Roma clinic (by appointment)" data-fr="Cabinet de Roma (sur rendez-vous)"></td><td class="price-col" data-tarifa="consultorio:Roma"></td><td class="price-col">—</td><td class="price-col" data-es="Cerrado" data-en="Closed" data-fr="Fermé"></td></tr>
      </tbody>
    </table>
    <p data-es="La tarifa depende del horario y del día, y se confirma al solicitar la visita; en los festivos oficiales y tradicionales el consultorio no abre, y la visita a hotel o a domicilio se coordina solo por WhatsApp. Horarios ordinario, especial y festivo en la <a href='/#tarifas'>sección de tarifas</a>, con los mismos honorarios." data-en="The fee depends on the time and day, and is confirmed when you request the visit; the clinic is closed on official and traditional holidays, and hotel visits or house calls are arranged via WhatsApp only. Standard, after-hours and holiday times are in the <a href='/en/#tarifas'>fees section</a>, with the same fees." data-fr="Le tarif dépend de l’horaire et du jour, et il est confirmé lors de la demande de visite ; le cabinet est fermé les jours fériés officiels et traditionnels, et la visite à l’hôtel ou à domicile s’organise uniquement par WhatsApp. Horaires ordinaires, hors horaires et jours fériés dans la <a href='/fr/#tarifas'>section des tarifs</a>, avec les mêmes honoraires."></p>
    <p data-es="<strong>Anticipo y cancelación.</strong> La visita a hotel no requiere anticipo: se paga directamente al médico, en pesos mexicanos. La consulta a domicilio se solicita por WhatsApp y se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Condesa'></span>, el 50 % de la tarifa ordinaria. El resto, y en horario especial o festivo la diferencia, se paga al médico en la visita. Si cancela con 24 horas o más de anticipación, se le devuelve completo, siempre que la transferencia haya sido SPEI desde una cuenta bancaria (la app de su banco sí cuenta), no por Mercado Pago, PayPal u otras plataformas de pago; con menos de 24 horas, o si no está en el domicilio a la hora acordada, no se devuelve." data-en="<strong>Deposit and cancellation.</strong> Hotel visits need no deposit: they are paid directly to the doctor, in Mexican pesos. House calls are requested via WhatsApp and confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Condesa'></span>, 50% of the standard fee. The rest, and the difference for after-hours or holiday visits, is paid to the doctor at the visit. If you cancel at least 24 hours in advance, it is refunded in full, as long as it was a SPEI transfer from a bank account (your bank’s app is fine), not via Mercado Pago, PayPal or other payment platforms; with less than 24 hours’ notice, or if you are not at the address at the agreed time, it is not refunded." data-fr="<strong>Acompte et annulation.</strong> La visite à l’hôtel ne nécessite pas d’acompte : elle se paie directement au médecin, en pesos mexicains. La consultation à domicile se demande par WhatsApp et se confirme par un virement de <span data-tarifa='anticipo-domicilio:Condesa'></span>, soit 50 % du tarif ordinaire. Le solde, ainsi que la différence en cas de visite hors horaires ou un jour férié, se paie au médecin lors de la visite. Si vous annulez au moins 24 heures à l’avance, il vous est remboursé en totalité, à condition qu’il s’agisse d’un virement SPEI depuis un compte bancaire (l’application de votre banque est acceptée), et non via Mercado Pago, PayPal ou une autre plateforme de paiement ; à moins de 24 heures, ou si vous n’êtes pas à l’adresse à l’heure convenue, il n’est pas remboursé."></p>

    <h2 data-es="Si se hospeda en un departamento de renta temporal" data-en="If you are staying in a short-term rental" data-fr="Si vous logez dans un appartement en location de courte durée"></h2>
    <p data-es="Al escribir por WhatsApp, indique si está en un hotel, en un departamento de renta temporal o en una casa particular, y la dirección. Así se le confirma qué tarifa aplica antes de la visita. Tenga a la mano el nombre del edificio, el número de departamento y, si hay vigilancia en la entrada, avise que espera al médico." data-en="When you message on WhatsApp, say whether you are at a hotel, a short-term rental apartment or a private home, and give the address. That way the applicable fee is confirmed before the visit. Have the building name and apartment number ready and, if there is a security desk, let them know you are expecting the doctor." data-fr="Lorsque vous écrivez par WhatsApp, indiquez si vous êtes à l’hôtel, dans un appartement en location de courte durée ou dans une maison particulière, ainsi que l’adresse. Le tarif applicable vous est ainsi confirmé avant la visite. Ayez à portée de main le nom de l’immeuble et le numéro de l’appartement et, s’il y a un gardien à l’entrée, prévenez-le que vous attendez le médecin."></p>

    <h2 data-es="Cuánto tarda en llegar" data-en="How long it takes to arrive" data-fr="Délai d’arrivée"></h2>
    <p data-es="Sujeto a disponibilidad, el tiempo estimado de llegada es de <strong>unos 60 minutos</strong> a la Roma y <strong>unos 90 minutos</strong> a la Condesa, según el tráfico; puede ser menos. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada." data-en="Subject to availability, the estimated arrival time is <strong>about 60 minutes</strong> in Roma and <strong>about 90 minutes</strong> in Condesa, depending on traffic; it may be shorter. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time." data-fr="Sous réserve de disponibilité, le délai d’arrivée estimé est d’<strong>environ 60 minutes</strong> à Roma et d’<strong>environ 90 minutes</strong> à Condesa, selon la circulation ; il peut être moins long. Lors de la réservation, envoyez un WhatsApp au +52 595 109 3969 et une heure estimée vous sera confirmée."></p>

    <h2 data-es="Consultorio en la Roma" data-en="Clinic in Roma" data-fr="Cabinet à Roma"></h2>
    <p data-es="Con cita, de lunes a viernes por la tarde y los sábados por la mañana. El consultorio está en Briyam Coworking Médico, sede Roma Sur: <span data-sede='Roma'></span>. Si reserva en línea, su cita queda confirmada al pagar con tarjeta el total de la consulta (<span data-tarifa='consultorio:Roma'></span>); si usted cancela, ese pago no es reembolsable, pero puede reprogramar sin costo avisando con 24 horas o más. Si lo prefiere, agende por WhatsApp con un anticipo del 50 % (<span data-tarifa='anticipo:Roma'></span>) por transferencia; el resto se paga en el consultorio. Después de reservar, envíe un WhatsApp al +52 595 109 3969. Horario detallado y política de cancelación en la <a href='/#tarifas'>sección de tarifas</a>." data-en="By appointment on weekday evenings and Saturday mornings. The clinic is at Briyam Coworking Médico, Roma Sur location: <span data-sede='Roma'></span>. If you book online, your appointment is confirmed once you pay the full consultation fee by card (<span data-tarifa='consultorio:Roma'></span>); if you cancel, this payment is non-refundable, but you can reschedule free of charge with at least 24 hours’ notice. If you prefer, book on WhatsApp with a 50% deposit (<span data-tarifa='anticipo:Roma'></span>) by bank transfer; the rest is paid at the clinic. After booking, send a WhatsApp to +52 595 109 3969. Detailed hours and cancellation policy are in the <a href='/en/#tarifas'>fees section</a>." data-fr="Sur rendez-vous, du lundi au vendredi en fin de journée et le samedi matin. Le cabinet se trouve chez Briyam Coworking Médico, site Roma Sur : <span data-sede='Roma'></span>. Si vous réservez en ligne, votre rendez-vous est confirmé une fois la totalité de la consultation payée par carte (<span data-tarifa='consultorio:Roma'></span>) ; si vous annulez, ce paiement n’est pas remboursable, mais vous pouvez reporter le rendez-vous sans frais en prévenant au moins 24 heures à l’avance. Si vous préférez, réservez par WhatsApp avec un acompte de 50 % (<span data-tarifa='anticipo:Roma'></span>) par virement ; le solde se paie au cabinet. Après la réservation, envoyez un WhatsApp au +52 595 109 3969. Horaires détaillés et conditions d’annulation dans la <a href='/fr/#tarifas'>section des tarifs</a>."></p>

    <h2 data-es="Para viajeros" data-en="For travelers" data-fr="Pour les voyageurs"></h2>
    <p data-es="Si necesita un certificado médico para su aerolínea o un resumen clínico en inglés para su seguro, vea <a href='/certificados-y-viajeros/'>certificados y documentos para viajeros</a>. Para molestias que pueden presentarse al llegar a la ciudad, hay guías sobre la <a href='/guias/altitud-cdmx/'>altitud</a>, la <a href='/guias/diarrea-del-viajero/'>diarrea del viajero</a> y las <a href='/guias/farmacias-cdmx/'>farmacias en la CDMX</a>." data-en="If you need a medical certificate for your airline or an English-language clinical summary for your insurer, see <a href='/en/travel-medical-certificates/'>certificates and documents for travelers</a>. For problems that may come up after arriving in the city, there are guides on <a href='/en/guides/mexico-city-altitude/'>altitude</a>, <a href='/en/guides/travelers-diarrhea-mexico-city/'>traveler's diarrhea</a> and <a href='/en/guides/pharmacies-mexico-city/'>Mexico City pharmacies</a>." data-fr="Si vous avez besoin d’un certificat médical pour votre compagnie aérienne ou d’un résumé clinique en anglais pour votre assurance, consultez <a href='/fr/certificats-voyageurs/'>certificats et documents pour les voyageurs</a>. Pour les troubles qui peuvent survenir à l’arrivée dans la ville, il existe des guides sur l’<a href='/fr/guides/altitude-mexico/'>altitude</a>, la <a href='/fr/guides/diarrhee-du-voyageur-mexico/'>diarrhée du voyageur</a> et les <a href='/fr/guides/pharmacies-mexico/'>pharmacies à Mexico</a>."></p>
    <p data-es="Es medicina general ambulatoria para padecimientos leves; no sustituye a un hospital. Vea <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias</a>." data-en="This is outpatient general medicine for mild conditions; it does not replace a hospital. See <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER</a>." data-fr="Il s’agit de médecine générale ambulatoire pour des affections légères ; elle ne remplace pas un hôpital. Voir <a href='/fr/guides/urgences-mexico/'>quand aller aux urgences</a>."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="Me hospedo en un departamento de renta temporal en la Roma o la Condesa. ¿Qué tarifa aplica?" data-en="I'm staying in a short-term rental in Roma or Condesa. Which fee applies?" data-fr="Je loge dans un appartement en location de courte durée à Roma ou à Condesa. Quel tarif s’applique ?"></h3>
      <p data-es="Al escribir por WhatsApp al +52 595 109 3969, indique si está en un hotel, en un departamento de renta temporal o en una casa particular, y la dirección; así se le confirma qué tarifa aplica antes de la visita. Como referencia, en horario ordinario la visita en hotel cuesta desde <span data-tarifa='hotel:Roma:0'></span> MXN y la consulta a domicilio desde <span data-tarifa='domicilio:Condesa:0'></span> MXN." data-en="When you message on WhatsApp at +52 595 109 3969, say whether you are at a hotel, a short-term rental apartment or a private home, and give the address; you will be told which fee applies before the visit. For reference, at standard hours a hotel visit costs from <span data-tarifa='hotel:Roma:0'></span> MXN and a house call from <span data-tarifa='domicilio:Condesa:0'></span> MXN." data-fr="Lorsque vous écrivez par WhatsApp au +52 595 109 3969, indiquez si vous êtes à l’hôtel, dans un appartement en location de courte durée ou dans une maison particulière, ainsi que l’adresse ; le tarif applicable vous est ainsi confirmé avant la visite. À titre indicatif, en horaire ordinaire, la visite à l’hôtel coûte à partir de <span data-tarifa='hotel:Roma:0'></span> MXN et la consultation à domicile à partir de <span data-tarifa='domicilio:Condesa:0'></span> MXN."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Qué datos debo tener listos para que el médico llegue al departamento?" data-en="What details should I have ready so the doctor can reach the apartment?" data-fr="Quelles informations dois-je avoir à portée de main pour que le médecin puisse accéder à l’appartement ?"></h3>
      <p data-es="El nombre del edificio, el número de departamento y la dirección completa. Si hay vigilancia en la entrada, avise que espera al médico. El tiempo estimado de llegada es de unos 60 minutos a la Roma y unos 90 minutos a la Condesa, según el tráfico; puede ser menos. Si aplica la tarifa a domicilio, la visita se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Condesa'></span> MXN, el 50 % de la tarifa ordinaria." data-en="The building name, the apartment number and the full address. If there is a security desk at the entrance, let them know you are expecting the doctor. Estimated arrival is about 60 minutes in Roma and about 90 minutes in Condesa, depending on traffic; it may be shorter. If the house-call fee applies, the visit is confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Condesa'></span> MXN, 50% of the standard fee." data-fr="Le nom de l’immeuble, le numéro de l’appartement et l’adresse complète. S’il y a un gardien à l’entrée, prévenez-le que vous attendez le médecin. Le délai d’arrivée estimé est d’environ 60 minutes à Roma et d’environ 90 minutes à Condesa, selon la circulation ; il peut être moins long. Si le tarif à domicile s’applique, la visite est confirmée par un virement de <span data-tarifa='anticipo-domicilio:Condesa'></span> MXN, soit 50 % du tarif ordinaire."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Hay consultorio en la Condesa?" data-en="Is there a clinic in Condesa?" data-fr="Y a-t-il un cabinet à Condesa ?"></h3>
