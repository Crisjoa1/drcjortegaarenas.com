    <h2 data-es="Honorarios en Polanco" data-en="Fees in Polanco"></h2>
    <p data-es="Para visitas a hotel, Polanco está en la <strong>Zona <span data-tarifa='zona:Polanco'></span></strong>. A domicilio, Polanco comparte tarifa con Reforma. Montos en pesos mexicanos, por consulta:" data-en="For hotel visits, Polanco is in <strong>Zone <span data-tarifa='zona:Polanco'></span></strong>. For house calls, Polanco shares a fee with Reforma. Amounts in Mexican pesos, per visit:"></p>

    <p data-es="La tarifa depende del horario y del día, y se confirma al solicitar la visita; los festivos se coordinan solo por WhatsApp. Las visitas a hotel y a domicilio no requieren anticipo: se pagan directamente al médico, en pesos mexicanos. Horarios ordinario, especial y festivo en la <a href='/#tarifas'>sección de tarifas</a>, con los mismos honorarios." data-en="The fee depends on the time and day, and is confirmed when you request the visit; holidays are arranged via WhatsApp only. Hotel visits and house calls need no deposit: they are paid directly to the doctor, in Mexican pesos. Standard, after-hours and holiday times are in the <a href='/en/#tarifas'>fees section</a>, with the same fees."></p>

    <h2 data-es="Cuánto tarda en llegar" data-en="How long it takes to arrive"></h2>
    <p data-es="Sujeto a disponibilidad, el tiempo estimado de llegada a Polanco es de <strong>30 a 45 minutos</strong>, según el tráfico. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada." data-en="Subject to availability, the estimated arrival time in Polanco is <strong>30–45 minutes</strong>, depending on traffic. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time."></p>
    <p data-es="Si está en un hotel, avise en recepción que espera al médico y comparta su número de habitación. Si es la primera consulta, puede llenar antes los <a href='/formularios/'>formularios</a> para ahorrar tiempo." data-en="If you are at a hotel, let the front desk know you are expecting the doctor and share your room number. For a first visit, you can fill in the <a href='/formularios/'>forms</a> beforehand to save time."></p>

    <h2 data-es="Consultorio en Polanco" data-en="Clinic in Polanco"></h2>
    <p data-es="Con cita, de lunes a viernes por la tarde y los sábados por la mañana. El consultorio está en Briyam Coworking Médico, sede Masaryk: <span data-sede='Polanco'></span>. Su cita queda confirmada al pagar en línea, con tarjeta, el anticipo del 50 % (<span data-tarifa='anticipo:Polanco'></span> de <span data-tarifa='consultorio:Polanco'></span>); el resto se paga en el consultorio. Horario detallado y política de cancelación en la <a href='/#tarifas'>sección de tarifas</a>." data-en="By appointment on weekday evenings and Saturday mornings. The clinic is at Briyam Coworking Médico, Masaryk location: <span data-sede='Polanco'></span>. Your appointment is confirmed once you pay the 50% deposit online by card (<span data-tarifa='anticipo:Polanco'></span> of <span data-tarifa='consultorio:Polanco'></span>); the rest is paid at the clinic. Detailed hours and cancellation policy are in the <a href='/en/#tarifas'>fees section</a>."></p>

    <h2 data-es="Qué puede atender el médico y qué no" data-en="What the doctor can and cannot help with"></h2>
    <p data-es="Es medicina general ambulatoria: valoración y tratamiento de padecimientos leves, como infecciones respiratorias sin dificultad para respirar, gastroenteritis sin signos de alarma, heridas menores o molestias leves por la <a href='/guias/altitud-cdmx/'>altitud</a>. No sustituye a un hospital: si se necesitan estudios de imagen, oxígeno, cirugía u hospitalización, el médico le indicará acudir a urgencias. Vea <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias</a>." data-en="This is outpatient general medicine: assessment and treatment of mild conditions, such as respiratory infections without trouble breathing, gastroenteritis without warning signs, minor cuts or mild symptoms from the <a href='/en/guides/mexico-city-altitude/'>altitude</a>. It does not replace a hospital: if imaging, oxygen, surgery or a hospital stay may be needed, the doctor will tell you to go to the ER. See <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER</a>."></p>

    <h2 data-es="Pago y documentos para su seguro" data-en="Payment and insurance documents"></h2>
    <p data-es="Las visitas a hotel y a domicilio se pagan directamente al médico en pesos mexicanos: tarjeta, transferencia o efectivo. Cuando hay tratamiento indicado, recibe receta por escrito; con pago con tarjeta puede pedir factura (CFDI) o comprobante para reembolso. La aceptación del reclamo depende de su póliza. Si necesita medicamentos, vea la <a href='/guias/farmacias-cdmx/'>guía de farmacias en la CDMX</a>." data-en="Hotel visits and house calls are paid directly to the doctor in Mexican pesos: card, bank transfer or cash. When treatment is indicated, you receive a written prescription; if you pay by card, you can request an official invoice (CFDI) or a receipt for reimbursement. Whether a claim is accepted depends on your policy. If you need medicines, see the <a href='/en/guides/pharmacies-mexico-city/'>Mexico City pharmacy guide</a>."></p>
