    <h2 data-es="Resumen Clínico del Viajero (en inglés)" data-en="Traveler Clinical Summary (in English)" data-fr="Résumé clinique du voyageur (rédigé en anglais)"></h2>
    <p data-es="Reporte en inglés técnico con padecimiento actual, diagnósticos, tratamiento, evolución, pronóstico y resultados de estudios (incluidas pruebas rápidas), el contenido que la NOM-004-SSA3-2012 pide para un resumen clínico.&lt;sup&gt;2&lt;/sup&gt; Una prueba rápida negativa no siempre descarta la infección; por ejemplo, las de influenza tienen sensibilidad limitada.&lt;sup&gt;3&lt;/sup&gt; Puede presentarse ante migración, aerolíneas o aseguradoras; su aceptación depende de cada aerolínea o autoridad." data-en="A report in technical English with the current illness, diagnoses, treatment, course, prognosis and test results (including rapid tests), the content that the Mexican standard NOM-004-SSA3-2012 requires for a clinical summary.&lt;sup&gt;2&lt;/sup&gt; A negative rapid test does not always rule out infection; for example, rapid flu tests have limited sensitivity.&lt;sup&gt;3&lt;/sup&gt; It can be presented to immigration, airlines or insurers; acceptance depends on each airline or authority." data-fr="Rapport rédigé en anglais technique, avec la maladie actuelle, les diagnostics, le traitement, l’évolution, le pronostic et les résultats d’examens (y compris les tests rapides), soit le contenu que la norme mexicaine NOM-004-SSA3-2012 exige pour un résumé clinique.&lt;sup&gt;2&lt;/sup&gt; Un test rapide négatif n’exclut pas toujours l’infection ; par exemple, les tests rapides de la grippe ont une sensibilité limitée.&lt;sup&gt;3&lt;/sup&gt; Il peut être présenté aux services d’immigration, aux compagnies aériennes ou aux assureurs ; son acceptation dépend de chaque compagnie ou autorité."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="¿Cuánto cuesta un certificado médico en CDMX?" data-en="How much is a medical certificate in Mexico City?" data-fr="Combien coûte un certificat médical à Mexico ?"></h3>
      <p data-es="El certificado médico digital cuesta $500 MXN y se valida por videollamada. El presencial cuesta $800 MXN más el honorario de la consulta o la visita." data-en="The digital medical certificate costs $500 MXN and is validated by video call. The in-person certificate costs $800 MXN plus the consultation or visit fee." data-fr="Le certificat médical numérique coûte $500 MXN et il est validé par appel vidéo. Le certificat en présentiel coûte $800 MXN en plus des honoraires de la consultation ou de la visite."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Siempre se emite el certificado de aptitud para viajar?" data-en="Is a fit-to-fly certificate always issued?" data-fr="Le certificat d’aptitude au voyage est-il toujours délivré ?"></h3>
      <p data-es="No. Es un certificado médico y se emite solo si la valoración clínica lo sustenta." data-en="No. It is a medical certificate and is issued only if the clinical assessment supports it." data-fr="Non. Il s’agit d’un certificat médical, qui n’est délivré que si l’évaluation clinique le justifie."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Qué incluye el Paquete Viajero?" data-en="What does the Traveler Package include?" data-fr="Que comprend le Forfait Voyageur ?"></h3>
      <p data-es="La consulta, el Resumen Clínico del Viajero impreso en inglés y, si la valoración lo sustenta, un certificado médico presencial. Cuesta $2,200 MXN en el consultorio de Del Valle y $3,500 MXN en visita a hotel en Zona A en horario ordinario. Para otras sedes, zonas u horarios, se cotiza por WhatsApp." data-en="The consultation, the printed Traveler Clinical Summary in English and, if the assessment supports it, an in-person medical certificate. It costs $2,200 MXN at the Del Valle clinic and $3,500 MXN for a hotel visit in Zone A during standard hours. Other locations, zones or hours are quoted on WhatsApp." data-fr="La consultation, le Résumé clinique du voyageur imprimé, rédigé en anglais, et, si l’évaluation le justifie, un certificat médical en présentiel. Il coûte $2,200 MXN au cabinet Del Valle et $3,500 MXN pour une visite à l’hôtel en zone A, aux horaires normaux. Pour les autres lieux, zones ou horaires, un devis est établi sur WhatsApp."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Mi seguro de viaje me reembolsará la consulta?" data-en="Will my travel insurance reimburse the visit?" data-fr="Mon assurance voyage remboursera-t-elle la consultation ?"></h3>
      <p data-es="Depende de su póliza. Para su reclamo puede usar la receta y, a solicitud y con costo adicional, el Resumen Clínico del Viajero en inglés." data-en="It depends on your policy. For your claim you can use the prescription and, on request for an additional fee, the English-language Travel Clinical Summary." data-fr="Cela dépend de votre contrat. Pour votre demande de remboursement, vous pouvez utiliser l’ordonnance et, sur demande et moyennant un supplément, le Résumé clinique du voyageur, rédigé en anglais."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuándo recibo el Resumen Clínico del Viajero?" data-en="When do I receive the Traveler Clinical Summary?" data-fr="Quand vais-je recevoir le Résumé clinique du voyageur ?"></h3>
      <p data-es="La versión digital se envía por correo electrónico o en PDF. La versión física se entrega después de la consulta, porque requiere impresión." data-en="The digital version is sent by email or as a PDF. The printed version is delivered after the consultation, because it has to be printed." data-fr="La version numérique est envoyée par e-mail ou en PDF. La version imprimée est remise après la consultation, car elle doit être imprimée."></p>
    </div>
