    <p data-es="<strong>Anticipo y cancelación.</strong> La visita a hotel no requiere anticipo: se paga directamente al médico, en pesos mexicanos. La consulta a domicilio se solicita por WhatsApp y se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Del Valle'></span>, el 50 % de la tarifa ordinaria. El resto, y en horario especial o festivo la diferencia, se paga al médico en la visita. Si cancela con al menos 3 horas de anticipación, se reembolsa el anticipo; con menos de 3 horas, o si no está en el domicilio a la hora acordada, no es reembolsable." data-en="<strong>Deposit and cancellation.</strong> Hotel visits need no deposit: they are paid directly to the doctor, in Mexican pesos. House calls are requested via WhatsApp and confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Del Valle'></span>, 50% of the standard fee. The rest, and the difference for after-hours or holiday visits, is paid to the doctor at the visit. If you cancel at least 3 hours in advance, the deposit is refunded; with less than 3 hours' notice, or if you are not at the address at the agreed time, it is non-refundable." data-fr="<strong>Acompte et annulation.</strong> La visite à l’hôtel ne nécessite pas d’acompte : elle se paie directement au médecin, en pesos mexicains. La consultation à domicile se demande par WhatsApp et se confirme par un virement de <span data-tarifa='anticipo-domicilio:Del Valle'></span>, soit 50 % du tarif ordinaire. Le solde, ainsi que la différence en cas de visite hors horaires ou un jour férié, se paie au médecin lors de la visite. Si vous annulez au moins 3 heures à l’avance, l’acompte est remboursé ; à moins de 3 heures, ou si vous n’êtes pas à l’adresse à l’heure convenue, il n’est pas remboursable."></p>

    <p data-es="Por <span data-tarifa='paquete:Del Valle'></span> MXN incluye la consulta, el Resumen Clínico del Viajero impreso en inglés y, si la valoración clínica lo sustenta, un certificado médico presencial. Si la valoración no sustenta el certificado, solo se cobran la consulta y el resumen: <span data-tarifa='paquete-sin-certificado:Del Valle'></span> MXN. Precio vigente durante 2026. Detalles en <a href='/certificados-y-viajeros/'>certificados y documentos para viajeros</a>." data-en="For <span data-tarifa='paquete:Del Valle'></span> MXN, it includes the consultation, the printed Travel Clinical Summary in English and, if the clinical assessment supports it, an in-person medical certificate. If the assessment does not support a certificate, only the consultation and the summary are charged: <span data-tarifa='paquete-sin-certificado:Del Valle'></span> MXN. Price valid through 2026. Details in <a href='/en/travel-medical-certificates/'>certificates and documents for travelers</a>." data-fr="Pour <span data-tarifa='paquete:Del Valle'></span> MXN, il comprend la consultation, le Résumé clinique du voyageur imprimé en anglais et, si l’évaluation clinique le justifie, un certificat médical délivré en présentiel. Si l’évaluation ne justifie pas le certificat, seuls la consultation et le résumé sont facturés : <span data-tarifa='paquete-sin-certificado:Del Valle'></span> MXN. Prix valable jusqu’à fin 2026. Détails dans <a href='/fr/certificats-voyageurs/'>certificats et documents pour les voyageurs</a>."></p>

    <h2 data-es="Consultorio en la Del Valle" data-en="Clinic in Del Valle" data-fr="Cabinet à Del Valle"></h2>
    <p data-es="Con cita, de lunes a viernes por la tarde y los sábados por la mañana. El consultorio está en Briyam Coworking Médico, sede Florida del Valle: <span data-sede='Del Valle'></span>. Su cita queda confirmada al pagar en línea, con tarjeta, el anticipo del 50 % (<span data-tarifa='anticipo:Del Valle'></span> de <span data-tarifa='consultorio:Del Valle'></span>); el resto se paga en el consultorio. Horario detallado y política de cancelación en la <a href='/#tarifas'>sección de tarifas</a>. Si es su primera consulta, antes de su primera consulta debe llenar los dos <a href='/#formularios-previos'>formularios</a> (consentimiento informado y cuestionario de salud)." data-en="By appointment on weekday evenings and Saturday mornings. The clinic is at Briyam Coworking Médico, Florida del Valle location: <span data-sede='Del Valle'></span>. Your appointment is confirmed once you pay the 50% deposit online by card (<span data-tarifa='anticipo:Del Valle'></span> of <span data-tarifa='consultorio:Del Valle'></span>); the rest is paid at the clinic. Detailed hours and cancellation policy are in the <a href='/en/#tarifas'>fees section</a>. Before your first visit, you need to fill in the two <a href='/en/#formularios-previos'>forms</a> (informed consent and health questionnaire)." data-fr="Sur rendez-vous, du lundi au vendredi en fin de journée et le samedi matin. Le cabinet se trouve chez Briyam Coworking Médico, site Florida del Valle : <span data-sede='Del Valle'></span>. Votre rendez-vous est confirmé une fois l’acompte de 50 % payé en ligne par carte (<span data-tarifa='anticipo:Del Valle'></span> sur <span data-tarifa='consultorio:Del Valle'></span>) ; le solde se paie au cabinet. Horaires détaillés et conditions d’annulation dans la <a href='/fr/#tarifas'>section des tarifs</a>. Avant votre première consultation, vous devez remplir les deux <a href='/fr/#formularios-previos'>formulaires</a> (consentement éclairé et questionnaire de santé)."></p>

    <p data-es="Para visitas a domicilio u hotel en la Del Valle, sujetas a disponibilidad, el tiempo estimado de llegada es de <strong>unos 45 minutos</strong>, según el tráfico; puede ser menos. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada." data-en="For house calls or hotel visits in Del Valle, subject to availability, the estimated arrival time is <strong>about 45 minutes</strong>, depending on traffic; it may be shorter. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time." data-fr="Pour les consultations à domicile ou à l’hôtel à Del Valle, sous réserve de disponibilité, le délai d’arrivée estimé est d’<strong>environ 45 minutes</strong>, selon la circulation ; il peut être moins long. Lors de la réservation, envoyez un WhatsApp au +52 595 109 3969 et une heure estimée vous sera confirmée."></p>
    <p data-es="Es medicina general ambulatoria para padecimientos leves; no sustituye a un hospital. Vea <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias</a> y la <a href='/guias/farmacias-cdmx/'>guía de farmacias en la CDMX</a>." data-en="This is outpatient general medicine for mild conditions; it does not replace a hospital. See <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER</a> and the <a href='/en/guides/pharmacies-mexico-city/'>Mexico City pharmacy guide</a>." data-fr="Il s’agit de médecine générale ambulatoire pour des affections légères ; elle ne remplace pas un hôpital. Voir <a href='/fr/guides/urgences-mexico/'>quand aller aux urgences</a> et le <a href='/fr/guides/pharmacies-mexico/'>guide des pharmacies à Mexico</a>."></p>
