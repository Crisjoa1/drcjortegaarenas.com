  <h1 class="page-h1" data-es="Farmacias en la <em>Ciudad de México</em>" data-en="Pharmacies in <em>Mexico City</em>"></h1>
  <p class="page-lead" data-es="En México, la ley clasifica los medicamentos según cómo pueden venderse: algunos sin receta y otros solo con receta médica. Los antibióticos se venden solo con receta médica. Esta guía explica qué le pedirán en la farmacia, cómo encontrar una abierta las 24 horas y qué tener en cuenta si viene del extranjero." data-en="In Mexico, the law classifies medicines by how they may be sold: some without a prescription and others only with one. Antibiotics are sold only with a prescription. This guide explains what a pharmacy will ask for, how to find one open 24 hours and what to keep in mind if you are visiting from abroad."></p>
</header>

<div class="sep"></div>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Qué medicamentos requieren receta" data-en="Which medicines need a prescription"></h2>
    <p data-es="El artículo 226 de la Ley General de Salud ordena los medicamentos en seis fracciones (grupos) para su venta y suministro al público:" data-en="Article 226 of Mexico's General Health Law sorts medicines into six groups for sale to the public:"></p>
    <ul>
      <li data-es="<strong>Fracciones I a III, medicamentos controlados:</strong> necesitan receta especial o una receta que la farmacia registra y retiene. Incluyen estupefacientes y psicotrópicos." data-en="<strong>Groups I to III, controlled medicines:</strong> they need a special prescription or one that the pharmacy records and keeps. They include narcotics and psychotropic drugs."></li>
      <li data-es="<strong>Fracción IV, con receta médica:</strong> pueden resurtirse tantas veces como lo indique el médico. El acuerdo de antibióticos (vea abajo) se fundamenta en esta fracción." data-en="<strong>Group IV (fraction IV), prescription only:</strong> they may be refilled as many times as the doctor indicates. The antibiotics agreement (see below) is based on this group."></li>
      <li data-es="<strong>Fracción V, sin receta, solo en farmacias.</strong>" data-en="<strong>Group V, no prescription, sold in pharmacies only.</strong>"></li>
      <li data-es="<strong>Fracción VI, sin receta,</strong> que también pueden venderse en comercios que no son farmacias." data-en="<strong>Group VI, no prescription,</strong> which may also be sold in shops other than pharmacies."></li>
    </ul>
    <p data-es="La misma ley prohíbe vender medicamentos en puestos semifijos o ambulantes." data-en="The same law prohibits selling medicines from street stalls or by street vendors."></p>

    <h2 data-es="Antibióticos: solo con receta" data-en="Antibiotics: prescription only"></h2>
    <p data-es="Desde 2010, un acuerdo de la Secretaría de Salud establece que los antibióticos se venden solo al presentar la receta médica. En cada venta, la farmacia sella la receta con la cantidad surtida y la fecha, y la retiene cuando se agota la cantidad recetada. Solo la surte dentro del tiempo que dura el tratamiento indicado. El acuerdo aplica a los antibióticos incluidos en la lista que publica COFEPRIS." data-en="Since 2010, a Ministry of Health agreement has required that antibiotics be sold only on presentation of a medical prescription. At each sale, the pharmacy stamps the prescription with the quantity dispensed and the date, and keeps it once the prescribed amount has been used up. It only fills it within the length of the prescribed treatment. The agreement covers the antibiotics on the list published by COFEPRIS."></p>
    <p data-es="Si cree que necesita un antibiótico, consulte primero a un médico: muchas infecciones leves no lo requieren, y tomarlo sin indicación también puede tener efectos adversos." data-en="If you think you need an antibiotic, see a doctor first: many mild infections do not need one, and taking one when it is not medically indicated can also cause side effects."></p>

    <h2 data-es="Qué debe tener una receta válida" data-en="What a valid prescription must include"></h2>
    <p data-es="Según el Reglamento de Insumos para la Salud, la receta debe llevar impresos el nombre y el domicilio completos y el número de cédula profesional de quien la expide, además de la fecha y la firma autógrafa. También debe indicar la dosis, la presentación, la vía de administración, la frecuencia y la duración del tratamiento." data-en="Under the Regulations on Health Supplies, a prescription must show the prescriber's full printed name and address and their professional license (cédula profesional) number, plus the date and a handwritten signature. It must also state the dose, the presentation, the route, how often to take it and how long the treatment lasts."></p>

    <h2 data-es="Si viene del extranjero" data-en="If you are visiting from abroad"></h2>
    <ul>
      <li data-es="<strong>Recetas de otro país:</strong> el gobierno británico advierte que las recetas emitidas fuera de México deben traducirse al español y, aun traducidas, una farmacia puede no aceptarlas. Si necesita un medicamento que requiere receta, un médico en México puede valorarlo y, si hay un tratamiento indicado, extenderle una receta mexicana." data-en="<strong>Prescriptions from another country:</strong> the UK government advises that prescriptions issued outside Mexico must be translated into Spanish, and even then a pharmacy may not accept them. If you need a prescription medicine, a doctor in Mexico can assess you and, if treatment is indicated, issue a Mexican prescription."></li>
      <li data-es="<strong>Nombres distintos:</strong> según los CDC, el mismo medicamento puede tener otro nombre comercial en México. Lleve anotado el nombre de la sustancia activa y la dosis, y muéstrelo al médico o al farmacéutico." data-en="<strong>Different names:</strong> according to the CDC, the same medicine may have a different brand name in Mexico. Keep a note of the active ingredient and the dose, and show it to the doctor or pharmacist."></li>
      <li data-es="<strong>Sus medicamentos de uso personal:</strong> la Agencia Nacional de Aduanas de México los permite en el equipaje; si son psicotrópicos, debe mostrar la receta médica. Los CDC recomiendan llevarlos en su envase original." data-en="<strong>Your own medicines:</strong> Mexico's National Customs Agency (ANAM) allows medicines for personal use in your luggage; for psychotropic drugs, you must show the prescription. The CDC recommends carrying them in their original containers."></li>
    </ul>

    <h2 data-es="Farmacias abiertas las 24 horas" data-en="Pharmacies open 24 hours"></h2>
    <p data-es="Según el gobierno británico, muchas farmacias en las grandes ciudades de México dan servicio las 24 horas. Esta guía no recomienda ninguna en particular. Para encontrar una cercana, pregunte en la recepción de su hotel o busque &quot;farmacia 24 horas&quot; en un mapa, y llame antes de ir para confirmar el horario." data-en="According to the UK government, many pharmacies in large Mexican cities are open 24 hours. This guide does not recommend any particular one. To find one nearby, ask your hotel front desk or search for &quot;farmacia 24 horas&quot; on a map, and call ahead to confirm the hours."></p>
    <p data-es="COFEPRIS recomienda adquirir medicamentos en lugares formalmente establecidos, que cuenten con licencia sanitaria, aviso de funcionamiento y documentación de la legal adquisición de los productos, y advierte sobre los riesgos de comprarlos en sitios web, como plataformas digitales y redes sociales. También publica las <a href='https://www.gob.mx/cofepris/documentos/alertas-sanitarias-de-medicamentos' target='_blank' rel='noopener'>alertas sanitarias de medicamentos</a>. Los CDC aconsejan no comprar en mercados, con vendedores ambulantes ni en farmacias de aspecto dudoso, y pedir comprobante de compra. Revise que esté en su empaque original y la fecha de caducidad." data-en="COFEPRIS, Mexico's health regulator, recommends buying medicines from formally established businesses with a health license, an operating notice and documentation of the legal acquisition of the products, and warns about the risks of buying them on websites, including digital platforms and social media. It also publishes <a href='https://www.gob.mx/cofepris/documentos/alertas-sanitarias-de-medicamentos' target='_blank' rel='noopener'>medicine safety alerts</a>. The CDC advises against buying from open markets, street vendors or suspicious-looking pharmacies, and recommends asking for a receipt. Check that it is in its original packaging and look at the expiry date."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions"></h2>
    <div class="faq-item">
      <h3 data-es="¿Puedo comprar antibióticos sin receta en México?" data-en="Can I buy antibiotics without a prescription in Mexico?"></h3>
      <p data-es="No. Desde 2010, los antibióticos se venden solo al presentar la receta médica, que la farmacia sella en cada venta y retiene cuando se agota la cantidad recetada." data-en="No. Since 2010, antibiotics are sold only on presentation of a medical prescription, which the pharmacy stamps at each sale and keeps once the prescribed amount has been used up."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Me sirve la receta de mi país?" data-en="Will my prescription from home work?"></h3>
      <p data-es="Puede que no. Según el gobierno británico, las recetas emitidas fuera de México deben traducirse al español, y la farmacia puede no aceptarlas. En una consulta en México, el médico valora su caso y, si hay un tratamiento indicado, puede extenderle una receta con cédula profesional mexicana." data-en="It may not. According to the UK government, prescriptions issued outside Mexico must be translated into Spanish, and the pharmacy may not accept them. At a medical visit in Mexico, the doctor assesses your case and, if treatment is indicated, can issue a prescription with a Mexican professional license number."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cómo encuentro una farmacia abierta de noche?" data-en="How do I find a pharmacy open at night?"></h3>
      <p data-es="Según el gobierno británico, muchas farmacias en las grandes ciudades de México dan servicio las 24 horas. Pregunte en la recepción de su hotel o busque en un mapa, y llame antes de ir para confirmar que está abierta." data-en="According to the UK government, many pharmacies in large Mexican cities are open 24 hours. Ask your hotel front desk or search on a map, and call ahead to confirm it is open."></p>
    </div>

    <div class="emergency-note" data-es="<strong>Ante una emergencia, llame al 911</strong> o acuda a urgencias hospitalarias. Vea también <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias en la Ciudad de México</a>." data-en="<strong>In an emergency, call 911</strong> or go to a hospital emergency room. See also <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER in Mexico City</a>."></div>
