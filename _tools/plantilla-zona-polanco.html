  <p class="page-lead" data-es="Consulta médica en español o inglés para huéspedes de hotel, residentes y personas que trabajan en Polanco y Reforma. Visita en su habitación desde <span data-tarifa='hotel:Polanco:0'></span> MXN (Zona <span data-tarifa='zona:Polanco'></span>, horario ordinario), consultorio en Polanco con cita por <span data-tarifa='consultorio:Polanco'></span> MXN y consulta a domicilio desde <span data-tarifa='domicilio:Polanco:0'></span> MXN. Llegada estimada: 60 a 90 minutos, según el tráfico; puede ser menos." data-en="Medical visits in English or Spanish for hotel guests, residents and people working in Polanco and along Reforma. Hotel room visits from <span data-tarifa='hotel:Polanco:0'></span> MXN (Zone <span data-tarifa='zona:Polanco'></span>, standard hours), a clinic in Polanco by appointment for <span data-tarifa='consultorio:Polanco'></span> MXN, and house calls from <span data-tarifa='domicilio:Polanco:0'></span> MXN. Estimated arrival: 60–90 minutes, depending on traffic; it may be shorter." data-fr="Consultation médicale en espagnol ou en anglais pour les clients d’hôtel, les résidents et les personnes qui travaillent à Polanco et sur Reforma. Visite dans votre chambre à partir de <span data-tarifa='hotel:Polanco:0'></span> MXN (zone <span data-tarifa='zona:Polanco'></span>, horaire ordinaire), cabinet à Polanco sur rendez-vous pour <span data-tarifa='consultorio:Polanco'></span> MXN et consultation à domicile à partir de <span data-tarifa='domicilio:Polanco:0'></span> MXN. Arrivée estimée : 60 à 90 minutes, selon la circulation ; le délai peut être moins long."></p>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Honorarios en Polanco" data-en="Fees in Polanco" data-fr="Honoraires à Polanco"></h2>
    <p data-es="Para visitas a hotel, Polanco está en la <strong>Zona <span data-tarifa='zona:Polanco'></span></strong>. A domicilio, Polanco comparte tarifa con Reforma. Montos en pesos mexicanos, por consulta:" data-en="For hotel visits, Polanco is in <strong>Zone <span data-tarifa='zona:Polanco'></span></strong>. For house calls, Polanco shares a fee with Reforma. Amounts in Mexican pesos, per visit:" data-fr="Pour les visites à l’hôtel, Polanco se trouve en <strong>zone <span data-tarifa='zona:Polanco'></span></strong>. À domicile, Polanco partage le même tarif que Reforma. Montants en pesos mexicains, par consultation :"></p>
    <table>
      <thead><tr>
        <th data-es="Servicio" data-en="Service" data-fr="Service"></th>
        <th style="text-align:right" data-es="Ordinario" data-en="Standard" data-fr="Ordinaire"></th>
        <th style="text-align:right" data-es="Especial" data-en="After-hours" data-fr="Horaire spécial"></th>
        <th style="text-align:right" data-es="Festivo" data-en="Holiday" data-fr="Jour férié"></th>
      </tr></thead>
      <tbody>
        <tr><td data-es="Visita en hotel" data-en="Hotel visit" data-fr="Visite à l’hôtel"></td><td class="price-col" data-tarifa="hotel:Polanco:0"></td><td class="price-col" data-tarifa="hotel:Polanco:1"></td><td class="price-col" data-tarifa="hotel:Polanco:2"></td></tr>
        <tr><td data-es="Consulta a domicilio" data-en="House call" data-fr="Consultation à domicile"></td><td class="price-col" data-tarifa="domicilio:Polanco:0"></td><td class="price-col" data-tarifa="domicilio:Polanco:1"></td><td class="price-col" data-tarifa="domicilio:Polanco:2"></td></tr>
        <tr><td data-es="Consultorio Polanco (con cita)" data-en="Polanco clinic (by appointment)" data-fr="Cabinet de Polanco (sur rendez-vous)"></td><td class="price-col" data-tarifa="consultorio:Polanco"></td><td class="price-col">—</td><td class="price-col" data-tarifa="consultorio:Días Festivos"></td></tr>
      </tbody>
    </table>
    <p data-es="La tarifa depende del horario y del día, y se confirma al solicitar la visita; los festivos se coordinan solo por WhatsApp. Horarios ordinario, especial y festivo en la <a href='/#tarifas'>sección de tarifas</a>, con los mismos honorarios." data-en="The fee depends on the time and day, and is confirmed when you request the visit; holidays are arranged via WhatsApp only. Standard, after-hours and holiday times are in the <a href='/en/#tarifas'>fees section</a>, with the same fees." data-fr="Le tarif dépend de l’horaire et du jour, et il est confirmé lors de la demande de visite ; les jours fériés s’organisent uniquement par WhatsApp. Horaires ordinaires, hors horaires et jours fériés dans la <a href='/fr/#tarifas'>section des tarifs</a>, avec les mêmes honoraires."></p>
    <p data-es="<strong>Anticipo y cancelación.</strong> La visita a hotel no requiere anticipo: se paga directamente al médico, en pesos mexicanos. La consulta a domicilio se solicita por WhatsApp y se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Polanco'></span>, el 50 % de la tarifa ordinaria. El resto, y en horario especial o festivo la diferencia, se paga al médico en la visita. Si cancela con al menos 3 horas de anticipación, se reembolsa el anticipo; con menos de 3 horas, o si no está en el domicilio a la hora acordada, no es reembolsable." data-en="<strong>Deposit and cancellation.</strong> Hotel visits need no deposit: they are paid directly to the doctor, in Mexican pesos. House calls are requested via WhatsApp and confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Polanco'></span>, 50% of the standard fee. The rest, and the difference for after-hours or holiday visits, is paid to the doctor at the visit. If you cancel at least 3 hours in advance, the deposit is refunded; with less than 3 hours' notice, or if you are not at the address at the agreed time, it is non-refundable." data-fr="<strong>Acompte et annulation.</strong> La visite à l’hôtel ne nécessite pas d’acompte : elle se paie directement au médecin, en pesos mexicains. La consultation à domicile se demande par WhatsApp et se confirme par un virement de <span data-tarifa='anticipo-domicilio:Polanco'></span>, soit 50 % du tarif ordinaire. Le solde, ainsi que la différence en cas de visite hors horaires ou un jour férié, se paie au médecin lors de la visite. Si vous annulez au moins 3 heures à l’avance, l’acompte est remboursé ; à moins de 3 heures, ou si vous n’êtes pas à l’adresse à l’heure convenue, il n’est pas remboursable."></p>

    <h2 data-es="Cuánto tarda en llegar" data-en="How long it takes to arrive" data-fr="Délai d’arrivée"></h2>
    <p data-es="Sujeto a disponibilidad, el tiempo estimado de llegada a Polanco es de <strong>60 a 90 minutos</strong>, según el tráfico; puede ser menos. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada." data-en="Subject to availability, the estimated arrival time in Polanco is <strong>60–90 minutes</strong>, depending on traffic; it may be shorter. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time." data-fr="Sous réserve de disponibilité, le délai d’arrivée estimé à Polanco est de <strong>60 à 90 minutes</strong>, selon la circulation ; il peut être moins long. Lors de la réservation, envoyez un WhatsApp au +52 595 109 3969 et une heure estimée vous sera confirmée."></p>
    <p data-es="Si está en un hotel, avise en recepción que espera al médico y comparta su número de habitación. Si es la primera consulta, antes de su primera consulta debe llenar los dos <a href='/#formularios-previos'>formularios</a> (consentimiento informado y cuestionario de salud)." data-en="If you are at a hotel, let the front desk know you are expecting the doctor and share your room number. Before a first visit, you need to fill in the two <a href='/en/#formularios-previos'>forms</a> (informed consent and health questionnaire)." data-fr="Si vous êtes à l’hôtel, prévenez la réception que vous attendez le médecin et indiquez votre numéro de chambre. Avant une première consultation, vous devez remplir les deux <a href='/fr/#formularios-previos'>formulaires</a> (consentement éclairé et questionnaire de santé)."></p>

    <h2 data-es="Consultorio en Polanco" data-en="Clinic in Polanco" data-fr="Cabinet à Polanco"></h2>
    <p data-es="Con cita, de lunes a viernes por la tarde y los sábados por la mañana. El consultorio está en Briyam Coworking Médico, sede Masaryk: <span data-sede='Polanco'></span>. Su cita queda confirmada al pagar en línea, con tarjeta, el anticipo del 50 % (<span data-tarifa='anticipo:Polanco'></span> de <span data-tarifa='consultorio:Polanco'></span>); el resto se paga en el consultorio. Después de reservar, envíe un WhatsApp al +52 595 109 3969. Horario detallado y política de cancelación en la <a href='/#tarifas'>sección de tarifas</a>." data-en="By appointment on weekday evenings and Saturday mornings. The clinic is at Briyam Coworking Médico, Masaryk location: <span data-sede='Polanco'></span>. Your appointment is confirmed once you pay the 50% deposit online by card (<span data-tarifa='anticipo:Polanco'></span> of <span data-tarifa='consultorio:Polanco'></span>); the rest is paid at the clinic. After booking, send a WhatsApp to +52 595 109 3969. Detailed hours and cancellation policy are in the <a href='/en/#tarifas'>fees section</a>." data-fr="Sur rendez-vous, du lundi au vendredi en fin de journée et le samedi matin. Le cabinet se trouve chez Briyam Coworking Médico, site Masaryk : <span data-sede='Polanco'></span>. Votre rendez-vous est confirmé une fois l’acompte de 50 % payé en ligne par carte (<span data-tarifa='anticipo:Polanco'></span> sur <span data-tarifa='consultorio:Polanco'></span>) ; le solde se paie au cabinet. Après la réservation, envoyez un WhatsApp au +52 595 109 3969. Horaires détaillés et conditions d’annulation dans la <a href='/fr/#tarifas'>section des tarifs</a>."></p>

    <h2 data-es="Qué puede atender el médico y qué no" data-en="What the doctor can and cannot help with" data-fr="Ce que le médecin peut prendre en charge, et ce qu’il ne peut pas"></h2>
    <p data-es="Es medicina general ambulatoria: valoración y tratamiento de padecimientos leves, como infecciones respiratorias sin dificultad para respirar, gastroenteritis sin signos de alarma, heridas menores o molestias leves por la <a href='/guias/altitud-cdmx/'>altitud</a>. No sustituye a un hospital: si se necesitan estudios de imagen, oxígeno, cirugía u hospitalización, el médico le indicará acudir a urgencias. Vea <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias</a>." data-en="This is outpatient general medicine: assessment and treatment of mild conditions, such as respiratory infections without trouble breathing, gastroenteritis without warning signs, minor cuts or mild symptoms from the <a href='/en/guides/mexico-city-altitude/'>altitude</a>. It does not replace a hospital: if imaging, oxygen, surgery or a hospital stay may be needed, the doctor will tell you to go to the ER. See <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER</a>." data-fr="Il s’agit de médecine générale ambulatoire : évaluation et traitement d’affections légères, comme les infections respiratoires sans difficulté à respirer, les gastro-entérites sans signes d’alerte, les plaies mineures ou les gênes légères liées à l’<a href='/fr/guides/altitude-mexico/'>altitude</a>. Cela ne remplace pas un hôpital : si une imagerie, de l’oxygène, une chirurgie ou une hospitalisation peuvent être nécessaires, le médecin vous dira de vous rendre aux urgences. Voir <a href='/fr/guides/urgences-mexico/'>quand aller aux urgences</a>."></p>

    <h2 data-es="Pago y documentos para su seguro" data-en="Payment and insurance documents" data-fr="Paiement et documents pour votre assurance"></h2>
    <p data-es="El pago al médico es en pesos mexicanos: tarjeta, transferencia o efectivo. Cuando hay tratamiento indicado, recibe receta por escrito, útil para su reclamo. La aceptación del reclamo depende de su póliza. Si necesita medicamentos, vea la <a href='/guias/farmacias-cdmx/'>guía de farmacias en la CDMX</a>." data-en="Payment to the doctor is in Mexican pesos: card, bank transfer or cash. When treatment is indicated, you receive a written prescription for your claim. Whether a claim is accepted depends on your policy. If you need medicines, see the <a href='/en/guides/pharmacies-mexico-city/'>Mexico City pharmacy guide</a>." data-fr="Le paiement au médecin se fait en pesos mexicains : carte, virement ou espèces. Lorsqu’un traitement est indiqué, vous recevez une ordonnance écrite, utile pour votre demande de remboursement. L’acceptation de la demande dépend de votre police. Si vous avez besoin de médicaments, consultez le <a href='/fr/guides/pharmacies-mexico/'>guide des pharmacies à Mexico</a>."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="¿El médico puede atenderme en mi hotel de Polanco?" data-en="Can the doctor see me at my hotel in Polanco?" data-fr="Le médecin peut-il me voir à mon hôtel à Polanco ?"></h3>
      <p data-es="Sí, en su habitación, las 24 horas según disponibilidad. En horario ordinario, la visita en hotel en Polanco cuesta desde <span data-tarifa='hotel:Polanco:0'></span> MXN; no requiere anticipo y se paga directamente al médico, en pesos mexicanos. El tiempo estimado de llegada es de 60 a 90 minutos, según el tráfico; puede ser menos." data-en="Yes, in your room, 24 hours a day subject to availability. At standard hours, a hotel visit in Polanco costs from <span data-tarifa='hotel:Polanco:0'></span> MXN; no deposit is needed and you pay the doctor directly, in Mexican pesos. Estimated arrival is 60–90 minutes, depending on traffic; it may be shorter." data-fr="Oui, dans votre chambre, 24 h/24 selon les disponibilités. En horaire ordinaire, la visite à l’hôtel à Polanco coûte à partir de <span data-tarifa='hotel:Polanco:0'></span> MXN ; aucun acompte n’est nécessaire et vous payez directement le médecin, en pesos mexicains. Le délai d’arrivée estimé est de 60 à 90 minutes, selon la circulation ; il peut être moins long."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Qué debo hacer para que el médico llegue a mi habitación?" data-en="What should I do so the doctor can reach my room?" data-fr="Que dois-je faire pour que le médecin puisse accéder à ma chambre ?"></h3>
      <p data-es="Escriba por WhatsApp al +52 595 109 3969: las visitas a hotel se coordinan solo por ese medio, y ahí se le confirma una hora estimada de llegada. Avise en recepción que espera al médico y comparta su número de habitación. Si es su primera consulta, antes de la cita debe llenar los dos formularios: consentimiento informado y cuestionario de salud." data-en="Send a WhatsApp to +52 595 109 3969: hotel visits are arranged that way only, and you will be given an estimated arrival time. Let the front desk know you are expecting the doctor and share your room number. Before a first visit, you need to fill in the two forms: informed consent and health questionnaire." data-fr="Écrivez par WhatsApp au +52 595 109 3969 : les visites à l’hôtel se coordonnent uniquement par ce moyen, et une heure d’arrivée estimée vous y est confirmée. Prévenez la réception que vous attendez le médecin et indiquez votre numéro de chambre. Avant une première consultation, vous devez remplir les deux formulaires : consentement éclairé et questionnaire de santé."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="Si prefiero ir al consultorio, ¿dónde está y cuándo atiende?" data-en="If I'd rather go to the clinic, where is it and when is it open?" data-fr="Si je préfère aller au cabinet, où se trouve-t-il et quels sont ses horaires ?"></h3>
      <p data-es="En Briyam Coworking Médico, sede Masaryk: <span data-sede='Polanco'></span>. Con cita, de lunes a viernes de 17:00 a 20:00 y sábados de 11:00 a 15:00; la cita de las 20:00 es solo para consultas subsecuentes. La consulta cuesta <span data-tarifa='consultorio:Polanco'></span> MXN y se confirma al pagar en línea, con tarjeta, el anticipo de <span data-tarifa='anticipo:Polanco'></span> MXN; el resto se paga en el consultorio." data-en="At Briyam Coworking Médico, Masaryk location: <span data-sede='Polanco'></span>. By appointment, Monday to Friday 5–8 pm and Saturdays 11 am–3 pm; the 8 pm slot is for follow-up visits only. The visit costs <span data-tarifa='consultorio:Polanco'></span> MXN and is confirmed when you pay the <span data-tarifa='anticipo:Polanco'></span> MXN deposit online by card; the rest is paid at the clinic." data-fr="Chez Briyam Coworking Médico, site Masaryk : <span data-sede='Polanco'></span>. Sur rendez-vous, du lundi au vendredi de 17 h à 20 h et le samedi de 11 h à 15 h ; le créneau de 20 h est réservé aux consultations de suivi. La consultation coûte <span data-tarifa='consultorio:Polanco'></span> MXN et elle est confirmée une fois l’acompte de <span data-tarifa='anticipo:Polanco'></span> MXN payé en ligne par carte ; le solde se paie au cabinet."></p>
    </div>
