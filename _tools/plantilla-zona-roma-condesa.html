    <h2 data-es="Honorarios en la Roma y la Condesa" data-en="Fees in Roma and Condesa"></h2>
    <p data-es="Las dos colonias están en la <strong>Zona <span data-tarifa='zona:Roma'></span></strong> de visitas a hotel y comparten tarifa de consulta a domicilio. El consultorio está en la Roma; no hay sede en la Condesa. Montos en pesos mexicanos, por consulta:" data-en="Both neighborhoods are in hotel visit <strong>Zone <span data-tarifa='zona:Roma'></span></strong> and share the same house call fee. The clinic is in Roma; there is no Condesa location. Amounts in Mexican pesos, per visit:"></p>
    <table>
      <thead><tr>
        <th data-es="Servicio" data-en="Service"></th>
        <th style="text-align:right" data-es="Ordinario" data-en="Standard"></th>
        <th style="text-align:right" data-es="Especial" data-en="After-hours"></th>
        <th style="text-align:right" data-es="Festivo" data-en="Holiday"></th>
      </tr></thead>

        <tr><td data-es="Visita en hotel" data-en="Hotel visit"></td><td class="price-col" data-tarifa="hotel:Roma:0"></td><td class="price-col" data-tarifa="hotel:Roma:1"></td><td class="price-col" data-tarifa="hotel:Roma:2"></td></tr>
        <tr><td data-es="Consulta a domicilio" data-en="House call"></td><td class="price-col" data-tarifa="domicilio:Condesa:0"></td><td class="price-col" data-tarifa="domicilio:Condesa:1"></td><td class="price-col" data-tarifa="domicilio:Condesa:2"></td></tr>
        <tr><td data-es="Consultorio Roma (con cita)" data-en="Roma clinic (by appointment)"></td><td class="price-col" data-tarifa="consultorio:Roma"></td><td class="price-col">—</td><td class="price-col" data-tarifa="consultorio:Días Festivos"></td></tr>
      </tbody>
    </table>
    <p data-es="La tarifa depende del horario y del día, y se confirma al solicitar la visita; los festivos se coordinan solo por WhatsApp. Horarios ordinario, especial y festivo en la <a href='/#tarifas'>sección de tarifas</a>, con los mismos honorarios." data-en="The fee depends on the time and day, and is confirmed when you request the visit; holidays are arranged via WhatsApp only. Standard, after-hours and holiday times are in the <a href='/en/#tarifas'>fees section</a>, with the same fees."></p>
    <p data-es="<strong>Anticipo y cancelación.</strong> La visita a hotel no requiere anticipo: se paga directamente al médico, en pesos mexicanos. La consulta a domicilio se solicita por WhatsApp y se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Condesa'></span>, el 50 % de la tarifa ordinaria. El resto, y en horario especial o festivo la diferencia, se paga al médico en la visita. Si cancela con al menos 3 horas de anticipación, se reembolsa el anticipo; con menos de 3 horas, o si no está en el domicilio a la hora acordada, no es reembolsable." data-en="<strong>Deposit and cancellation.</strong> Hotel visits need no deposit: they are paid directly to the doctor, in Mexican pesos. House calls are requested via WhatsApp and confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Condesa'></span>, 50% of the standard fee. The rest, and the difference for after-hours or holiday visits, is paid to the doctor at the visit. If you cancel at least 3 hours in advance, the deposit is refunded; with less than 3 hours' notice, or if you are not at the address at the agreed time, it is non-refundable."></p>

    <h2 data-es="Si se hospeda en un departamento de renta temporal" data-en="If you are staying in a short-term rental"></h2>
    <p data-es="Al escribir por WhatsApp, indique si está en un hotel, en un departamento de renta temporal o en una casa particular, y la dirección. Así se le confirma qué tarifa aplica antes de la visita. Tenga a la mano el nombre del edificio, el número de departamento y, si hay vigilancia en la entrada, avise que espera al médico." data-en="When you message on WhatsApp, say whether you are at a hotel, a short-term rental apartment or a private home, and give the address. That way the applicable fee is confirmed before the visit. Have the building name and apartment number ready and, if there is a security desk, let them know you are expecting the doctor."></p>

    <h2 data-es="Cuánto tarda en llegar" data-en="How long it takes to arrive"></h2>
    <p data-es="Sujeto a disponibilidad, el tiempo estimado de llegada a la Roma y la Condesa es de <strong>unos 45 minutos</strong>, según el tráfico; puede ser menos. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada." data-en="Subject to availability, the estimated arrival time in Roma and Condesa is <strong>about 45 minutes</strong>, depending on traffic; it may be shorter. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time."></p>

    <h2 data-es="Consultorio en la Roma" data-en="Clinic in Roma"></h2>
    <p data-es="Con cita, de lunes a viernes por la tarde y los sábados por la mañana. El consultorio está en Briyam Coworking Médico, sede Roma Sur: <span data-sede='Roma'></span>. Su cita queda confirmada al pagar en línea, con tarjeta, el anticipo del 50 % (<span data-tarifa='anticipo:Roma'></span> de <span data-tarifa='consultorio:Roma'></span>); el resto se paga en el consultorio. Horario detallado y política de cancelación en la <a href='/#tarifas'>sección de tarifas</a>." data-en="By appointment on weekday evenings and Saturday mornings. The clinic is at Briyam Coworking Médico, Roma Sur location: <span data-sede='Roma'></span>. Your appointment is confirmed once you pay the 50% deposit online by card (<span data-tarifa='anticipo:Roma'></span> of <span data-tarifa='consultorio:Roma'></span>); the rest is paid at the clinic. Detailed hours and cancellation policy are in the <a href='/en/#tarifas'>fees section</a>."></p>

    <h2 data-es="Para viajeros" data-en="For travelers"></h2>
    <p data-es="Si necesita un certificado médico para su aerolínea o un resumen clínico en inglés para su seguro, vea <a href='/certificados-y-viajeros/'>certificados y documentos para viajeros</a>. Para padecimientos frecuentes al llegar a la ciudad, hay guías sobre la <a href='/guias/altitud-cdmx/'>altitud</a>, la <a href='/guias/diarrea-del-viajero/'>diarrea del viajero</a> y las <a href='/guias/farmacias-cdmx/'>farmacias en la CDMX</a>." data-en="If you need a medical certificate for your airline or an English-language clinical summary for your insurer, see <a href='/en/travel-medical-certificates/'>certificates and documents for travelers</a>. For common problems after arriving in the city, there are guides on <a href='/en/guides/mexico-city-altitude/'>altitude</a>, <a href='/en/guides/travelers-diarrhea-mexico-city/'>traveler's diarrhea</a> and <a href='/en/guides/pharmacies-mexico-city/'>Mexico City pharmacies</a>."></p>
    <p data-es="Es medicina general ambulatoria para padecimientos leves; no sustituye a un hospital. Vea <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias</a>." data-en="This is outpatient general medicine for mild conditions; it does not replace a hospital. See <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER</a>."></p>
