  <h1 class="page-h1" data-es="Cuándo ir a <em>urgencias</em> en la Ciudad de México" data-en="When to go to the <em>emergency room</em> in Mexico City" data-fr="Quand aller aux <em>urgences</em> à Mexico"></h1>
  <p class="page-lead" data-es="Llame al 911 o acuda a urgencias si tiene dolor en el pecho, dificultad para respirar, signos de un evento vascular cerebral, pérdida del estado de alerta, una convulsión, un sangrado abundante o cualquier otro de los signos de alarma de esta guía. En México, el número de emergencias es el 911 y atiende las 24 horas." data-en="Call 911 or go to an emergency room if you have chest pain, trouble breathing, signs of a stroke, loss of consciousness, a seizure, heavy bleeding, or any other warning sign listed in this guide. In Mexico, the emergency number is 911 and it answers 24 hours a day." data-fr="Appelez le 911 ou rendez-vous aux urgences si vous avez une douleur thoracique, des difficultés à respirer, des signes d’accident vasculaire cérébral (AVC), une perte de connaissance, une crise convulsive, un saignement abondant ou tout autre signe d’alerte figurant dans ce guide. Au Mexique, le numéro d’urgence est le 911 et il répond 24 heures sur 24."></p>
</header>

<div class="sep"></div>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Signos de alarma: llame al 911 o vaya a urgencias" data-en="Warning signs: call 911 or go to the ER" data-fr="Signes d’alerte : appelez le 911 ou allez aux urgences"></h2>
    <p data-es="No espere a que pasen ni intente resolverlos con una consulta en el hotel si usted o su acompañante tiene alguno de estos signos:" data-en="Do not wait for them to pass or try to handle them with a hotel visit if you or your companion has any of these signs:" data-fr="N’attendez pas qu’ils passent et n’essayez pas de les traiter par une consultation à l’hôtel si vous ou la personne qui vous accompagne présentez l’un de ces signes :"></p>
    <ul>
      <li data-es="<strong>Dolor u opresión en el pecho</strong>, o dolor en brazo, mandíbula, cuello o espalda, con falta de aire, debilidad o sensación de desmayo." data-en="<strong>Chest pain or pressure</strong>, or pain in the arm, jaw, neck or back, with shortness of breath, weakness or feeling faint." data-fr="<strong>Douleur ou oppression dans la poitrine</strong>, ou douleur dans le bras, la mâchoire, le cou ou le dos, avec essoufflement, faiblesse ou sensation d’évanouissement."></li>
      <li data-es="<strong>Dificultad para respirar</strong> que aparece de pronto o empeora, o falta de aire en reposo." data-en="<strong>Trouble breathing</strong> that starts suddenly or gets worse, or shortness of breath at rest." data-fr="<strong>Difficulté à respirer</strong> qui apparaît brusquement ou s’aggrave, ou essoufflement au repos."></li>
      <li data-es="<strong>Signos de evento vascular cerebral (EVC)</strong>: vea la regla BE-FAST más abajo." data-en="<strong>Signs of a stroke</strong>: see the BE-FAST rule below." data-fr="<strong>Signes d’AVC</strong> : voir la règle BE-FAST ci-dessous."></li>
      <li data-es="<strong>Pérdida del estado de alerta</strong>, desmayo, confusión súbita o dificultad para despertar a la persona." data-en="<strong>Loss of consciousness</strong>, fainting, sudden confusion or difficulty waking the person." data-fr="<strong>Perte de connaissance</strong>, évanouissement, confusion soudaine ou difficulté à réveiller la personne."></li>
      <li data-es="&lt;strong&gt;Convulsión&lt;/strong&gt; que dura más de 5 minutos, que es la primera, que se repite poco después, que ocurre en el agua, en el embarazo o en una persona con diabetes que pierde el conocimiento, o que se acompaña de lesión o de dificultad para respirar o para despertar." data-en="&lt;strong&gt;A seizure&lt;/strong&gt; that lasts more than 5 minutes, is the first one, happens again soon after, occurs in water, during pregnancy or in a person with diabetes who loses consciousness, or comes with an injury or trouble breathing or waking up." data-fr="&lt;strong&gt;Crise convulsive&lt;/strong&gt; qui dure plus de 5 minutes, qui est la première, qui se répète peu après, qui survient dans l’eau, pendant la grossesse ou chez une personne diabétique qui perd connaissance, ou qui s’accompagne d’une blessure ou d’une difficulté à respirer ou à se réveiller."></li>
      <li data-es="<strong>Sangrado abundante</strong> que no se detiene con presión directa, o vómito o evacuaciones con mucha sangre." data-en="<strong>Heavy bleeding</strong> that does not stop with direct pressure, or vomit or stools with a lot of blood." data-fr="<strong>Saignement abondant</strong> qui ne s’arrête pas par une pression directe, ou vomissements ou selles contenant beaucoup de sang."></li>
      <li data-es="<strong>Reacción alérgica grave</strong>: hinchazón de labios, lengua o garganta, dificultad para respirar o tragar, o ronchas extensas con mareo." data-en="<strong>A severe allergic reaction</strong>: swelling of the lips, tongue or throat, trouble breathing or swallowing, or widespread hives with dizziness." data-fr="<strong>Réaction allergique grave</strong> : gonflement des lèvres, de la langue ou de la gorge, difficulté à respirer ou à avaler, ou urticaire étendue avec étourdissements."></li>
      <li data-es="<strong>Dolor abdominal intenso</strong> o que no cede, sobre todo con el abdomen duro." data-en="<strong>Severe abdominal pain</strong> or pain that does not ease, especially with a hard belly." data-fr="<strong>Douleur abdominale intense</strong> ou qui ne cède pas, surtout si le ventre est dur."></li>
      <li data-es="<strong>Fiebre con rigidez de nuca</strong>, dolor de cabeza intenso, confusión o sensibilidad a la luz." data-en="<strong>Fever with a stiff neck</strong>, severe headache, confusion or sensitivity to light." data-fr="<strong>Fièvre avec raideur de la nuque</strong>, mal de tête intense, confusion ou sensibilité à la lumière."></li>
      <li data-es="<strong>Deshidratación grave</strong>: no poder beber ni retener líquidos, orinar muy poco o nada, somnolencia o confusión." data-en="<strong>Severe dehydration</strong>: unable to drink or keep fluids down, passing little or no urine, drowsiness or confusion." data-fr="<strong>Déshydratation grave</strong> : impossibilité de boire ou de garder les liquides, très peu ou pas d’urine, somnolence ou confusion."></li>
      <li data-es="<strong>Traumatismo</strong>: golpe en la cabeza con vómito, somnolencia o confusión; accidente de tránsito; posible fractura o herida profunda." data-en="<strong>Injury</strong>: a blow to the head followed by vomiting, drowsiness or confusion; a traffic accident; a possible broken bone or a deep wound." data-fr="<strong>Traumatisme</strong> : coup à la tête suivi de vomissements, de somnolence ou de confusion ; accident de la route ; fracture possible ou plaie profonde."></li>
    </ul>

    <h2 data-es="Cómo reconocer un EVC: la regla BE-FAST" data-en="How to recognize a stroke: the BE-FAST rule" data-fr="Reconnaître un AVC : la règle BE-FAST"></h2>
    <p data-es="Si alguno de estos signos aparece de forma súbita, llame al 911 de inmediato y anote la hora en que empezó:" data-en="If any of these signs appears suddenly, call 911 right away and note the time it started:" data-fr="Si l’un de ces signes apparaît soudainement, appelez immédiatement le 911 et notez l’heure à laquelle il a commencé :"></p>
    <ul>
      <li data-es="<strong>B, equilibrio (<em>balance</em>):</strong> pérdida súbita del equilibrio o de la coordinación." data-en="<strong>B, balance:</strong> sudden loss of balance or coordination." data-fr="<strong>B, équilibre (<em>balance</em>) :</strong> perte soudaine de l’équilibre ou de la coordination."></li>
      <li data-es="<strong>E, ojos (<em>eyes</em>):</strong> pérdida o alteración súbita de la visión." data-en="<strong>E, eyes:</strong> sudden loss of or change in vision." data-fr="<strong>E, yeux (<em>eyes</em>) :</strong> perte ou modification soudaine de la vision."></li>
      <li data-es="<strong>F, cara (<em>face</em>):</strong> pida a la persona que sonría. ¿Se cae un lado de la cara?" data-en="<strong>F, face:</strong> ask the person to smile. Does one side of the face droop?" data-fr="<strong>F, visage (<em>face</em>) :</strong> demandez à la personne de sourire. Un côté du visage s’affaisse-t-il ?"></li>
      <li data-es="<strong>A, brazos (<em>arms</em>):</strong> pida que levante ambos brazos. ¿Uno de ellos baja?" data-en="<strong>A, arms:</strong> ask the person to raise both arms. Does one arm drift down?" data-fr="<strong>A, bras (<em>arms</em>) :</strong> demandez-lui de lever les deux bras. L’un des bras retombe-t-il ?"></li>
      <li data-es="<strong>S, habla (<em>speech</em>):</strong> pida que repita una frase sencilla. ¿Habla arrastrado o raro?" data-en="<strong>S, speech:</strong> ask the person to repeat a simple phrase. Is the speech slurred or strange?" data-fr="<strong>S, parole (<em>speech</em>) :</strong> demandez-lui de répéter une phrase simple. Parle-t-elle de façon mal articulée ou étrange ?"></li>
      <li data-es="<strong>T, tiempo (<em>time</em>):</strong> llame al 911 de inmediato." data-en="<strong>T, time:</strong> call 911 right away." data-fr="<strong>T, temps (<em>time</em>) :</strong> appelez immédiatement le 911."></li>
    </ul>
    <p data-es="Los CDC recomiendan no ir manejando al hospital ni pedir a alguien que lo lleve: es mejor llamar al 911 para que envíen una ambulancia." data-en="The CDC advises against driving yourself to the hospital or having someone drive you: it is better to call 911 so an ambulance is sent." data-fr="Les CDC déconseillent de conduire soi-même jusqu’à l’hôpital ou de s’y faire conduire : mieux vaut appeler le 911 pour qu’une ambulance soit envoyée."></p>

    <h2 data-es="Cómo llamar al 911 en la Ciudad de México" data-en="How to call 911 in Mexico City" data-fr="Comment appeler le 911 à Mexico"></h2>
    <p data-es="El 911 es el número de emergencias en México. En la Ciudad de México lo opera el C5, atiende las 24 horas, los 365 días del año, e incluye las urgencias médicas. Al llamar, diga con calma:" data-en="911 is the emergency number in Mexico. In Mexico City it is run by the C5 and answers 24 hours a day, 365 days a year, including medical emergencies. When you call, calmly say:" data-fr="Le 911 est le numéro d’urgence au Mexique. À Mexico, il est géré par le C5 et répond 24 heures sur 24, 365 jours par an, y compris pour les urgences médicales. Lorsque vous appelez, indiquez calmement :"></p>
    <ul>
      <li data-es="Qué está pasando." data-en="What is happening." data-fr="Ce qui se passe."></li>
      <li data-es="Dónde está: dirección, nombre del hotel, número de habitación y alguna referencia." data-en="Where you are: address, hotel name, room number and a landmark." data-fr="Où vous êtes : adresse, nom de l’hôtel, numéro de chambre et un point de repère."></li>
      <li data-es="A qué hora empezó." data-en="What time it started." data-fr="À quelle heure cela a commencé."></li>
      <li data-es="Cuántas personas están afectadas." data-en="How many people are affected." data-fr="Combien de personnes sont concernées."></li>
    </ul>
    <p data-es="Si se hospeda en un hotel, avise también a la recepción. Si no habla español, pida apoyo al personal para dar la dirección." data-en="If you are staying at a hotel, also tell the front desk. If you do not speak Spanish, ask the staff to help you give the address." data-fr="Si vous séjournez dans un hôtel, prévenez aussi la réception. Si vous ne parlez pas espagnol, demandez au personnel de vous aider à donner l’adresse."></p>

    <h2 data-es="Qué llevar a urgencias" data-en="What to bring to the ER" data-fr="Ce qu’il faut apporter aux urgences"></h2>
    <ul>
      <li data-es="Pasaporte o identificación oficial." data-en="Passport or official ID." data-fr="Passeport ou pièce d’identité officielle."></li>
      <li data-es="Póliza de su seguro de viaje o de gastos médicos y el teléfono de asistencia de la aseguradora." data-en="Your travel or health insurance policy and the insurer's assistance phone number." data-fr="Votre police d’assurance voyage ou santé et le numéro d’assistance de l’assureur."></li>
      <li data-es="Lista de sus medicamentos con el nombre genérico y la dosis, además de sus alergias y enfermedades." data-en="A list of your medicines with the generic name and dose, plus your allergies and medical conditions." data-fr="La liste de vos médicaments avec leur nom générique et leur dose, ainsi que vos allergies et vos maladies."></li>
      <li data-es="Tarjeta de crédito o débito." data-en="A credit or debit card." data-fr="Une carte de crédit ou de débit."></li>
      <li data-es="Teléfono con batería y el contacto de un familiar." data-en="A charged phone and a family member's contact information." data-fr="Un téléphone chargé et les coordonnées d’un proche."></li>
    </ul>
    <p data-es="Los CDC sugieren anotar los medicamentos con su nombre genérico, porque los nombres comerciales cambian de un país a otro." data-en="The CDC suggests listing medicines by their generic name, because brand names vary from country to country." data-fr="Les CDC suggèrent de noter les médicaments sous leur nom générique, car les noms commerciaux varient d’un pays à l’autre."></p>

    <h2 data-es="Hospitales en la Ciudad de México y pago de la atención" data-en="Hospitals in Mexico City and paying for care" data-fr="Hôpitaux à Mexico et paiement des soins"></h2>
    <p data-es="En la Ciudad de México hay hospitales públicos y privados con servicio de urgencias las 24 horas. Esta guía no recomienda ninguno en particular." data-en="Mexico City has public and private hospitals with 24-hour emergency departments. This guide does not recommend any particular one." data-fr="Mexico compte des hôpitaux publics et privés dotés d’un service d’urgences ouvert 24 heures sur 24. Ce guide n’en recommande aucun en particulier."></p>
    <p data-es="Los hospitales privados suelen pedir una garantía de pago antes o al momento de la atención, por ejemplo una tarjeta de crédito, un depósito o la autorización de su aseguradora. Llame cuanto antes a la asistencia de su seguro, como piden muchas pólizas, y guarde las facturas y los informes médicos para su reembolso. Ante un signo de alarma, no retrase la atención por estos trámites." data-en="Private hospitals usually ask for a payment guarantee before or at the time of care, such as a credit card, a deposit or your insurer's authorization. Call your insurer's assistance line as soon as possible, as many policies require, and keep your invoices and medical reports for reimbursement. If you have a warning sign, do not delay care because of this paperwork." data-fr="Les hôpitaux privés demandent généralement une garantie de paiement avant ou au moment des soins, par exemple une carte de crédit, un dépôt ou l’autorisation de votre assureur. Appelez dès que possible l’assistance de votre assurance, comme l’exigent de nombreuses polices, et conservez les factures et les comptes rendus médicaux pour le remboursement. En cas de signe d’alerte, ne retardez pas les soins à cause de ces démarches."></p>

    <h2 data-es="Qué puede atender un médico en su hotel y qué no" data-en="What a hotel doctor can and cannot treat" data-fr="Ce qu’un médecin à l’hôtel peut traiter, et ce qu’il ne peut pas traiter"></h2>
    <p data-es="Un médico general a domicilio u hotel puede valorar y tratar padecimientos leves, por ejemplo:" data-en="A general physician making a house call or hotel visit can assess and treat mild conditions, for example:" data-fr="Un médecin généraliste se déplaçant à domicile ou à l’hôtel peut évaluer et traiter des affections bénignes, par exemple :"></p>
    <ul>
      <li data-es="Infecciones respiratorias leves, como resfriado, dolor de garganta o tos sin dificultad para respirar." data-en="Mild respiratory infections, such as a cold, sore throat or cough without trouble breathing." data-fr="Infections respiratoires bénignes, comme un rhume, un mal de gorge ou une toux sans difficulté à respirer."></li>
      <li data-es="Gastroenteritis o diarrea sin signos de alarma (vea la <a href='/guias/diarrea-del-viajero/'>guía de diarrea del viajero</a>)." data-en="Gastroenteritis or diarrhea without warning signs (see the <a href='/en/guides/travelers-diarrhea-mexico-city/'>traveler's diarrhea guide</a>)." data-fr="Gastro-entérite ou diarrhée sans signes d’alerte (voir le <a href='/fr/guides/diarrhee-du-voyageur-mexico/'>guide sur la diarrhée du voyageur</a>)."></li>
      <li data-es="Heridas menores y raspones." data-en="Minor cuts and scrapes." data-fr="Petites coupures et éraflures."></li>
      <li data-es="Molestias leves por la altitud (vea la <a href='/guias/altitud-cdmx/'>guía de altitud</a>)." data-en="Mild symptoms from the altitude (see the <a href='/en/guides/mexico-city-altitude/'>altitude guide</a>)." data-fr="Symptômes légers liés à l’altitude (voir le <a href='/fr/guides/altitude-mexico/'>guide sur l’altitude</a>)."></li>
    </ul>
    <p data-es="No sustituye a un hospital. Ante cualquiera de los signos de alarma de esta guía, o si se necesitan estudios de imagen, oxígeno, cirugía u hospitalización, lo indicado es llamar al 911 o ir a urgencias. Si durante la consulta aparece un signo de alarma, el médico le indicará acudir a urgencias." data-en="It does not replace a hospital. For any of the warning signs in this guide, or if imaging, oxygen, surgery or a hospital stay may be needed, call 911 or go to the ER. If a warning sign appears during the visit, the doctor will tell you to go to the ER." data-fr="Il ne remplace pas un hôpital. En présence de l’un des signes d’alerte de ce guide, ou si une imagerie, de l’oxygène, une chirurgie ou une hospitalisation peuvent être nécessaires, appelez le 911 ou rendez-vous aux urgences. Si un signe d’alerte apparaît pendant la consultation, le médecin vous dira de vous rendre aux urgences."></p>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="¿El 911 funciona en la Ciudad de México?" data-en="Does 911 work in Mexico City?" data-fr="Le 911 fonctionne-t-il à Mexico ?"></h3>
      <p data-es="Sí. El 911 es el número de emergencias en México. En la Ciudad de México atiende las 24 horas, los 365 días del año, e incluye las urgencias médicas." data-en="Yes. 911 is the emergency number in Mexico. In Mexico City it answers 24 hours a day, 365 days a year, including medical emergencies." data-fr="Oui. Le 911 est le numéro d’urgence au Mexique. À Mexico, il répond 24 heures sur 24, 365 jours par an, y compris pour les urgences médicales."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Necesito seguro para ir a urgencias?" data-en="Do I need insurance to go to the ER?" data-fr="Ai-je besoin d’une assurance pour aller aux urgences ?"></h3>
      <p data-es="Ante un signo de alarma, busque atención primero. Los hospitales privados suelen pedir una garantía de pago, como una tarjeta, un depósito o la autorización de su aseguradora, así que conviene tener a la mano su póliza y el teléfono de asistencia." data-en="If you have a warning sign, get care first. Private hospitals usually ask for a payment guarantee, such as a card, a deposit or your insurer's authorization, so keep your policy and assistance phone number at hand." data-fr="En cas de signe d’alerte, faites-vous soigner d’abord. Les hôpitaux privés demandent généralement une garantie de paiement, comme une carte, un dépôt ou l’autorisation de votre assureur ; gardez donc à portée de main votre police et le numéro d’assistance."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Un médico en el hotel sustituye una visita a urgencias?" data-en="Can a hotel doctor replace a visit to the ER?" data-fr="Un médecin à l’hôtel peut-il remplacer une visite aux urgences ?"></h3>
      <p data-es="No. Puede atender padecimientos leves, como una infección respiratoria leve, una gastroenteritis sin signos de alarma o una herida menor. Ante dolor en el pecho, dificultad para respirar, signos de EVC u otro signo de alarma, llame al 911." data-en="No. A hotel doctor can treat mild conditions, such as a mild respiratory infection, gastroenteritis without warning signs or a minor cut. For chest pain, trouble breathing, signs of a stroke or any other warning sign, call 911." data-fr="Non. Un médecin à l’hôtel peut traiter des affections bénignes, comme une infection respiratoire bénigne, une gastro-entérite sans signes d’alerte ou une petite coupure. En cas de douleur thoracique, de difficulté à respirer, de signes d’AVC ou de tout autre signe d’alerte, appelez le 911."></p>
    </div>

    <div class="emergency-note" data-es="<strong>Ante una emergencia, llame al 911</strong> o acuda a urgencias hospitalarias. Esta guía y la visita médica en hotel no son un servicio de urgencias." data-en="<strong>In an emergency, call 911</strong> or go to a hospital emergency room. This guide and the hotel medical visit are not an emergency service." data-fr="<strong>En cas d’urgence, appelez le 911</strong> ou rendez-vous aux urgences d’un hôpital. Ce guide et la consultation médicale à l’hôtel ne sont pas un service d’urgences."></div>

    <div class="callout" data-solo="fr" data-es="" data-en="" data-fr="<strong>Consultation en espagnol ou en anglais.</strong> Si vous souhaitez une consultation entièrement en français, une assistante de traduction est présente au cabinet ou à l’hôtel (<span data-tarifa='asistente-frances'></span> MXN en supplément ; <span data-tarifa='asistente-frances-hotel-especial'></span> MXN pour une visite à l’hôtel en horaires spéciaux ou un jour férié). Prévenez-nous à l’avance par WhatsApp au +52 595 109 3969 : nous vérifions sa disponibilité (si vous réservez en ligne, cochez aussi l’option). Si vous n’en avez pas besoin, la consultation se déroule en espagnol ou en anglais. <strong>Documents :</strong> le médecin rédige les certificats et résumés en espagnol et en anglais ; si vous avez besoin d’une version en français, la traduction est réalisée par l’assistante, avec un supplément indiqué au moment de la demande. Non disponible en téléconsultation. Sa présence est couverte par le consentement éclairé, obligatoire avant la consultation. Les échanges par WhatsApp se font en espagnol ou en anglais."></div>

    <h2 data-es="Fuentes" data-en="Sources" data-fr="Sources"></h2>
