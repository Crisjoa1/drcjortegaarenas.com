  <h1 class="page-h1" data-es="Hidratación <em>intravenosa</em> en su hotel o domicilio en CDMX" data-en="<em>IV hydration</em> at your hotel or home in Mexico City" data-fr="<em>Hydratation intraveineuse</em> à votre hôtel ou à domicile à Mexico"></h1>
  <p class="page-lead" data-es="La hidratación intravenosa es la administración de solución por vena. El Dr. Ortega-Arenas la ofrece en su hotel o domicilio en la Ciudad de México solo cuando la valoración médica previa la justifica, porque la rehidratación oral es el tratamiento de primera elección. Cargo: $1,800 MXN, más la visita y el honorario de enfermería." data-en="IV hydration is the delivery of fluids through a vein. Dr. Ortega-Arenas offers it at your hotel or home in Mexico City only when the prior medical assessment justifies it, because oral rehydration is the first-choice treatment. Fee: $1,800 MXN, plus the visit and the nursing fee." data-fr="L’hydratation intraveineuse est l’administration de soluté par voie veineuse. Le Dr Ortega-Arenas la propose à votre hôtel ou à domicile à Mexico uniquement lorsque l’évaluation médicale préalable la justifie, car la réhydratation orale est le traitement de premier choix. Tarif : $1,800 MXN, plus la visite et les honoraires infirmiers."></p>
  <div class="hero-ctas">
    <a href="https://wa.me/525951093969?text=Hola%20Dr.%20Ortega-Arenas%2C%20me%20gustar%C3%ADa%20agendar%20una%20consulta." data-href-en="https://wa.me/525951093969?text=Hello%20Dr.%20Ortega-Arenas%2C%20I%27d%20like%20to%20book%20a%20visit." data-href-fr="https://wa.me/525951093969?text=Bonjour%20Dr%20Ortega-Arenas%2C%20je%20souhaite%20prendre%20rendez-vous." target="_blank" rel="noopener" class="hero-cta" data-es="Escribir por WhatsApp" data-en="Message on WhatsApp" data-fr="Écrire sur WhatsApp"></a>
    <a href="#planear" class="hero-cta ghost pl-cta-planear" data-es="Calcule su costo" data-en="Estimate your cost" data-fr="Estimez le coût"></a>
  </div>
  <div class="callout" data-es="&lt;strong&gt;No se aplica a solicitud.&lt;/strong&gt; La hidratación intravenosa requiere indicación médica: primero hay una consulta y el médico valora si la necesita; si la indica, usted decide si la acepta. En la deshidratación leve a moderada por diarrea o vómito, el tratamiento de primera elección es la rehidratación por boca,&lt;sup&gt;1&lt;/sup&gt; así que muchas veces la hidratación intravenosa no hace falta. Si no está indicada, no se aplica." data-en="&lt;strong&gt;Not given on request.&lt;/strong&gt; IV hydration requires a medical indication: there is a consultation first, and the physician assesses whether you need it; if it is indicated, you decide whether to accept it. For mild to moderate dehydration from diarrhea or vomiting, oral rehydration is the first-choice treatment,&lt;sup&gt;1&lt;/sup&gt; so IV hydration is often not needed. If it is not indicated, it is not given." data-fr="&lt;strong&gt;Pas sur demande.&lt;/strong&gt; L’hydratation intraveineuse nécessite une indication médicale : il y a d’abord une consultation, puis le médecin évalue si vous en avez besoin ; si elle est indiquée, c’est vous qui décidez de l’accepter ou non. En cas de déshydratation légère à modérée due à une diarrhée ou à des vomissements, la réhydratation par voie orale est le traitement de premier choix&lt;sup&gt;1&lt;/sup&gt; ; l’hydratation intraveineuse n’est donc souvent pas nécessaire. Si elle n’est pas indiquée, elle n’est pas administrée."></div>
  <div class="callout" data-solo="fr" data-es="" data-en="" data-fr="<strong>Consultation en espagnol ou en anglais.</strong> Si vous souhaitez une consultation entièrement en français, une assistante de traduction vous accompagne au cabinet, à l’hôtel, à domicile ou en téléconsultation (en supplément, mêmes honoraires que l’infirmière : <span data-tarifa='asistente-frances'></span> MXN en horaires ordinaires, <span data-tarifa='asistente-frances-especial'></span> MXN en horaires spéciaux et <span data-tarifa='asistente-frances-festivo'></span> MXN les jours fériés officiels ; réglés directement lors de la consultation, ils ne sont pas inclus dans le paiement en ligne). Prévenez-nous à l’avance par WhatsApp au +52 595 109 3969 : nous vérifions sa disponibilité. Si vous n’en avez pas besoin, la consultation se déroule en espagnol ou en anglais. <strong>Documents :</strong> le médecin rédige les certificats et résumés en espagnol et en anglais ; si vous avez besoin d’une version en français, l’assistante aide le médecin à la rédiger dans un français correct, avec un supplément, comme pour la version en anglais (500 MXN en PDF, 800 MXN imprimée). Il ne s’agit pas d’une traduction officielle : si votre démarche exige une traduction assermentée, demandez-la à un traducteur assermenté (perito traductor). Sa présence est couverte par le consentement éclairé, obligatoire avant la consultation. Les échanges par WhatsApp se font en espagnol ou en anglais."></div>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Nuestra filosofía de atención" data-en="Our approach to care" data-fr="Notre philosophie de soins"></h2>
    <p data-es="Aquí la hidratación intravenosa no es un producto que se pide: es un acto médico. Cada visita empieza con una valoración clínica y el tratamiento se decide con base en ella, no por solicitud. El médico que le atiende en México responde por lo que indica; por eso solo indica lo que su propia valoración justifica y, si usted necesita atención hospitalaria, se lo dice con claridad." data-en="Here, IV hydration is not a product you order: it is a medical act. Every visit starts with a clinical assessment, and treatment is decided on that basis, not on request. The physician who treats you in Mexico is responsible for every prescription, so only what that physician’s own assessment justifies is prescribed, and if you need hospital care, you will be told clearly." data-fr="Ici, l’hydratation intraveineuse n’est pas un produit que l’on commande : c’est un acte médical. Chaque visite commence par une évaluation clinique, et le traitement est décidé sur cette base, pas sur demande. Le médecin qui vous soigne au Mexique est responsable de ce qu’il prescrit ; il ne prescrit donc que ce que sa propre évaluation justifie et, si vous avez besoin de soins hospitaliers, il vous le dit clairement."></p>
    <h3 data-es="Cómo funciona una visita" data-en="How a visit works" data-fr="Comment se déroule une visite"></h3>
    <ol>
      <li data-es="&lt;strong&gt;Valoración clínica.&lt;/strong&gt; El médico le pregunta qué síntomas tiene y desde cuándo, revisa sus antecedentes y le explora." data-en="&lt;strong&gt;Clinical assessment.&lt;/strong&gt; The physician asks about your symptoms and when they started, reviews your medical history and examines you." data-fr="&lt;strong&gt;Évaluation clinique.&lt;/strong&gt; Le médecin vous interroge sur vos symptômes et leur début, passe en revue vos antécédents et vous examine."></li>
      <li data-es="&lt;strong&gt;Decisión del tratamiento.&lt;/strong&gt; Con base en esa valoración, el médico decide qué tratamiento necesita y por qué vía: por boca o por vena." data-en="&lt;strong&gt;Treatment decision.&lt;/strong&gt; Based on that assessment, the physician decides which treatment you need and how it is given: by mouth or through a vein." data-fr="&lt;strong&gt;Choix du traitement.&lt;/strong&gt; Sur la base de cette évaluation, le médecin décide du traitement dont vous avez besoin et de sa voie d’administration : par la bouche ou par voie intraveineuse."></li>
      <li data-es="&lt;strong&gt;Aplicación del tratamiento indicado.&lt;/strong&gt; Si la valoración lo justifica, la terapia intravenosa forma parte de la atención: líquidos para rehidratarle&lt;sup&gt;1&lt;/sup&gt; y, si hace falta, medicamento para el vómito&lt;sup&gt;1,4&lt;/sup&gt; o el dolor. Su cargo se detalla más abajo." data-en="&lt;strong&gt;Giving the indicated treatment.&lt;/strong&gt; If the assessment justifies it, IV therapy is part of your care: fluids to rehydrate you&lt;sup&gt;1&lt;/sup&gt; and, if needed, medicine for vomiting&lt;sup&gt;1,4&lt;/sup&gt; or pain. Its cost is detailed below." data-fr="&lt;strong&gt;Administration du traitement indiqué.&lt;/strong&gt; Si l’évaluation le justifie, la thérapie intraveineuse fait partie des soins : des liquides pour vous réhydrater&lt;sup&gt;1&lt;/sup&gt; et, si nécessaire, un médicament contre les vomissements&lt;sup&gt;1,4&lt;/sup&gt; ou la douleur. Son coût est détaillé plus bas."></li>
    </ol>
    <div class="callout" data-es="&lt;strong&gt;Recetas y órdenes del extranjero.&lt;/strong&gt; En México, la Ley General de Salud establece que solo pueden recetar medicamentos los profesionales de la salud que ella señala, como los médicos, y que deben contar con cédula profesional expedida por las autoridades educativas competentes.&lt;sup&gt;11&lt;/sup&gt; Por eso no aplicamos órdenes ni recetas de médicos del extranjero, aunque vengan de su médico de confianza o del médico de su grupo de viaje. Esa indicación es un antecedente valioso y la tomamos en cuenta, pero el tratamiento lo decide el Dr. Ortega-Arenas después de valorarle aquí, y él responde por lo que indica." data-en="&lt;strong&gt;Prescriptions and orders from abroad.&lt;/strong&gt; In Mexico, the General Health Law states that only the health professionals it lists, such as physicians, may prescribe medicines, and that they must hold a professional license (cédula profesional) issued by the competent education authorities.&lt;sup&gt;11&lt;/sup&gt; That is why we do not follow orders or prescriptions from doctors abroad, even if they come from your own doctor or from your travel group’s doctor. That information is a valuable part of your medical history and we take it into account, but Dr. Ortega-Arenas decides the treatment after assessing you here and is responsible for it." data-fr="&lt;strong&gt;Ordonnances et prescriptions de l’étranger.&lt;/strong&gt; Au Mexique, la loi générale de santé prévoit que seuls les professionnels de santé qu’elle énumère, comme les médecins, peuvent prescrire des médicaments, et qu’ils doivent être titulaires d’une cédula profesional délivrée par les autorités éducatives compétentes.&lt;sup&gt;11&lt;/sup&gt; C’est pourquoi nous n’appliquons pas les prescriptions ni les ordonnances de médecins exerçant à l’étranger, même si elles viennent de votre médecin habituel ou du médecin de votre groupe de voyage. Cette indication est un antécédent précieux et nous en tenons compte, mais c’est le Dr Ortega-Arenas qui décide du traitement après vous avoir évalué ici, et il en assume la responsabilité."></div>
    <h2 data-es="Cómo se realiza" data-en="How it works" data-fr="Déroulement"></h2>
    <ol>
      <li data-es="&lt;strong&gt;Valoración médica previa obligatoria&lt;/strong&gt; por el Dr. Ortega-Arenas, en su hotel o domicilio. El médico llega primero y valora si la hidratación intravenosa está indicada." data-en="&lt;strong&gt;Mandatory prior medical assessment&lt;/strong&gt; by Dr. Ortega-Arenas at your hotel or home. The physician arrives first and assesses whether IV hydration is indicated." data-fr="&lt;strong&gt;Évaluation médicale préalable obligatoire&lt;/strong&gt; par le Dr Ortega-Arenas, à votre hôtel ou à domicile. Le médecin arrive en premier et évalue si l’hydratation intraveineuse est indiquée."></li>
      <li data-es="Si la hidratación intravenosa no está clínicamente indicada, no se aplica. En ese caso solo se cobran la visita y los materiales de la valoración; no se cobran los $1,800 ni el honorario de enfermería." data-en="If IV hydration is not clinically indicated, it is not given. In that case, only the visit and the materials used in the assessment are charged; neither the $1,800 fee nor the nursing fee is charged." data-fr="Si l’hydratation intraveineuse n’est pas cliniquement indiquée, elle n’est pas administrée. Dans ce cas, seuls la visite et le matériel utilisé pour l’évaluation sont facturés ; ni les $1,800 ni les honoraires infirmiers ne sont facturés."></li>
      <li data-es="Si está indicada, el médico la prescribe por escrito&lt;sup&gt;2&lt;/sup&gt; y usted firma el consentimiento informado." data-en="If it is indicated, the physician prescribes it in writing&lt;sup&gt;2&lt;/sup&gt; and you sign the informed consent form." data-fr="Si elle est indiquée, le médecin la prescrit par écrit&lt;sup&gt;2&lt;/sup&gt; et vous signez le formulaire de consentement éclairé."></li>
      <li data-es="El médico llama a la enfermera, que llega en aproximadamente 1 h 30 min, según el tráfico. Personal de enfermería con cédula profesional coloca la vía intravenosa siguiendo las órdenes y bajo la supervisión del médico. La NOM-022-SSA3-2012 indica que la terapia de infusión la aplique preferentemente personal profesional de salud.&lt;sup&gt;2&lt;/sup&gt;" data-en="The physician calls the nurse, who arrives in about 1 h 30 min, depending on traffic. A licensed nurse places the IV line following the physician’s orders and under his supervision. The Mexican standard NOM-022-SSA3-2012 states that infusion therapy should preferably be given by licensed health professionals.&lt;sup&gt;2&lt;/sup&gt;" data-fr="Le médecin appelle l’infirmier(ère), qui arrive en 1 h 30 environ, selon la circulation. Un(e) infirmier(ère) titulaire d’une licence professionnelle mexicaine (cédula) pose la voie veineuse en suivant les prescriptions et sous la supervision du médecin. La norme mexicaine NOM-022-SSA3-2012 indique que la thérapie par perfusion doit de préférence être administrée par des professionnels de santé.&lt;sup&gt;2&lt;/sup&gt;"></li>
      <li data-es="&lt;strong&gt;Si prefiere evitar la espera&lt;/strong&gt;, puede pedir que la enfermera llegue junto con el médico. En ese caso, su honorario se cobra aunque la valoración muestre que la hidratación intravenosa no está indicada." data-en="&lt;strong&gt;If you prefer to avoid the wait&lt;/strong&gt;, you can ask for the nurse to arrive together with the physician. In that case, the nursing fee is charged even if the assessment shows that IV hydration is not indicated." data-fr="&lt;strong&gt;Si vous préférez éviter l’attente&lt;/strong&gt;, vous pouvez demander que l’infirmier(ère) arrive en même temps que le médecin. Dans ce cas, ses honoraires sont facturés même si l’évaluation montre que l’hydratation intraveineuse n’est pas indiquée."></li>
    </ol>
    <h2 data-es="Cuándo puede estar indicada" data-en="When it may be indicated" data-fr="Quand elle peut être indiquée"></h2>
    <p data-es="La rehidratación oral es el tratamiento de primera elección en la deshidratación leve a moderada, incluso cuando hay vómito.&lt;sup&gt;1&lt;/sup&gt; La vía intravenosa puede considerarse cuando un intento adecuado de rehidratación oral fracasa, según la valoración médica.&lt;sup&gt;1&lt;/sup&gt; No se ofrece para bienestar, resaca, energía ni rendimiento." data-en="Oral rehydration is the first-choice treatment for mild to moderate dehydration, even when there is vomiting.&lt;sup&gt;1&lt;/sup&gt; The IV route may be considered when an adequate attempt at oral rehydration fails, as judged at the medical assessment.&lt;sup&gt;1&lt;/sup&gt; It is not offered for wellness, hangover, energy or performance." data-fr="La réhydratation orale est le traitement de premier choix de la déshydratation légère à modérée, même en cas de vomissements.&lt;sup&gt;1&lt;/sup&gt; La voie intraveineuse peut être envisagée lorsqu’une tentative adéquate de réhydratation orale échoue, selon l’évaluation médicale.&lt;sup&gt;1&lt;/sup&gt; Elle n’est pas proposée pour le bien-être, la gueule de bois, l’énergie ou la performance."></p>
    <h2 data-es="Qué incluye · $1,800 MXN" data-en="What is included · $1,800 MXN" data-fr="Ce qui est inclus · $1,800 MXN"></h2>
    <ul>
      <li data-es="Solución fisiológica (cloruro de sodio al 0.9 %) por vía intravenosa.&lt;sup&gt;1&lt;/sup&gt;" data-en="Normal saline (0.9% sodium chloride) given intravenously.&lt;sup&gt;1&lt;/sup&gt;" data-fr="Sérum physiologique (chlorure de sodium à 0,9 %) par voie intraveineuse.&lt;sup&gt;1&lt;/sup&gt;"></li>
      <li data-es="Si la valoración lo indica, puede administrarse un antiemético o un analgésico. Antes de aplicarlo, el médico le explica cuál, para qué y sus posibles efectos adversos. La evidencia sobre el beneficio de los antieméticos en adultos es limitada, por eso se decide caso por caso.&lt;sup&gt;4&lt;/sup&gt;" data-en="If the assessment indicates it, an antiemetic or a pain reliever may be given. Before giving it, the physician explains which one, why, and its possible side effects. Evidence on the benefit of antiemetics in adults is limited, so this is decided case by case.&lt;sup&gt;4&lt;/sup&gt;" data-fr="Si l’évaluation l’indique, un antiémétique ou un antalgique peut être administré. Avant de l’administrer, le médecin vous explique lequel, pourquoi et ses effets indésirables possibles. Les données sur le bénéfice des antiémétiques chez l’adulte sont limitées ; la décision se prend donc au cas par cas.&lt;sup&gt;4&lt;/sup&gt;"></li>
      <li data-es="No se añaden vitaminas, minerales ni otros complementos: no hay evidencia de calidad de que las infusiones de vitaminas aporten beneficio a personas sin una deficiencia o enfermedad específica.&lt;sup&gt;5&lt;/sup&gt;" data-en="No vitamins, minerals or other supplements are added: there is no high-quality evidence that vitamin infusions benefit people without a specific deficiency or medical condition.&lt;sup&gt;5&lt;/sup&gt;" data-fr="Aucune vitamine, aucun minéral ni autre complément n’est ajouté : aucune donnée de qualité ne montre que les perfusions de vitamines apportent un bénéfice aux personnes sans carence ni maladie spécifique.&lt;sup&gt;5&lt;/sup&gt;"></li>
    </ul>
    <h2 data-es="Cuánto cuesta en total" data-en="Total cost" data-fr="Coût total"></h2>
    <div class="callout">
      <p data-es="<strong>Total = $1,800 + honorario de visita + honorario de enfermería</strong>" data-en="<strong>Total = $1,800 + visit fee + nursing fee</strong>" data-fr="<strong>Total = $1,800 + honoraires de visite + honoraires infirmiers</strong> (+ l’assistante de traduction si vous la demandez : mêmes honoraires que l’infirmière, <span data-tarifa='asistente-frances'></span>, <span data-tarifa='asistente-frances-especial'></span> ou <span data-tarifa='asistente-frances-festivo'></span> MXN selon l’horaire, réglés lors de la visite)"></p>

    <h3 data-es="Calcule su costo" data-en="Estimate your cost" data-fr="Estimez le coût"></h3>

    <h2 data-es="Riesgos y límites" data-en="Risks and limits" data-fr="Risques et limites"></h2>
    <p data-es="La hidratación intravenosa no sustituye a la vía oral cuando esta es posible.&lt;sup&gt;1&lt;/sup&gt; Conlleva riesgos, como flebitis, infiltración o extravasación, infección del sitio de punción y sobrecarga de líquidos.&lt;sup&gt;2,3,6&lt;/sup&gt; Por eso solo se aplica si la valoración médica la justifica." data-en="IV hydration does not replace drinking fluids when that is possible.&lt;sup&gt;1&lt;/sup&gt; It carries risks, such as phlebitis, infiltration or extravasation, infection at the insertion site and fluid overload.&lt;sup&gt;2,3,6&lt;/sup&gt; That is why it is given only if the medical assessment justifies it." data-fr="L’hydratation intraveineuse ne remplace pas l’hydratation orale lorsque celle-ci est possible.&lt;sup&gt;1&lt;/sup&gt; Elle comporte des risques, comme la phlébite, l’infiltration ou l’extravasation, l’infection au point de ponction et la surcharge liquidienne.&lt;sup&gt;2,3,6&lt;/sup&gt; C’est pourquoi elle n’est administrée que si l’évaluation médicale la justifie."></p>
    <h2 data-es="Cuándo acudir directamente a urgencias" data-en="When to go straight to the emergency room" data-fr="Quand aller directement aux urgences"></h2>
    <div class="emergency-note" data-es="Si presenta alguno de estos signos, &lt;strong&gt;no solicite este servicio: llame al 911&lt;/strong&gt; o acuda a urgencias hospitalarias: alteración del estado de conciencia (somnolencia, confusión, desmayo), dolor en el pecho, dificultad para respirar, deshidratación grave (no poder beber o beber muy poco, casi no orinar, mareo intenso, pulso rápido o signos de choque), vómito con sangre, vómito o diarrea que no mejoran o empeoran a pesar del tratamiento, sangre o pus en las heces o heces negras, fiebre de más de 38.3 °C, o dolor abdominal intenso o que no se quita después de evacuar.&lt;sup&gt;1,7,8,9,12&lt;/sup&gt;" data-en="If you have any of these signs, &lt;strong&gt;do not book this service: call 911&lt;/strong&gt; or go to a hospital emergency room: altered consciousness (drowsiness, confusion, fainting), chest pain, trouble breathing, severe dehydration (unable to drink or drinking very little, passing almost no urine, severe dizziness, a fast pulse or signs of shock), vomiting blood, vomiting or diarrhea that does not improve or gets worse despite treatment, blood or pus in the stool or black stools, fever above 38.3 °C (101 °F), or severe abdominal pain or pain that does not go away after a bowel movement.&lt;sup&gt;1,7,8,9,12&lt;/sup&gt;" data-fr="Si vous présentez l’un de ces signes, &lt;strong&gt;ne demandez pas ce service : appelez le 911&lt;/strong&gt; ou rendez-vous aux urgences d’un hôpital : altération de l’état de conscience (somnolence, confusion, évanouissement), douleur thoracique, difficulté à respirer, déshydratation grave (impossibilité de boire ou boire très peu, quasi-absence d’urine, vertiges intenses, pouls rapide ou signes de choc), vomissements de sang, vomissements ou diarrhée qui ne s’améliorent pas ou s’aggravent malgré le traitement, sang ou pus dans les selles ou selles noires, fièvre supérieure à 38,3 °C, ou douleur abdominale intense ou qui ne passe pas après être allé à la selle.&lt;sup&gt;1,7,8,9,12&lt;/sup&gt;"></div>
    <p data-es="&lt;strong&gt;Servicio solo para adultos (18 años o más). No se atiende a personas embarazadas.&lt;/strong&gt;" data-en="&lt;strong&gt;Adults only (18 years and older). We do not see pregnant patients.&lt;/strong&gt;" data-fr="&lt;strong&gt;Réservé aux adultes (18 ans et plus). Nous ne recevons pas les personnes enceintes.&lt;/strong&gt;"></p>
    <h3 data-es="Requieren valoración previa y pueden contraindicar la terapia" data-en="Require prior assessment and may rule out the therapy" data-fr="Nécessitent une évaluation préalable et peuvent contre-indiquer la thérapie"></h3>
    <ul>
      <li data-es="Insuficiencia cardiaca o renal conocida, por el riesgo de sobrecarga de líquidos.&lt;sup&gt;6&lt;/sup&gt;" data-en="Known heart or kidney failure, because of the risk of fluid overload.&lt;sup&gt;6&lt;/sup&gt;" data-fr="Insuffisance cardiaque ou rénale connue, en raison du risque de surcharge liquidienne.&lt;sup&gt;6&lt;/sup&gt;"></li>
    </ul>
    <div class="emergency-note" data-es="&lt;strong&gt;No es un servicio de urgencias.&lt;/strong&gt; Ante una emergencia, llame al &lt;strong&gt;911&lt;/strong&gt; o acuda a urgencias hospitalarias." data-en="&lt;strong&gt;This is not an emergency service.&lt;/strong&gt; In an emergency, call &lt;strong&gt;911&lt;/strong&gt; or go to a hospital emergency room." data-fr="&lt;strong&gt;Ce n’est pas un service d’urgences.&lt;/strong&gt; En cas d’urgence, appelez le &lt;strong&gt;911&lt;/strong&gt; ou rendez-vous aux urgences d’un hôpital."></div>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="¿Necesito receta?" data-en="Do I need a prescription?" data-fr="Ai-je besoin d’une ordonnance ?"></h3>
      <p data-es="No necesita traer una receta. La indicación la define el Dr. Ortega-Arenas en la valoración médica previa, que es obligatoria; sin ella, la hidratación intravenosa no se aplica." data-en="You do not need to bring a prescription. Dr. Ortega-Arenas decides whether it is indicated during the mandatory prior medical assessment; without it, IV hydration is not given." data-fr="Vous n’avez pas besoin d’apporter d’ordonnance. Le Dr Ortega-Arenas détermine l’indication lors de l’évaluation médicale préalable, qui est obligatoire ; sans elle, l’hydratation intraveineuse n’est pas administrée."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Puedo pedir que me la apliquen aunque el médico no la indique?" data-en="Can I ask for it even if the physician does not prescribe it?" data-fr="Puis-je la demander même si le médecin ne la prescrit pas ?"></h3>
      <p data-es="No. La indicación es del médico, después de la consulta. Si la hidratación intravenosa no está indicada, no se aplica; en ese caso solo se cobran la visita y los materiales de la valoración, más el honorario de enfermería si usted pidió que la enfermera llegara junto con el médico." data-en="No. The indication is the physician’s call, after the consultation. If IV hydration is not indicated, it is not given; in that case, only the visit and the materials used in the assessment are charged, plus the nursing fee if you asked for the nurse to arrive with the physician." data-fr="Non. L’indication relève du médecin, après la consultation. Si l’hydratation intraveineuse n’est pas indiquée, elle n’est pas administrée ; dans ce cas, seuls la visite et le matériel utilisé pour l’évaluation sont facturés, ainsi que les honoraires infirmiers si vous avez demandé que l’infirmière arrive avec le médecin."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Pueden aplicar antibióticos intravenosos en mi hotel?" data-en="Can you give IV antibiotics at my hotel?" data-fr="Pouvez-vous administrer des antibiotiques par voie intraveineuse à mon hôtel ?"></h3>
      <p data-es="No. Aplicamos terapia intravenosa con líquidos y, si hace falta, medicamento para el vómito o el dolor, pero no aplicamos antibióticos por vena en hotel ni domicilio. Si la valoración muestra que necesita un antibiótico por vena, le referimos al hospital, donde se le puede vigilar adecuadamente. Además, en la diarrea del viajero los casos leves suelen mejorar sin antibiótico, y cuando el médico considera necesario uno, la guía internacional de referencia recomienda opciones por boca.&lt;sup&gt;10&lt;/sup&gt;" data-en="No. We give IV therapy with fluids and, if needed, medicine for vomiting or pain, but we do not give IV antibiotics at hotels or homes. If the assessment shows you need an IV antibiotic, we refer you to a hospital, where you can be monitored properly. Also, in travelers’ diarrhea, mild cases usually get better without antibiotics, and when the physician considers one necessary, the international reference guideline recommends options taken by mouth.&lt;sup&gt;10&lt;/sup&gt;" data-fr="Non. Nous administrons une thérapie intraveineuse avec des liquides et, si nécessaire, un médicament contre les vomissements ou la douleur, mais nous n’administrons pas d’antibiotiques par voie intraveineuse à l’hôtel ni à domicile. Si l’évaluation montre que vous avez besoin d’un antibiotique par voie intraveineuse, nous vous orientons vers un hôpital, où vous pouvez être surveillé(e) correctement. Par ailleurs, dans la diarrhée du voyageur, les cas légers s’améliorent généralement sans antibiotique, et lorsque le médecin en juge un nécessaire, la recommandation internationale de référence préconise des options par la bouche.&lt;sup&gt;10&lt;/sup&gt;"></p>
    </div>
    <div class="faq-item">
      <h3 data-es="Ya tengo una receta o un médico de mi país me indicó qué aplicarme. ¿La pueden seguir?" data-en="I already have a prescription, or a doctor back home told me what to get. Can you follow it?" data-fr="J’ai déjà une ordonnance, ou un médecin de mon pays m’a indiqué quoi recevoir. Pouvez-vous la suivre ?"></h3>
      <p data-es="La tomamos en cuenta como un antecedente valioso: compártala, junto con sus estudios si los tiene. Pero en México solo pueden recetar los profesionales de la salud autorizados por la ley, con cédula profesional expedida por las autoridades educativas del país,&lt;sup&gt;11&lt;/sup&gt; y quien le atiende aquí responde por lo que se le aplica. Por eso el Dr. Ortega-Arenas hace su propia valoración y decide el tratamiento, que puede coincidir o no con lo que le indicaron." data-en="We take it into account as a valuable part of your medical history: please share it, along with any test results you have. However, in Mexico only health professionals authorized by law and holding a professional license (cédula profesional) issued by Mexican education authorities may prescribe,&lt;sup&gt;11&lt;/sup&gt; and the physician treating you here is responsible for what you receive. That is why Dr. Ortega-Arenas carries out a separate assessment and decides the treatment, which may or may not match what you were told." data-fr="Nous en tenons compte comme d’un antécédent précieux : partagez-la, avec vos examens si vous en avez. Mais au Mexique, seuls les professionnels de santé autorisés par la loi et titulaires d’une cédula profesional délivrée par les autorités éducatives mexicaines peuvent prescrire,&lt;sup&gt;11&lt;/sup&gt; et le médecin qui vous soigne ici est responsable de ce qui vous est administré. C’est pourquoi le Dr Ortega-Arenas réalise sa propre évaluation et décide du traitement, qui peut correspondre ou non à ce qui vous a été indiqué."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Nos pueden ayudar a evitar ir a urgencias?" data-en="Can you help us avoid going to the emergency room?" data-fr="Pouvez-vous nous aider à éviter les urgences ?"></h3>
      <p data-es="No podemos prometerlo: este no es un servicio de urgencias. Si no hay signos de alarma (vea la sección Cuándo acudir directamente a urgencias), el médico le valora en su hotel o domicilio. En la deshidratación leve a moderada, lo primero es la rehidratación oral;&lt;sup&gt;1&lt;/sup&gt; si no es suficiente y la valoración lo justifica, se le pueden aplicar líquidos por vena&lt;sup&gt;1&lt;/sup&gt; y medicamento para el vómito.&lt;sup&gt;1,4&lt;/sup&gt; Si el médico encuentra datos de que necesita atención hospitalaria, se lo dice con claridad y le orienta sobre a dónde acudir. Si aparece un signo de alarma mientras espera la visita, no espere: llame al 911 o acuda a urgencias." data-en="We cannot promise that: this is not an emergency service. If there are no warning signs (see the section When to go straight to the emergency room), the physician assesses you at your hotel or home. For mild to moderate dehydration, oral rehydration comes first;&lt;sup&gt;1&lt;/sup&gt; if it is not enough and the assessment justifies it, IV fluids&lt;sup&gt;1&lt;/sup&gt; and medicine for vomiting can be given.&lt;sup&gt;1,4&lt;/sup&gt; If the physician finds that you need hospital care, you will be told clearly and guided on where to go. If a warning sign appears while you wait for the visit, do not wait: call 911 or go to an emergency room." data-fr="Nous ne pouvons pas le promettre : ce n’est pas un service d’urgences. En l’absence de signes d’alerte (voir la section Quand aller directement aux urgences), le médecin vous évalue à votre hôtel ou à domicile. En cas de déshydratation légère à modérée, la réhydratation orale passe en premier ;&lt;sup&gt;1&lt;/sup&gt; si elle ne suffit pas et que l’évaluation le justifie, des liquides par voie intraveineuse&lt;sup&gt;1&lt;/sup&gt; et un médicament contre les vomissements peuvent être administrés.&lt;sup&gt;1,4&lt;/sup&gt; Si le médecin constate que vous avez besoin de soins hospitaliers, il vous le dit clairement et vous oriente vers le bon endroit. Si un signe d’alerte apparaît pendant que vous attendez la visite, n’attendez pas : appelez le 911 ou rendez-vous aux urgences."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Por qué no incluye vitaminas?" data-en="Why are no vitamins included?" data-fr="Pourquoi n’y a-t-il pas de vitamines ?"></h3>
      <p data-es="Porque no hay evidencia de calidad de que las infusiones de vitaminas aporten beneficio a personas sin una deficiencia o enfermedad específica, y las dosis altas pueden causar daño.&lt;sup&gt;5&lt;/sup&gt; Por eso no se incluyen." data-en="Because there is no high-quality evidence that vitamin infusions benefit people without a specific deficiency or medical condition, and high doses may cause harm.&lt;sup&gt;5&lt;/sup&gt; That is why they are not included." data-fr="Parce qu’aucune donnée de qualité ne montre que les perfusions de vitamines apportent un bénéfice aux personnes sans carence ni maladie spécifique, et les fortes doses peuvent être nocives.&lt;sup&gt;5&lt;/sup&gt; C’est pourquoi elles ne sont pas incluses."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuánto dura?" data-en="How long does it take?" data-fr="Combien de temps dure-t-elle ?"></h3>
      <p data-es="Si está indicada, la enfermera llega aproximadamente 1 h 30 min después de que el médico la llama. La infusión depende del volumen que se indique en la valoración. El médico le informa el tiempo estimado antes de que firme el consentimiento informado." data-en="If it is indicated, the nurse arrives about 1 h 30 min after the physician calls. The infusion time depends on the volume indicated at the assessment. The physician tells you the estimated time before you sign the informed consent form." data-fr="Si elle est indiquée, l’infirmier(ère) arrive environ 1 h 30 après l’appel du médecin. La durée de la perfusion dépend du volume indiqué lors de l’évaluation. Le médecin vous indique la durée estimée avant que vous ne signiez le formulaire de consentement éclairé."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Qué pasa si no es para mí?" data-en="What if it is not right for me?" data-fr="Et si elle ne me convient pas ?"></h3>
      <p data-es="Si la valoración muestra que la hidratación intravenosa no está clínicamente indicada, no se aplica. Solo se cobran la visita y los materiales de la valoración; no se cobran los $1,800 ni el honorario de enfermería, salvo que usted haya pedido que la enfermera llegara junto con el médico." data-en="If the assessment shows that IV hydration is not clinically indicated, it is not given. Only the visit and the materials used in the assessment are charged; neither the $1,800 fee nor the nursing fee is charged, unless you asked for the nurse to arrive together with the physician." data-fr="Si l’évaluation montre que l’hydratation intraveineuse n’est pas cliniquement indiquée, elle n’est pas administrée. Seuls la visite et le matériel utilisé pour l’évaluation sont facturés ; ni les $1,800 ni les honoraires infirmiers ne sont facturés, sauf si vous avez demandé que l’infirmier(ère) arrive en même temps que le médecin."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuánto cuesta en total?" data-en="What is the total cost?" data-fr="Quel est le coût total ?"></h3>
      <p data-es="$1,800 + honorario de visita + honorario de enfermería. Por ejemplo, con visita a hotel en Zona A y enfermería en horario ordinario: $1,800 + $2,500 + $1,500 = $5,800 MXN." data-en="$1,800 + visit fee + nursing fee. For example, with a hotel visit in Zone A and nursing during standard hours: $1,800 + $2,500 + $1,500 = $5,800 MXN." data-fr="$1,800 + honoraires de visite + honoraires infirmiers. Par exemple, avec une visite à l’hôtel en zone A et des soins infirmiers en horaire ordinaire : $1,800 + $2,500 + $1,500 = $5,800 MXN."></p>
    </div>
