        <p data-es="Texto en español" data-en="English text"></p>

  - Enlaces que cambian por idioma: href="/ruta-es/" data-href-en="/en/ruta-en/".
  - Un bloque que solo existe en un idioma: data-solo="es" (y entonces no necesita data-en).
  - Usar solo las clases ya definidas en plantilla.html (page-hero, page-body, prose,
    side-card, callout, emergency-note, review-meta, ref-list, hero-cta, ghost…).
  - Comillas dentro de atributos: usar &quot; o comillas simples en el HTML interno.
-->
