  <h1 class="page-h1" data-es="Diarrea del <em>viajero</em>" data-en="Traveler's <em>diarrhea</em>" data-fr="Diarrhée du <em>voyageur</em>"></h1>
  <p class="page-lead" data-es="La diarrea del viajero es una infección intestinal que se adquiere con agua o alimentos contaminados, causada sobre todo por bacterias, y suele mejorar en pocos días con una buena hidratación. Esta guía explica cómo prevenirla, cómo hidratarse y cuándo consultar a un médico." data-en="Traveler's diarrhea is an intestinal infection picked up from contaminated food or water, caused mostly by bacteria, and it usually improves within a few days with good hydration. This guide explains how to prevent it, how to rehydrate and when to see a doctor." data-fr="La diarrhée du voyageur est une infection intestinale contractée par l’eau ou les aliments contaminés, causée surtout par des bactéries, et elle s’améliore généralement en quelques jours avec une bonne hydratation. Ce guide explique comment la prévenir, comment vous réhydrater et quand consulter un médecin."></p>
</header>

<div class="sep"></div>

<main class="page-body">
  <article class="prose">
    <h2 data-es="Qué es" data-en="What it is" data-fr="De quoi s’agit-il&nbsp;?"></h2>
    <p data-es="Es el problema de salud más previsible en los viajes: según los CDC, entre el 30 y el 70 % de los viajeros la presentan en un periodo de dos semanas, según el destino y la temporada. La mayoría de los casos se debe a bacterias; también puede deberse a virus o parásitos." data-en="It is the most predictable travel-related illness: according to the CDC, 30% to 70% of travelers get it over a two-week period, depending on the destination and season. Most cases are caused by bacteria; viruses or parasites can also cause it." data-fr="C’est le problème de santé le plus prévisible en voyage : selon les CDC, 30 % à 70 % des voyageurs en sont atteints sur une période de deux semaines, selon la destination et la saison. La plupart des cas sont dus à des bactéries ; des virus ou des parasites peuvent aussi en être la cause."></p>
    <p data-es="Se manifiesta con evacuaciones sueltas o líquidas y frecuentes, y puede acompañarse de cólicos, náuseas o fiebre." data-en="It causes frequent loose or watery stools and may come with cramps, nausea or fever." data-fr="Elle se manifeste par des selles molles ou liquides et fréquentes, et peut s’accompagner de crampes, de nausées ou de fièvre."></p>

    <h2 data-es="Cómo prevenirla" data-en="How to prevent it" data-fr="Comment la prévenir"></h2>
    <ul>
      <li data-es="Lávese las manos con agua y jabón antes de comer y después de ir al baño. Si no hay, use gel con al menos 60 % de alcohol." data-en="Wash your hands with soap and water before eating and after using the bathroom. If they are not available, use hand sanitizer with at least 60% alcohol." data-fr="Lavez-vous les mains à l’eau et au savon avant de manger et après être allé aux toilettes. À défaut, utilisez un gel hydroalcoolique contenant au moins 60 % d’alcool."></li>
      <li data-es="Tome solo bebidas en envase sellado, o agua hervida o purificada." data-en="Drink only beverages from sealed containers, or boiled or purified water." data-fr="Ne buvez que des boissons en récipient scellé, ou de l’eau bouillie ou purifiée."></li>
      <li data-es="Evite el hielo, salvo que esté seguro de que se hizo con agua segura." data-en="Avoid ice unless you are sure it was made with safe water." data-fr="Évitez la glace, sauf si vous êtes sûr qu’elle a été faite avec de l’eau sûre."></li>
      <li data-es="Prefiera alimentos bien cocidos y servidos calientes." data-en="Choose foods that are fully cooked and served hot." data-fr="Privilégiez les aliments bien cuits et servis chauds."></li>
      <li data-es="Evite ensaladas, verduras crudas, carnes, pescados, mariscos y huevo crudos o poco cocidos, así como lácteos y jugos sin pasteurizar." data-en="Avoid salads, raw vegetables, raw or undercooked meat, fish, shellfish and eggs, and unpasteurized dairy and juices." data-fr="Évitez les salades, les légumes crus, la viande, le poisson, les fruits de mer et les œufs crus ou insuffisamment cuits, ainsi que les produits laitiers et les jus non pasteurisés."></li>
      <li data-es="Elija fruta que pueda pelar usted mismo después de lavarla con agua segura." data-en="Choose fruit you can peel yourself after rinsing it with safe water." data-fr="Choisissez des fruits que vous pouvez éplucher vous-même après les avoir rincés à l’eau sûre."></li>
      <li data-es="Tenga precaución con los alimentos y bebidas de puestos en la calle." data-en="Be careful with food and drinks from street stalls." data-fr="Soyez prudent avec les aliments et les boissons vendus dans les stands de rue."></li>
      <li data-es="Use agua embotellada o purificada también para lavarse los dientes." data-en="Use bottled or purified water to brush your teeth as well." data-fr="Utilisez aussi de l’eau en bouteille ou purifiée pour vous brosser les dents."></li>
    </ul>
    <p data-es="Estas medidas reducen el riesgo, pero no lo eliminan." data-en="These measures lower the risk, but they do not eliminate it." data-fr="Ces mesures réduisent le risque, mais ne l’éliminent pas."></p>

    <h2 data-es="Cómo hidratarse" data-en="How to rehydrate" data-fr="Comment vous réhydrater"></h2>
    <p data-es="Reponer los líquidos es clave en el tratamiento. Si la diarrea es leve, basta con beber más líquidos de lo habitual. Si las evacuaciones son frecuentes y abundantes, use suero de rehidratación oral, que se vende en farmacias, y prepárelo con agua segura según las instrucciones del envase." data-en="Replacing fluids is key to treatment. If the diarrhea is mild, drinking more fluids than usual is enough. If stools are frequent and abundant, use oral rehydration solution, sold in pharmacies, and prepare it with safe water following the package instructions." data-fr="Remplacer les liquides est essentiel au traitement. Si la diarrhée est légère, il suffit de boire plus que d’habitude. Si les selles sont fréquentes et abondantes, utilisez une solution de réhydratation orale, vendue en pharmacie, et préparez-la avec de l’eau sûre en suivant les instructions de l’emballage."></p>
    <p data-es="Evite los refrescos y las bebidas muy azucaradas, porque si se toman en cantidad pueden empeorar la diarrea." data-en="Avoid soda and very sugary drinks, because if drunk in large amounts they can make diarrhea worse." data-fr="Évitez les sodas et les boissons très sucrées, car, consommés en grande quantité, ils peuvent aggraver la diarrhée."></p>

    <h2 data-es="Medicamentos: siempre con valoración médica" data-en="Medicines: always with a medical assessment" data-fr="Médicaments : toujours sur avis médical"></h2>
    <p data-es="En la mayoría de los casos leves no se necesitan antibióticos. Los antibióticos requieren receta médica y una valoración que considere la intensidad de los síntomas y si hay fiebre o sangre en las heces, porque también tienen efectos adversos." data-en="Most mild cases do not need antibiotics. Antibiotics require a prescription and an assessment that considers how severe the symptoms are and whether there is fever or blood in the stool, because they also have side effects." data-fr="La plupart des cas légers ne nécessitent pas d’antibiotiques. Les antibiotiques exigent une ordonnance et une évaluation qui tienne compte de l’intensité des symptômes et de la présence de fièvre ou de sang dans les selles, car ils ont aussi des effets indésirables."></p>
    <p data-es="Los medicamentos que disminuyen las evacuaciones no deben usarse solos si hay fiebre o sangre en las heces. Consulte a un médico antes de tomar cualquier medicamento, sobre todo si está embarazada, toma otros medicamentos o tiene una enfermedad crónica." data-en="Medicines that slow down bowel movements should not be used alone if there is fever or blood in the stool. Check with a doctor before taking any medicine, especially if you are pregnant, take other medicines or have a chronic condition." data-fr="Les médicaments qui ralentissent le transit ne doivent pas être utilisés seuls en cas de fièvre ou de sang dans les selles. Consultez un médecin avant de prendre tout médicament, surtout si vous êtes enceinte, prenez d’autres médicaments ou avez une maladie chronique."></p>

    <h2 data-es="Cuándo consultar a un médico" data-en="When to see a doctor" data-fr="Quand consulter un médecin"></h2>
    <p data-es="Consulte a un médico si presenta cualquiera de estos signos:" data-en="See a doctor if you have any of these signs:" data-fr="Consultez un médecin si vous présentez l’un de ces signes :"></p>
    <ul>
      <li data-es="Sangre en las heces." data-en="Blood in the stool." data-fr="Sang dans les selles."></li>
      <li data-es="Fiebre alta (más de 38.9 °C)." data-en="High fever (over 38.9 °C / 102 °F)." data-fr="Fièvre élevée (plus de 38,9 °C / 102 °F)."></li>
      <li data-es="Signos de deshidratación leve a moderada: sed intensa, boca seca, orinar menos de lo habitual, mareo al ponerse de pie." data-en="Signs of mild to moderate dehydration: intense thirst, dry mouth, passing less urine than usual, dizziness when standing up." data-fr="Signes de déshydratation légère à modérée : soif intense, bouche sèche, urines moins abondantes que d’habitude, étourdissements en se levant."></li>
      <li data-es="Vómito que le dificulta beber." data-en="Vomiting that makes it hard to drink." data-fr="Vomissements qui empêchent de boire suffisamment."></li>
      <li data-es="Diarrea que no mejora después de unos días." data-en="Diarrhea that does not improve after a few days." data-fr="Diarrhée qui ne s’améliore pas après quelques jours."></li>
      <li data-es="Embarazo, edad avanzada o una enfermedad crónica." data-en="Pregnancy, older age or a chronic condition." data-fr="Grossesse, âge avancé ou maladie chronique."></li>
    </ul>
    <div class="emergency-note" data-es="&lt;strong&gt;Llame al 911 o acuda a urgencias&lt;/strong&gt; si no puede beber ni retener nada, casi no orina, o hay somnolencia, confusión o desmayo." data-en="&lt;strong&gt;Call 911 or go to an emergency room&lt;/strong&gt; if you cannot drink or keep anything down, pass almost no urine, or have drowsiness, confusion or fainting." data-fr="&lt;strong&gt;Appelez le 911 ou rendez-vous aux urgences&lt;/strong&gt; si vous ne pouvez rien boire ni rien garder, si vous n’urinez presque pas, ou en cas de somnolence, de confusion ou d’évanouissement."></div>

    <h2 data-es="Preguntas frecuentes" data-en="Frequently asked questions" data-fr="Questions fréquentes"></h2>
    <div class="faq-item">
      <h3 data-es="¿Puedo tomar agua de la llave?" data-en="Can I drink tap water?" data-fr="Puis-je boire l’eau du robinet ?"></h3>
      <p data-es="Es preferible no hacerlo. Para beber y lavarse los dientes, use agua embotellada, hervida o purificada, y evite el hielo si no sabe con qué agua se hizo." data-en="It is better not to. To drink and brush your teeth, use bottled, boiled or purified water, and avoid ice if you do not know what water it was made with." data-fr="Mieux vaut ne pas le faire. Pour boire et vous brosser les dents, utilisez de l’eau en bouteille, bouillie ou purifiée, et évitez la glace si vous ne savez pas avec quelle eau elle a été faite."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Necesito antibióticos para la diarrea del viajero?" data-en="Do I need antibiotics for traveler's diarrhea?" data-fr="Ai-je besoin d’antibiotiques pour la diarrhée du voyageur ?"></h3>
      <p data-es="En la mayoría de los casos leves, no. Los antibióticos requieren receta y una valoración médica que considere la intensidad de los síntomas, la fiebre y la presencia de sangre en las heces." data-en="In most mild cases, no. Antibiotics require a prescription and a medical assessment that considers how severe the symptoms are, fever and blood in the stool." data-fr="Dans la plupart des cas légers, non. Les antibiotiques exigent une ordonnance et une évaluation médicale qui tienne compte de l’intensité des symptômes, de la fièvre et de la présence de sang dans les selles."></p>
    </div>
    <div class="faq-item">
      <h3 data-es="¿Cuándo debo ver a un médico?" data-en="When should I see a doctor?" data-fr="Quand dois-je consulter un médecin ?"></h3>
      <p data-es="Si hay sangre en las heces, fiebre alta, signos de deshidratación o vómito que impide beber, si no mejora después de 3 días, o si está embarazada, es de edad avanzada o tiene una enfermedad crónica." data-en="If there is blood in the stool, high fever, signs of dehydration or vomiting that keeps you from drinking, if it does not improve after 3 days, or if you are pregnant, older or have a chronic condition." data-fr="En cas de sang dans les selles, de fièvre élevée, de signes de déshydratation ou de vomissements qui vous empêchent de boire, si cela ne s’améliore pas après 3 jours, ou si vous êtes enceinte, âgé ou avez une maladie chronique."></p>
    </div>

    <div class="emergency-note" data-es="<strong>Ante una emergencia, llame al 911</strong> o acuda a urgencias hospitalarias. Vea también <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias en la Ciudad de México</a>." data-en="<strong>In an emergency, call 911</strong> or go to a hospital emergency room. See also <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER in Mexico City</a>." data-fr="<strong>En cas d’urgence, appelez le 911</strong> ou rendez-vous aux urgences d’un hôpital. Voir aussi <a href='/fr/guides/urgences-mexico/'>quand aller aux urgences à Mexico</a>."></div>

    <div class="callout" data-solo="fr" data-es="" data-en="" data-fr="<strong>Consultation en espagnol ou en anglais.</strong> Pour les patients francophones, une assistante traduit pendant la consultation (<span data-tarifa='asistente-frances'></span> MXN en supplément), sous réserve de disponibilité ; demandez-la lors de la réservation (case à cocher en ligne ; par WhatsApp pour une visite à domicile). Non disponible en téléconsultation. Sa présence est couverte par le consentement éclairé, obligatoire avant la consultation."></div>
