    <h2 data-es="Honorarios en Santa Fe" data-en="Fees in Santa Fe"></h2>
    <p data-es="Para visitas a hotel, Santa Fe está en la <strong>Zona <span data-tarifa='zona:Santa Fe'></span></strong>. La consulta a domicilio tiene su propia tarifa para Santa Fe. Montos en pesos mexicanos, por consulta:" data-en="For hotel visits, Santa Fe is in <strong>Zone <span data-tarifa='zona:Santa Fe'></span></strong>. House calls have their own Santa Fe fee. Amounts in Mexican pesos, per visit:"></p>

    <p data-es="La tarifa depende del horario y del día, y se confirma al solicitar la visita; los festivos se coordinan solo por WhatsApp. Horarios ordinario, especial y festivo en la <a href='/#tarifas'>sección de tarifas</a>, con los mismos honorarios." data-en="The fee depends on the time and day, and is confirmed when you request the visit; holidays are arranged via WhatsApp only. Standard, after-hours and holiday times are in the <a href='/en/#tarifas'>fees section</a>, with the same fees."></p>
    <p data-es="<strong>Anticipo y cancelación.</strong> La visita a hotel no requiere anticipo: se paga directamente al médico, en pesos mexicanos. La consulta a domicilio se solicita por WhatsApp y se confirma con una transferencia de <span data-tarifa='anticipo-domicilio:Santa Fe'></span>, el 50 % de la tarifa ordinaria. El resto, y en horario especial o festivo la diferencia, se paga al médico en la visita. Si cancela con al menos 3 horas de anticipación, se reembolsa el anticipo; con menos de 3 horas, o si no está en el domicilio a la hora acordada, no es reembolsable." data-en="<strong>Deposit and cancellation.</strong> Hotel visits need no deposit: they are paid directly to the doctor, in Mexican pesos. House calls are requested via WhatsApp and confirmed with a bank transfer of <span data-tarifa='anticipo-domicilio:Santa Fe'></span>, 50% of the standard fee. The rest, and the difference for after-hours or holiday visits, is paid to the doctor at the visit. If you cancel at least 3 hours in advance, the deposit is refunded; with less than 3 hours' notice, or if you are not at the address at the agreed time, it is non-refundable."></p>

    <h2 data-es="Consultorio en Santa Fe, al salir del trabajo" data-en="Santa Fe clinic, after work"></h2>
    <p data-es="El consultorio atiende con cita de lunes a viernes de 17:00 a 20:00 (la cita de las 20:00 es solo para subsecuentes) y sábado de 11:00 a 15:00, un horario pensado para quien trabaja en la zona. El consultorio está en Briyam Coworking Médico, sede Santa Fe: <span data-sede='Santa Fe'></span>. Su cita queda confirmada al pagar en línea, con tarjeta, el anticipo del 50 % (<span data-tarifa='anticipo:Santa Fe'></span> de <span data-tarifa='consultorio:Santa Fe'></span>); el resto se paga en el consultorio. Si cancela con al menos 3 horas de anticipación, se reembolsa el anticipo; con menos de 3 horas, o si no se presenta a la cita, no es reembolsable." data-en="The clinic sees patients by appointment Monday to Friday 5–8 pm (the 8:00 pm slot is for follow-up visits only) and Saturday 11 am–3 pm, hours that suit people who work in the area. The clinic is at Briyam Coworking Médico, Santa Fe location: <span data-sede='Santa Fe'></span>. Your appointment is confirmed once you pay the 50% deposit online by card (<span data-tarifa='anticipo:Santa Fe'></span> of <span data-tarifa='consultorio:Santa Fe'></span>); the rest is paid at the clinic. If you cancel at least 3 hours in advance, your deposit is refunded; with less than 3 hours' notice, or if you do not attend, it is non-refundable."></p>
    <p data-es="Si el motivo de consulta no requiere exploración física, por ejemplo un seguimiento o una duda sobre un tratamiento, también hay <a href='/#tarifas'>teleconsulta</a> por videollamada." data-en="If your visit does not need a physical examination, such as a follow-up or a question about a treatment, <a href='/en/#tarifas'>telemedicine</a> by video call is also available."></p>

    <h2 data-es="Cuánto tarda en llegar" data-en="How long it takes to arrive"></h2>
    <p data-es="Sujeto a disponibilidad, el tiempo estimado de llegada a Santa Fe es de <strong>alrededor de 1 hora 50 minutos</strong>, por la distancia y el tráfico; puede ser menos. Al reservar, envíe un WhatsApp al +52 595 109 3969 y se le confirmará una hora estimada." data-en="Subject to availability, the estimated arrival time in Santa Fe is <strong>about 1 hour 50 minutes</strong>, due to distance and traffic; it may be shorter. When you book, send a WhatsApp to +52 595 109 3969 and you will be given an estimated time."></p>
    <p data-es="Si está en un hotel o en un edificio con control de acceso, avise en recepción que espera al médico." data-en="If you are at a hotel or in a building with controlled access, let the front desk know you are expecting the doctor."></p>

    <h2 data-es="Qué puede atender el médico" data-en="What the doctor can help with"></h2>
    <p data-es="Medicina general ambulatoria para padecimientos leves, como infecciones respiratorias sin dificultad para respirar, gastroenteritis sin signos de alarma o heridas menores. Cuando hay tratamiento indicado, recibe receta por escrito; vea la <a href='/guias/farmacias-cdmx/'>guía de farmacias en la CDMX</a>. No sustituye a un hospital: vea <a href='/guias/cuando-ir-a-urgencias/'>cuándo ir a urgencias</a>." data-en="Outpatient general medicine for mild conditions, such as respiratory infections without trouble breathing, gastroenteritis without warning signs or minor cuts. When treatment is indicated, you receive a written prescription; see the <a href='/en/guides/pharmacies-mexico-city/'>Mexico City pharmacy guide</a>. It does not replace a hospital: see <a href='/en/guides/emergency-care-mexico-city/'>when to go to the ER</a>."></p>
